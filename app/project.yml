# 音声ドリルの iPhone アプリ（段4）。作り方：vault 008_project/AppBuilding/specs/20261001_oto-drill-app_実現方式.md「段4 iPhone の殻の作り」
#   ./make_secrets.sh で Secrets.xcconfig を作ってから xcodegen generate
name: OtoDrill
options:
  bundleIdPrefix: com.designyifan
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
targets:
  OtoDrill:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 音声ドリル
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        GroqKey: $(GROQ_KEY)
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}   # 手元で試すときの http://localhost だけ。公開ページは https
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designyifan.otodrill
        PRODUCT_NAME: OtoDrill
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: XMBCS38N25   # 個人のチーム（無料・7日で入れ直し）
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
