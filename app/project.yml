# 音声ドリルのアプリ（段4・iPhone と Mac）。作り方：vault 008_project/AppBuilding/specs/20261001_oto-drill-app_実現方式.md「段4 iPhone の殻の作り」
#   ./make_secrets.sh で Secrets.xcconfig を作ってから xcodegen generate
name: OtoDrill
options:
  bundleIdPrefix: com.designyifan
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
targets:
  OtoDrill:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        GroqKey: $(GROQ_KEY)
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}   # 手元で試すときの http://localhost だけ。公開ページは https
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designyifan.otodrill
        PRODUCT_NAME: OtoDrill
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: XMBCS38N25   # 個人のチーム（無料・7日で入れ直し）
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"   # Mac Catalyst に要る（iPad も入る）
        SUPPORTS_MACCATALYST: YES       # Mac も同じ殻で開く。手元のモデル（localhost）を立てなくてよくなる（2026-10-04）
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        APP_DISPLAY_NAME: 音声ドリル
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Mac の試す版（Debug）は名前と id を分ける。普段使いの版と並んで開いても見分けられるように（2026-10-04 本人「どっちを開いて確認すればいいのか分からない」）
        # × iPhone は変えない（入れてあるアプリが別物になり、選んだフォルダを選び直すことになるため）
        Debug:
          "APP_DISPLAY_NAME[sdk=macosx*]": 音声ドリル（試験用）
          "PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]": com.designyifan.otodrill.dev
