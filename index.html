<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音声ドリル</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=LINE+Seed+JP:wght@400;700&display=swap">
<style>
/* 見た目の値の正は vault の 008_project/LanguageVideo/_設計_見た目.md（マインドマップ・Language Video と同じ）。
   静かな少ない色。線で区切らず、余白と薄く広い影で層を分ける。色は「状態」にだけ差す。
   差し色は3つ：青（主たる操作・学習中）／ティール（覚えた）／すみれ（まだ知らない・間違えた）。
   ⛔ 切り替えの選んだ側は青にしない（黒）。⛔ 暖色は「要確認」（惜しい）にだけ使う。
   書体：ベトナム語の文字（ơ ư ạ …）を持つ Be Vietnam Pro と、日本語の LINE Seed JP。
   ⛔ 決めごとの Satoshi・SUIT はベトナム語の文字を持たない（2026-10-01 に確かめた）ので使わない。 */
:root{
  --ui-page-bgColor:#f5f6f8;
  --ui-surface-bgColor:#FFFFFF;
  --ui-surface-muted-bgColor:#f8f9fb;
  --ui-outline-borderColor:#eef0f4;
  --ui-outline-muted-borderColor:#eef0f4;
  --ui-text-fgColor:#16181d;
  --ui-text-muted-fgColor:#656a75;
  --ui-text-alt-fgColor:#9ba1ad;
  --ui-primary-color:#2f6bf0;
  --ui-primary-muted-bgColor:#e9f0fe;
  --ui-primary-fgColor:#1f56d6;      /* 青の文字（淡い青の面の上で 5.5:1）。⛔ --ui-primary-color は面・線・点に使い、文字には使わない */
  --ui-primary-bgColor:#2f6bf0;     /* 白い文字を載せる青の面（4.7:1） */
  --ui-primary-onEmphasis-fgColor:#FFFFFF;
  --ui-success-color:#21a9a0;
  --ui-success-fgColor:#16786f;
  --ui-success-muted-bgColor:#e4f3f1;
  --ui-danger-color:#7a68f0;
  --ui-card-shadow:0 1px 2px rgba(20,24,32,.02), 0 14px 38px rgba(20,24,32,.055);
  --ui-card-raised-shadow:0 1px 2px rgba(20,24,32,.02), 0 22px 52px rgba(20,24,32,.08);
  --ui-control-shadow:0 1px 2px rgba(20,24,32,.04), 0 4px 14px rgba(20,24,32,.05);
  --ui-card-radius:16px; --ui-control-radius:12px; --ui-control-sm-radius:8px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ui-page-bgColor:#121418; --ui-surface-bgColor:#1b1e24; --ui-surface-muted-bgColor:#22262d; --ui-outline-borderColor:#2a2f37; --ui-outline-muted-borderColor:#2a2f37;
    --ui-text-fgColor:#e8eaee; --ui-text-muted-fgColor:#a0a6b1; --ui-text-alt-fgColor:#6f7581;
    --ui-primary-color:#5b8af4; --ui-primary-muted-bgColor:#1f2a44; --ui-primary-onEmphasis-fgColor:#FFFFFF; --ui-primary-fgColor:#7ea3f7; --ui-primary-bgColor:#2f6bf0;
    --ui-success-color:#3cc3b8; --ui-success-fgColor:#5fd0c5; --ui-success-muted-bgColor:#173330; --ui-danger-color:#9b8cf5;
    --ui-card-shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 38px rgba(0,0,0,.35);
    --ui-card-raised-shadow:0 1px 2px rgba(0,0,0,.3), 0 22px 52px rgba(0,0,0,.45);
    --ui-control-shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ui-page-bgColor:#121418; --ui-surface-bgColor:#1b1e24; --ui-surface-muted-bgColor:#22262d; --ui-outline-borderColor:#2a2f37; --ui-outline-muted-borderColor:#2a2f37;
  --ui-text-fgColor:#e8eaee; --ui-text-muted-fgColor:#a0a6b1; --ui-text-alt-fgColor:#6f7581;
  --ui-primary-color:#5b8af4; --ui-primary-muted-bgColor:#1f2a44; --ui-primary-onEmphasis-fgColor:#FFFFFF; --ui-primary-fgColor:#7ea3f7; --ui-primary-bgColor:#2f6bf0;
  --ui-success-color:#3cc3b8; --ui-success-fgColor:#5fd0c5; --ui-success-muted-bgColor:#173330; --ui-danger-color:#9b8cf5;
  --ui-card-shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 38px rgba(0,0,0,.35);
  --ui-card-raised-shadow:0 1px 2px rgba(0,0,0,.3), 0 22px 52px rgba(0,0,0,.45);
  --ui-control-shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ui-page-bgColor);
  color:var(--ui-text-fgColor);
  font-family:var(--_lang-fontFamily,'Be Vietnam Pro'),'LINE Seed JP','Hiragino Sans',system-ui,sans-serif;
  font-size:14px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.app{height:100dvh; overflow:hidden; display:flex; flex-direction:column}

.eyebrow{
  font-family:inherit;
  font-size:11px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ui-text-muted-fgColor);
}

/* ---- ヘッダー ---- */
header{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:16px 24px;
  background:var(--ui-surface-bgColor);
  border-bottom:1px solid var(--ui-outline-borderColor);
}
.wordmark{display:flex; align-items:baseline; gap:12px}
.wordmark b{font-size:15px; font-weight:600; letter-spacing:.04em}
.folder{
  margin-left:auto; color:var(--ui-text-muted-fgColor); font-size:12px; text-align:right;
  display:flex; align-items:center; gap:8px;
}
.folder .name{
  font-family:inherit;
  color:var(--ui-text-fgColor); font-size:12px;
}

button{
  font:inherit; font-size:13px;
  color:var(--ui-text-fgColor); background:var(--ui-surface-bgColor);
  border:1px solid var(--ui-outline-borderColor); border-radius:6px;
  padding:8px 12px; cursor:pointer;
  transition:border-color .12s, background .12s, color .12s;
}
button:hover{border-color:var(--ui-text-muted-fgColor)}
button:focus-visible{outline:2px solid var(--ui-primary-color); outline-offset:2px}
button.primary{
  background:var(--ui-primary-bgColor); border-color:var(--ui-primary-color); color:var(--ui-primary-onEmphasis-fgColor); font-weight:500;
}
button.primary:hover{filter:brightness(1.07)}
button.on{background:var(--ui-primary-muted-bgColor); border-color:var(--ui-primary-color); color:var(--ui-primary-fgColor); font-weight:600}

/* ---- 本体 ---- */
main{flex:1; display:grid; grid-template-columns:minmax(0,1fr) 352px; min-height:0}
@media (max-width:820px){
  main{grid-template-columns:1fr; grid-template-rows:minmax(0,1.4fr) minmax(148px,1fr)}
}

.panel{
  padding:32px 32px 24px; display:flex; flex-direction:column; gap:28px;
  min-width:0; min-height:0; overflow-y:auto;
}

/* 一覧をたたむ。閉じたら中身を消す。 */
.app.list-off #filter,
.app.list-off ol,
.app.list-off .ledger-empty{display:none}

/* 広いとき：右の列ごと消して、本体を広げる（幅を取るのが困るので） */
@media (min-width:821px){
  .app.list-off aside{display:none}
  .app.list-off main{grid-template-columns:minmax(0,1fr)}
  #foldList{display:none}
}
/* 狭いとき：下にたたむ。開ける手掛かりを画面の下に残す
   （窓を半分にして教科書と並べて使うため、下が一番手が届く） */
@media (max-width:820px){
  #toggleList{display:none}
  .app.list-off main{grid-template-rows:minmax(0,1fr) auto}
  .app.list-off aside{border-top:1px solid var(--ui-outline-borderColor)}
}

.caret{margin-right:8px; display:inline-flex; align-items:center; vertical-align:-2px; transition:transform .12s}
.caret .ic{width:14px; height:14px}
.app.list-off .caret{transform:rotate(-90deg)}

/* 一覧の頭に置く開け閉め。閉じているときは、この帯ごと押せるようにする。 */
button.fold{
  border:0; background:transparent; color:var(--ui-text-muted-fgColor);
  padding:4px 8px; font-size:12px; white-space:nowrap; flex:none;
  display:flex; align-items:center;
}
button.fold:hover{color:var(--ui-text-fgColor); border-color:transparent}
.app.list-off button.fold{flex:1; justify-content:flex-start}

/* 計器 */
.readout{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap}
.bignum{
  font-family:inherit;
  font-size:64px; font-weight:600; line-height:.9; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.oftotal{
  font-family:inherit;
  font-size:15px; color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums;
  padding-bottom:4px;
}
.fname{
  font-size:16px; font-weight:500; word-break:break-all; text-wrap:balance;
  margin-top:12px;
}
.fname.blank{color:var(--ui-text-muted-fgColor); font-weight:400}

/* 進行 */
.track{display:flex; align-items:center; gap:16px}
.clock{
  font-family:inherit;
  font-size:12px; color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums; min-width:42px;
}
.clock.right{text-align:right}
input[type=range]{
  -webkit-appearance:none; appearance:none; flex:1; height:20px; background:transparent; cursor:pointer;
}
input[type=range]:focus-visible{outline:2px solid var(--ui-primary-color); outline-offset:4px; border-radius:4px}
input[type=range]::-webkit-slider-runnable-track{height:2px; background:var(--ui-outline-borderColor)}
input[type=range]::-moz-range-track{height:2px; background:var(--ui-outline-borderColor)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:3px; height:20px; margin-top:-8px;
  background:var(--ui-primary-color); border:0; border-radius:1px;
}
input[type=range]::-moz-range-thumb{
  width:3px; height:20px; background:var(--ui-primary-color); border:0; border-radius:1px;
}
input[type=range]:disabled::-webkit-slider-thumb{background:var(--ui-outline-borderColor)}

/* ---- 下に固定する操作卓 ---- */
/* 本文や一覧をどれだけ下までたどっても、再生位置・送り・速度は画面の下に出したままにする。
   （途中で止めるたびに上へ戻るのが手間だったため） */
.dock{
  flex:none;
  background:var(--ui-surface-bgColor);
  border-top:1px solid var(--ui-outline-borderColor);
  box-shadow:0 -6px 22px rgba(26,36,30,.05);
  padding:8px 24px calc(8px + env(safe-area-inset-bottom, 0px));
  display:flex; flex-direction:column; gap:8px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .dock{box-shadow:0 -6px 22px rgba(0,0,0,.3)}
}
:root[data-theme="dark"] .dock{box-shadow:0 -6px 22px rgba(0,0,0,.3)}

/* 速度：細かい段はパネルの「速度」に置いたまま。ここは 0.1 の上げ下げだけ */
/* つまみは縮められるようにしておく（狭い画面で横にはみ出すため） */
.dock .track{gap:12px}
.dock .track input[type=range]{min-width:0}
.dock .clock{min-width:38px}

.rate-nudge{display:flex; align-items:center; gap:8px; flex:none}
.rate-nudge button{
  padding:4px 8px; line-height:1.4;
  font-family:inherit; font-size:13px;
}
.rate-dock{
  font-family:inherit; font-size:12px;
  color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums;
  min-width:42px; text-align:center;
}

/* 送り */
.dock-row{display:flex; align-items:center; gap:12px}
.now{flex:1; min-width:0; display:flex; align-items:baseline; gap:8px}
.now .n{
  font-family:inherit; font-size:12px;
  color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.now .nm{
  font-size:13px; color:var(--ui-text-muted-fgColor);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.dock-row .spacer{flex:1}
.transport{display:flex; align-items:center; gap:8px}
.transport button{padding:8px 16px; min-height:40px}
#play{min-width:112px; padding:12px 20px; font-size:14px}
.transport .mono{font-family:inherit; font-size:12px}

/* 狭いときは名前を落として、送りのボタンを画面幅いっぱいに広げる */
@media (max-width:820px){
  .dock{padding:8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); gap:8px}
  .dock .track{gap:8px}
  .dock .clock{min-width:34px; font-size:11px}
  .rate-nudge{gap:4px}
  .rate-nudge button{padding:4px 8px}
  .rate-dock{min-width:36px}
  .now, .dock-row .spacer{display:none}
  .transport{flex:1; gap:8px}
  .transport button{flex:1 1 0; padding:12px 2px; min-width:0}
  #play{flex:1.5 1 0; min-width:0; padding:12px 2px}
}

/* 設定行 */
.setting{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.setting > .eyebrow{min-width:58px}
.speeds{display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--ui-outline-borderColor); border-radius:6px; overflow:hidden}
.speeds button{
  border:0; border-right:1px solid var(--ui-outline-borderColor); border-radius:0;
  padding:8px 12px;
  font-family:inherit; font-size:12px;
  font-variant-numeric:tabular-nums;
}
.speeds button:last-child{border-right:0}
.rate-now{
  font-family:inherit; font-size:12px;
  color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums; min-width:56px;
}
select{
  font:inherit; font-size:13px; color:var(--ui-text-fgColor);
  background:var(--ui-surface-bgColor); border:1px solid var(--ui-outline-borderColor);
  border-radius:6px; padding:4px 8px;
}
select:focus-visible{outline:2px solid var(--ui-primary-color); outline-offset:2px}
label.opt{display:flex; align-items:center; gap:8px; color:var(--ui-text-muted-fgColor); font-size:13px; cursor:pointer}
label.opt input[type=checkbox]{accent-color:var(--ui-primary-color)}

/* キー一覧 */
.keys{
  margin-top:auto; padding-top:20px; border-top:1px solid var(--ui-outline-muted-borderColor);
  color:var(--ui-text-muted-fgColor); font-size:12px; line-height:2.1;
  display:flex; flex-wrap:wrap; gap:4px 20px;
}
.keys span{white-space:nowrap}
kbd{
  font-family:inherit; font-size:11px;
  background:var(--ui-page-bgColor); border:1px solid var(--ui-outline-borderColor);
  border-radius:4px; padding:1px 4px; margin-right:4px; color:var(--ui-text-fgColor);
}

/* ---- 本文（transcript.json があるときだけ出る） ---- */
.script{
  flex:1; min-height:0; overflow-y:auto;
  border-top:1px solid var(--ui-outline-muted-borderColor); padding-top:16px;
  display:flex; flex-direction:column; gap:2px;
}
.sent{
  padding:8px 12px; border-radius:6px; cursor:pointer;
  line-height:1.9;
}
.sent:hover{background:var(--ui-surface-bgColor)}
.sent.now{background:var(--ui-primary-muted-bgColor)}
.sent .t{
  font-family:inherit; font-size:11px;
  color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums; margin-right:12px;
}
.w{border-radius:3px; padding:0 1px; cursor:pointer}
.w:hover{background:var(--ui-primary-bgColor); color:var(--ui-primary-onEmphasis-fgColor)}
.w.picked{box-shadow:inset 0 -2px 0 var(--ui-primary-color)}
.note{
  font-size:12px; color:var(--ui-text-muted-fgColor); margin:2px 0 8px 12px;
  padding-left:12px; line-height:1.7;
}
.script-empty{color:var(--ui-text-muted-fgColor); font-size:13px; padding:8px 2px}

/* 狭いときは本文の中で送らず、パネルごと送る（本文の枠が数十pxに潰れるため）。
   ⛔ この2つは .script の指定より後ろに置くこと（同じ強さなので、後ろが勝つ）。 */
@media (max-width:820px){
  .panel{padding:24px 20px 20px; gap:20px}
  .script{flex:none; min-height:0; overflow:visible}
}

/* ---- 引いた語 ---- */
.lookup{
  position:fixed; right:20px; bottom:calc(var(--_app-dockHeight, 104px) + 14px);
  width:min(400px, calc(100vw - 40px));
  max-height:min(56vh, 520px); overflow-y:auto; z-index:40;
  background:var(--ui-surface-bgColor); border:1px solid var(--ui-outline-borderColor); border-radius:10px;
  box-shadow:var(--ui-card-shadow); padding:16px 20px;
  display:flex; flex-direction:column; gap:12px;
}
.lookup[hidden]{display:none}
.lookup .head{display:flex; align-items:baseline; gap:12px}
.lookup .word{font-size:22px; font-weight:600; word-break:break-word}
.lookup .close{margin-left:auto; padding:2px 8px; font-size:12px}
.han{display:flex; flex-wrap:wrap; gap:8px}
.han .cell{
  border:1px solid var(--ui-outline-borderColor); border-radius:7px; padding:8px 12px;
  display:flex; align-items:baseline; gap:8px; background:var(--ui-page-bgColor);
}
.han .kanji{font-size:19px; font-weight:600}
.han .yomi{font-size:11px; color:var(--ui-text-muted-fgColor); font-family:inherit}
.gloss{font-size:14px; line-height:1.7}
.gloss .src{
  font-family:inherit; font-size:11px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ui-text-muted-fgColor); display:block; margin-bottom:2px;
}
.from{
  font-size:12px; color:var(--ui-text-muted-fgColor); line-height:1.8;
  border-top:1px solid var(--ui-outline-muted-borderColor); padding-top:12px;
}
.from b{color:var(--ui-text-fgColor); font-weight:500}
.lookup .keep{align-self:flex-start}

/* ---- 帳簿 ---- */
aside{
  background:var(--ui-surface-bgColor); border-left:1px solid var(--ui-outline-borderColor);
  display:flex; flex-direction:column; min-height:0;
}
@media (max-width:820px){ aside{border-left:0; border-top:1px solid var(--ui-outline-borderColor)} }
.ledger-head{
  display:flex; align-items:center; gap:12px;
  padding:12px 16px; border-bottom:1px solid var(--ui-outline-borderColor);
}
.ledger-head input{
  flex:1; min-width:0; font:inherit; font-size:13px; color:var(--ui-text-fgColor);
  background:var(--ui-page-bgColor); border:1px solid var(--ui-outline-borderColor);
  border-radius:6px; padding:4px 8px;
}
.ledger-head input:focus-visible{outline:2px solid var(--ui-primary-color); outline-offset:-1px}
.tally{
  font-family:inherit; font-size:12px;
  color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums;
}
ol{list-style:none; margin:0; padding:0; overflow-y:auto; flex:1}
ol:empty{flex:0 0 auto}
li{
  display:flex; align-items:center; gap:12px;
  padding:8px 16px 8px 12px;
  border-bottom:1px solid var(--ui-outline-muted-borderColor);
  cursor:pointer; font-size:13px;
}
li:hover{background:var(--ui-page-bgColor)}
li.current{background:var(--ui-primary-muted-bgColor)}
li .n{
  font-family:inherit; font-size:12px;
  color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums; min-width:30px;
}
li.current .n{color:var(--ui-primary-fgColor); font-weight:600}
li.current .nm{font-weight:600}
li .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
li .done{color:var(--ui-success-fgColor); font-size:12px}
li.hidden{display:none}
.ledger-empty{padding:24px 20px; color:var(--ui-text-muted-fgColor); font-size:13px; line-height:1.8}

/* ドロップ */
#drop{
  position:fixed; inset:0; z-index:60; display:none;
  align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--ui-page-bgColor) 88%, transparent);
  border:3px dashed var(--ui-primary-color);
  color:var(--ui-primary-fgColor); font-size:19px; font-weight:600; letter-spacing:.02em;
  pointer-events:none;
}
#drop.show{display:flex}

/* ================= 練習（practice.json があるときだけ出る） ================= */
/* 聴くだけだと、自分で選んで確かめられないので覚えられない（本人 2026-09-30）。
   表を押して1音ずつ鳴らす／聞いて選ぶ／見て言う、の3つ。 */
:root{ --ui-danger-fgColor:#5a46d6; --ui-danger-muted-bgColor:#efedfd }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --ui-danger-fgColor:#a99cf7; --ui-danger-muted-bgColor:#26223d }
}
:root[data-theme="dark"]{ --ui-danger-fgColor:#a99cf7; --ui-danger-muted-bgColor:#26223d }

.modes{display:flex; border:1px solid var(--ui-outline-borderColor); border-radius:6px; overflow:hidden}
.modes button{border:0; border-radius:0; padding:8px 16px}
.modes button + button{border-left:1px solid var(--ui-outline-borderColor)}

.app.practicing main, .app.practicing .dock, .app.practicing #toggleList{display:none}
.practice{flex:1; min-height:0; overflow-y:auto; padding:24px 32px 40px}
.practice[hidden]{display:none}
.pbar{display:flex; align-items:center; gap:12px 16px; flex-wrap:wrap; margin-bottom:24px}
.pbar .seg{display:flex; flex-wrap:wrap; border:1px solid var(--ui-outline-borderColor); border-radius:6px; overflow:hidden}
.pbar .seg button{border:0; border-radius:0; padding:8px 12px}
.pbar .seg button + button{border-left:1px solid var(--ui-outline-borderColor)}
.pbar .stat{margin-left:auto; color:var(--ui-text-muted-fgColor); font-size:12px; font-family:inherit}

/* 表 */
.gridwrap{display:flex; flex-direction:column; gap:24px}
.ghead{margin:0 0 8px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px}
.pcell{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:16px 8px 12px; background:var(--ui-surface-bgColor);
}
.pcell .big{font-size:26px; font-weight:500; line-height:1.2}
.pcell .say{font-size:12px; color:var(--ui-text-muted-fgColor); font-family:inherit}
.pcell.playing{border-color:var(--ui-primary-color); background:var(--ui-primary-muted-bgColor)}
/* 文の組：1行ずつ左に寄せて並べる */
.grid.text{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.text .pcell{flex-direction:row; align-items:center; justify-content:space-between; gap:12px; padding:12px 12px; text-align:left}
.grid.text .pcell .big{font-size:16px; font-weight:400; line-height:1.5}
.grid.text .pcell .meter{margin-top:0; flex:none}
#pdecks{max-width:100%; min-width:0; padding:8px 8px}
.unchecked{font-size:12px; color:var(--ui-text-muted-fgColor); margin:-12px 0 20px}
.quiz .ask.long{font-size:30px; line-height:1.45}
.choices.text{grid-template-columns:1fr}
.choices.text button{font-size:17px; padding:12px 16px; align-items:flex-start; text-align:left}
/* 並べる */
.slots{min-height:58px; width:100%; display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  padding:12px; border:1px dashed var(--ui-outline-borderColor); border-radius:8px; background:var(--ui-surface-bgColor)}
.tiles{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.tiles button, .slots button{font-size:18px; padding:8px 16px}
.slots.right{border-style:solid; border-color:var(--ui-success-fgColor); background:var(--ui-primary-muted-bgColor)}
.slots.wrong{border-style:solid; border-color:var(--ui-danger-fgColor); background:var(--ui-danger-muted-bgColor)}
.meter{display:flex; gap:4px; margin-top:8px}
.meter i{width:6px; height:6px; border-radius:50%; background:var(--ui-outline-borderColor)}
.meter i.f{background:var(--ui-primary-color)}

/* 問い */
.quiz{max-width:560px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:20px; padding-top:12px}
.quiz .from{font-size:12px; color:var(--ui-text-muted-fgColor)}
.quiz .ask{font-size:72px; font-weight:500; line-height:1.1; min-height:80px; text-align:center}
.quiz .hear{min-width:180px; padding:16px 20px; font-size:15px}
.choices{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%}
.choices button{padding:16px 8px; font-size:24px; display:flex; flex-direction:column; align-items:center; gap:2px}
.choices button small{font-size:11px; color:var(--ui-text-muted-fgColor); font-family:inherit}
.choices button.right{border-color:var(--ui-success-fgColor); background:var(--ui-primary-muted-bgColor); color:var(--ui-success-fgColor)}
.choices button.wrong{border-color:var(--ui-danger-fgColor); background:var(--ui-danger-muted-bgColor); color:var(--ui-danger-fgColor)}
.quiz .say{font-size:14px; color:var(--ui-text-muted-fgColor); font-family:inherit; min-height:22px}
.quiz .pnote{font-size:12px; color:var(--ui-text-muted-fgColor); text-align:center; min-height:20px}
.row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
.row button{padding:12px 20px; min-width:140px}
.row button.miss{border-color:var(--ui-danger-fgColor); color:var(--ui-danger-fgColor)}
.pkeys{color:var(--ui-text-muted-fgColor); font-size:12px; margin-top:8px}

/* 穴埋め・書く */
span.blank{display:inline-block; min-width:3.5em; border-bottom:2px solid var(--ui-primary-color); text-align:center}
span.blank.right{color:var(--ui-success-fgColor)} span.blank.wrong{color:var(--ui-danger-fgColor); border-color:var(--ui-danger-fgColor)}
.typein{width:100%; font:inherit; font-size:22px; padding:12px 16px; border:1px solid var(--ui-outline-borderColor); border-radius:8px;
  background:var(--ui-surface-bgColor); color:var(--ui-text-fgColor)}
.typein:focus{outline:2px solid var(--ui-primary-color); outline-offset:1px}
.diff{font-size:24px; line-height:2.2; text-align:center}
.diff .w{display:inline-flex; flex-direction:column; align-items:center; padding:0 8px; border-radius:6px}
.diff .w small{font-size:11px; line-height:1.3; font-family:inherit}
.diff .ok{color:var(--ui-success-fgColor)}
.diff .near{background:var(--ui-warning-muted-bgColor); color:var(--ui-warning-fgColor)}
.diff .bad, .diff .miss{background:var(--ui-danger-muted-bgColor); color:var(--ui-danger-fgColor)}
.diff .extra{color:var(--ui-text-muted-fgColor)}
.legend{display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:8px}
.lg{display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--ui-text-muted-fgColor)}
.lg i{width:10px; height:10px; border-radius:3px; display:inline-block}
.lg i.ok{background:var(--ui-success-fgColor)} .lg i.near{background:var(--ui-warning-fgColor)} .lg i.bad{background:var(--ui-danger-fgColor)}

/* 見渡す：段は1色（緑）の濃淡。未着手は線の色 */
:root{ --ui-warning-fgColor:#8a6420; --ui-warning-muted-bgColor:#f6efe1 }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --ui-warning-fgColor:#d9b85c; --ui-warning-muted-bgColor:#2e2819 } }
:root[data-theme="dark"]{ --ui-warning-fgColor:#d9b85c; --ui-warning-muted-bgColor:#2e2819 }
.overview{max-width:1080px; margin:0 auto; width:100%}
.overview[hidden]{display:none}
.tiles4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px}
.tile{background:var(--ui-surface-bgColor); border:1px solid var(--ui-outline-borderColor); border-radius:8px; padding:12px 16px}
.tile .big{font-size:30px; font-weight:600; font-family:inherit; font-variant-numeric:tabular-nums}
.tile .big small{font-size:14px; color:var(--ui-text-muted-fgColor); font-weight:400}
.legend.ov{justify-content:flex-start; margin:0 0 12px}
.legend.ov .lg i.lv0, .wchip.lv0{background:var(--ui-outline-borderColor)}
.lg i.lv1{background:var(--ui-primary-color)} .lg i.lv2{background:var(--ui-success-color)}
.ovgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px}
.ovsec{background:var(--ui-surface-bgColor); border:1px solid var(--ui-outline-borderColor); border-radius:8px; padding:12px 16px}
.ovhead{display:flex; justify-content:space-between; margin-bottom:8px}
.ovhead span, .ovrow .ct{font-family:inherit; font-size:12px; color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums}
.sbar{display:flex; gap:2px; height:10px; flex:1; min-width:40px}
.sbar i{border-radius:4px; min-width:3px}
.sbar i.lv0{background:var(--ui-outline-borderColor)} .sbar i.lv1{background:var(--ui-primary-color)} .sbar i.lv2{background:var(--ui-success-color)}
.ovsec > .sbar{height:14px; margin-bottom:12px}
.ovrow{display:grid; grid-template-columns:minmax(0,9em) 1fr 5.5em; align-items:center; gap:12px; width:100%;
  border:0; background:transparent; padding:4px 2px; text-align:left}
.ovrow:hover{background:var(--ui-page-bgColor)}
.ovrow .nm{font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ovrow .ct{text-align:right}
.ovh{font-size:14px; margin:28px 0 12px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap}
.ovh small{font-weight:400; font-size:12px; color:var(--ui-text-muted-fgColor)}
.skills{display:flex; flex-direction:column; gap:8px; max-width:560px}
.skill{display:grid; grid-template-columns:7em 1fr 7.5em; gap:12px; align-items:center; font-size:13px}
.track1{height:10px; background:var(--ui-outline-borderColor); border-radius:4px; overflow:hidden}
.track1 i{display:block; height:100%; background:var(--ui-success-color); border-radius:4px}
.skill .ct{font-family:inherit; font-size:12px; color:var(--ui-text-muted-fgColor)}
.heat{display:flex; gap:4px}
.hdays{display:flex; flex-direction:column; gap:4px; margin-right:4px}
.hdays span{height:14px; font-size:11px; line-height:14px; color:var(--ui-text-muted-fgColor)}
.hcol{display:flex; flex-direction:column; gap:4px}
.h{width:14px; height:14px; border-radius:3px; display:inline-block}
.h0{background:var(--ui-outline-borderColor)} .h1{background:#dde7fd} .h2{background:#b8cdfb} .h3{background:#8badf8} .h4{background:#2f6bf0}
.h.none{background:transparent}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .h1{background:#1f2a44} :root:not([data-theme="light"]) .h2{background:#2a3d6b}
  :root:not([data-theme="light"]) .h3{background:#3d5ea8} :root:not([data-theme="light"]) .h4{background:#5b8af4} }
:root[data-theme="dark"] .h1{background:#1f2a44} :root[data-theme="dark"] .h2{background:#2a3d6b} :root[data-theme="dark"] .h3{background:#3d5ea8} :root[data-theme="dark"] .h4{background:#5b8af4}
.legend.ov .h{width:10px; height:10px}
.wf{margin-bottom:12px; display:inline-flex; flex-wrap:wrap; border:1px solid var(--ui-outline-borderColor); border-radius:6px; overflow:hidden}
.wf button{border:0; border-radius:0; padding:4px 12px; font-size:12px}
.wf button + button{border-left:1px solid var(--ui-outline-borderColor)}
.wmap{display:flex; flex-wrap:wrap; gap:4px}
.wchip{padding:4px 8px; font-size:13px; border:0; border-radius:5px}
.wchip.typed{text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:2px}
.weak{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:8px}
.wk{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:8px 12px}
.wk small{color:var(--ui-text-muted-fgColor); font-size:11px}
@media (max-width:820px){ .tiles4{grid-template-columns:1fr 1fr} .skill{grid-template-columns:6em 1fr 6.5em} }

@media (max-width:820px){
  .practice{padding:16px 16px 32px}
  .quiz .ask{font-size:56px}
}


/* 教材 */
.blib{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; margin-bottom:24px}
.bcard{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:12px 12px}
.bcard small{color:var(--ui-text-muted-fgColor); font-size:11px}
.bcard.on{border-color:var(--ui-primary-color); background:var(--ui-primary-muted-bgColor)}
.bhead{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:12px}
.bhead h2{font-size:20px; margin:0; font-weight:600}
.bnote, .bfoot{font-size:12px; color:var(--ui-text-muted-fgColor)}
.bfoot{margin:12px 0 0}
.btable{background:var(--ui-surface-bgColor); border:1px solid var(--ui-outline-borderColor); border-radius:8px; overflow:hidden}
.brow{display:grid; grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr)); gap:12px; padding:8px 16px; font-size:13px;
  font-variant-numeric:tabular-nums}
.brow + .brow{border-top:1px solid var(--ui-outline-muted-borderColor)}
.brow.bth{color:var(--ui-text-muted-fgColor); font-size:11px}
.brow .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bpaper{margin-bottom:12px}
.pex{display:grid; grid-template-columns:minmax(0,10em) 1fr; gap:12px; align-items:center; padding:4px 0}
.pex .nm{font-size:13px}
.pcells{display:flex; flex-wrap:wrap; gap:4px}
.pc{width:38px; height:38px; padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:16px; line-height:1}
.pc small{font-size:11px; color:var(--ui-text-muted-fgColor); font-family:inherit}
.pc.ro{border-color:var(--ui-success-fgColor); background:var(--ui-primary-muted-bgColor); color:var(--ui-success-fgColor)}
.pc.rs{border-color:var(--ui-warning-fgColor); background:var(--ui-warning-muted-bgColor); color:var(--ui-warning-fgColor)}
.pc.rx{border-color:var(--ui-danger-fgColor); background:var(--ui-danger-muted-bgColor); color:var(--ui-danger-fgColor)}
.addex{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.addex input{font:inherit; font-size:12px; padding:4px 8px; border:1px solid var(--ui-outline-borderColor); border-radius:6px; background:var(--ui-surface-bgColor); color:var(--ui-text-fgColor)}
.addex input[name=label]{flex:1; min-width:10em}

.gt{display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; border:0; border-radius:0; text-align:left; padding:12px 12px; background:transparent}
.gt span{font-size:12px; color:var(--ui-text-muted-fgColor)}
.gram.open{border-color:var(--ui-primary-color)}
.gex{display:flex; flex-direction:column; gap:4px; padding:0 12px 12px}
.gs{text-align:left; font-size:14px; padding:8px 12px}
.bfilter{font:inherit; padding:8px 12px; border:1px solid var(--ui-outline-borderColor); border-radius:6px; background:var(--ui-surface-bgColor); color:var(--ui-text-fgColor); width:100%; max-width:320px; margin-bottom:8px}

@media (max-width:820px){ .brow{grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr)); gap:8px; padding:8px 12px; font-size:12px}
  .pex{grid-template-columns:1fr} }

/* ================= デザインシステムに合わせる（2026-10-01） ================= */
/* 本人（2026-10-01）「緑の色と背景のグレーが気に入らなくなってきた」「マインドマップや韓国の YouTube を取り込むやつの色感」
   「カードの左に口をつけるやつはやめる」。
   ⭕ 線で区切らない。カードは白＋薄く広い影＋角丸。ボタンは丸いつまみ。切り替えの選んだ側は黒。
   ⛔ 左の縦の帯（border-left で状態を出す）は使わない。状態は面の色で出す。 */
.eyebrow{font-size:11px; font-weight:500; letter-spacing:.02em; text-transform:none; color:var(--ui-text-muted-fgColor)}
header{background:var(--ui-page-bgColor); border-bottom:0; padding:16px 24px 12px}
.wordmark b{letter-spacing:0}
.folder .name{color:var(--ui-text-muted-fgColor)}
.bignum{letter-spacing:-.03em}

button{border:0; border-radius:999px; background:var(--ui-surface-bgColor); box-shadow:var(--ui-control-shadow); padding:8px 16px; transition:background .12s, color .12s, box-shadow .12s}
button:hover{border-color:transparent; background:var(--ui-surface-muted-bgColor)}
button.primary{background:var(--ui-primary-bgColor); color:var(--ui-primary-onEmphasis-fgColor); box-shadow:none}
button.primary:hover{background:var(--ui-primary-bgColor); filter:brightness(1.06)}
button.on{background:var(--ui-text-fgColor); color:var(--ui-surface-bgColor); font-weight:500}
button.fold, button.fold:hover{box-shadow:none; background:transparent}
button:disabled{opacity:.5; cursor:default}

/* 切り替え：白い台の中に丸いつまみ。選んだ側は黒 */
.modes, .pbar .seg, .wf, .speeds{border:0; background:var(--ui-surface-bgColor); box-shadow:var(--ui-control-shadow); border-radius:999px; padding:4px; gap:2px; overflow:visible}
.modes button, .pbar .seg button, .wf button, .speeds button{border:0; border-radius:999px; box-shadow:none; background:transparent; color:var(--ui-text-muted-fgColor); padding:4px 12px; font-size:12px; font-weight:500}
.modes button + button, .pbar .seg button + button, .wf button + button{border-left:0}
.speeds button, .speeds button:last-child{border-right:0}
.modes button:hover, .pbar .seg button:hover, .wf button:hover, .speeds button:hover{background:var(--ui-surface-muted-bgColor); color:var(--ui-text-fgColor)}
.modes button.on, .pbar .seg button.on, .wf button.on, .speeds button.on{background:var(--ui-text-fgColor); color:var(--ui-surface-bgColor)}

select, .ledger-head input, .typein, .addex input, .bfilter{border:0; background:var(--ui-surface-bgColor); box-shadow:inset 0 0 0 1px var(--ui-outline-borderColor); border-radius:var(--ui-control-radius)}
.ledger-head input{background:var(--ui-surface-muted-bgColor); box-shadow:none}
kbd{border:0; background:var(--ui-surface-muted-bgColor); box-shadow:inset 0 0 0 1px var(--ui-outline-borderColor)}

/* 聴く */
main{gap:16px; padding:0 16px 16px}
.panel{background:transparent}
aside{background:var(--ui-surface-bgColor); border-left:0; border-radius:var(--ui-card-radius); box-shadow:var(--ui-card-shadow); overflow:hidden}
@media (max-width:820px){ aside{border-top:0} main{gap:12px; padding:0 12px 12px} }
.app.list-off aside{border-top:0}
.ledger-head{border-bottom:0}
li{border-bottom:0; border-left:0; padding:8px 16px; margin:0 8px; border-radius:var(--ui-control-radius)}
li:hover{background:var(--ui-surface-muted-bgColor)}
li.current{background:var(--ui-primary-muted-bgColor); border-left:0}
li .done{color:var(--ui-success-fgColor)}
.keys{border-top:0}
.script{border-top:0}
.sent{border-left:0; border-radius:var(--ui-control-radius)}
.sent:hover{background:var(--ui-surface-bgColor)}
.sent.now{background:var(--ui-primary-muted-bgColor)}
.note{border-left:0; background:var(--ui-surface-bgColor); border-radius:var(--ui-control-sm-radius); padding:8px 12px; margin:2px 0 8px 12px}
.dock{border-top:0; box-shadow:0 -1px 2px rgba(20,24,32,.02), 0 -14px 38px rgba(20,24,32,.055)}
.transport button{min-height:40px}
.lookup{border:0; border-radius:var(--ui-card-radius); box-shadow:var(--ui-card-raised-shadow)}
.han .cell{border:0; background:var(--ui-surface-muted-bgColor); border-radius:var(--ui-control-sm-radius)}
.from{border-top:0; background:var(--ui-surface-muted-bgColor); border-radius:var(--ui-control-sm-radius); padding:8px 12px}
.gloss .src{text-transform:none; letter-spacing:.02em; font-size:11px; color:var(--ui-text-muted-fgColor)}
#drop{border:2px dashed var(--ui-primary-color)}

/* 練習・見渡す・教材：カードは白＋影＋角丸。線は引かない */
.pcell, .tile, .ovsec, .btable, .gram, .bcard, .wk, .vw, .slots{border:0; border-radius:var(--ui-card-radius); box-shadow:var(--ui-card-shadow); background:var(--ui-surface-bgColor)}
.pcell, .wk, .vw, .bcard{border-radius:var(--ui-control-radius)}
.pcell:hover, .wk:hover, .vw:hover, .bcard:hover{background:var(--ui-surface-muted-bgColor)}
.pcell.playing{background:var(--ui-primary-muted-bgColor); border-color:transparent}
.slots{border:0; box-shadow:inset 0 0 0 1.5px var(--ui-outline-borderColor)}
.slots.right{box-shadow:none; background:var(--ui-success-muted-bgColor)}
.slots.wrong{box-shadow:none; background:var(--ui-danger-muted-bgColor)}
.choices button{border-radius:var(--ui-control-radius)}
.choices button.right{background:var(--ui-success-muted-bgColor); color:var(--ui-success-fgColor); border-color:transparent}
.choices button.wrong{background:var(--ui-danger-muted-bgColor); color:var(--ui-danger-fgColor); border-color:transparent}
.row button.miss{color:var(--ui-danger-fgColor); background:var(--ui-danger-muted-bgColor); box-shadow:none}
.meter i.f{background:var(--ui-success-color)}
.ovrow{box-shadow:none; border-radius:var(--ui-control-sm-radius)}

<script>
(function(){
'use strict';

const $ = s => document.querySelector(s);
const AUDIO_RE = /\.(mp3|m4a|m4b|aac|wav|aiff?|ogg|oga|opus|flac|webm|mp4)$/i;
const RATES = [0.5,0.75,0.8,0.9,1,1.1,1.25,1.5,2];

const audio = new Audio();
audio.preload = 'auto';
['preservesPitch','mozPreservesPitch','webkitPreservesPitch'].forEach(k=>{ try{ audio[k]=true; }catch(e){} });

let tracks = [];
let idx = -1;
let url = null;
let folderKey = '';
let done = new Set();
let playsLeft = 1;
let gapTimer = null;
let lastSave = 0;
let rate = 1;
let mode = 'listen';   // listen ／ practice ／ overview ／ book
let afiles = {};       // 音声のファイル名 → File（教材の面から区間を鳴らすため）
let lastHandle = null; // いま開いているフォルダの手掛かり（教材ごとに覚え直す）
let pendingHandle = null;

/* ---------- 保存（使えない環境でも動く） ---------- */
function load(key, fallback){
  try{ const v = localStorage.getItem('otodrill:'+key); return v===null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function save(key, val){
  try{ localStorage.setItem('otodrill:'+key, JSON.stringify(val)); }catch(e){}
}

/* ---------- 表示 ---------- */
function fmt(s){
  if(!isFinite(s) || s<0) s = 0;
  const m = Math.floor(s/60), r = Math.floor(s%60);
  return m + ':' + String(r).padStart(2,'0');
}
function label(r){ return r.toFixed(2).replace(/0$/,'').replace(/\.$/,'') + '×'; }

function renderList(){
  const ol = $('#list');
  ol.innerHTML = '';
  tracks.forEach((t,i)=>{
    const li = document.createElement('li');
    li.dataset.i = i;
    li.innerHTML = '<span class="n"></span><span class="nm"></span><span class="done"></span>';
    li.querySelector('.n').textContent = String(i+1).padStart(String(tracks.length).length,'0');
    li.querySelector('.nm').textContent = t.name;
    li.addEventListener('click', ()=> play(i, true));
    ol.appendChild(li);
  });
  $('#ledgerEmpty').style.display = 'none';
  paintList();
  applyFilter();
}

function paintList(){
  const items = $('#list').children;
  for(let i=0;i<items.length;i++){
    items[i].classList.toggle('current', i===idx);
    items[i].querySelector('.done').textContent = done.has(tracks[i].name) ? '✓' : '';
  }
  const shown = tracks.filter(t => done.has(t.name)).length;
  $('#tally').textContent = tracks.length ? (shown + '/' + tracks.length) : '';
}

function applyFilter(){
  const q = $('#filter').value.trim().toLowerCase();
  const items = $('#list').children;
  for(let i=0;i<items.length;i++){
    items[i].classList.toggle('hidden', !!q && !tracks[i].name.toLowerCase().includes(q));
  }
}

function scrollToCurrent(){
  const el = $('#list').children[idx];
  if(el) el.scrollIntoView({block:'nearest'});
}

/* ---------- 読み込み ---------- */
function loadFiles(files){
  const list = files.filter(f => AUDIO_RE.test(f.name) && !f.name.startsWith('.'));
  if(!list.length){
    $('#fname').textContent = '音声ファイルが見つかりませんでした。mp3・m4a・wav などが入ったフォルダを選んでください。';
    $('#fname').classList.add('blank');
    return;
  }

  list.forEach(f => { f._rel = f._rel || f.webkitRelativePath || f.name; });
  list.sort((a,b)=> a._rel.localeCompare(b._rel, 'ja', {numeric:true, sensitivity:'base'}));

  tracks = list.map(f => ({file:f, name:f.name, rel:f._rel}));
  afiles = {}; list.forEach(f => { afiles[f.name] = f; });
  const first = tracks[0].rel;
  folderKey = first.includes('/') ? first.split('/')[0] : 'files';

  $('#folder').textContent = folderKey + ' · ' + tracks.length + '本';
  done = new Set(load('done:'+folderKey, []));
  renderList();
  // 開いたフォルダの手掛かり（ファイル選び・落とした場合は無いことがある）
  lastHandle = pendingHandle; pendingHandle = null;
  // ⛔ folderKey と tracks が決まってから読む（付属ファイルが無いと待たずに走り、前のフォルダの値で教材を登録してしまう）
  loadSidecars(files);

  const last = load('last:'+folderKey, null);
  let start = 0, at = 0;
  if(last){
    const i = tracks.findIndex(t => t.name === last.name);
    if(i >= 0){ start = i; at = last.time || 0; }
  }
  play(start, false, at);
}

async function filesFromDrop(dt){
  const entries = [...dt.items].map(it => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
  if(!entries.length) return [...dt.files];
  const out = [];
  async function walk(entry, prefix){
    if(entry.isFile){
      const f = await new Promise((res,rej)=> entry.file(res, rej));
      f._rel = prefix + entry.name;
      out.push(f);
    }else if(entry.isDirectory){
      const reader = entry.createReader();
      let batch;
      do{
        batch = await new Promise((res,rej)=> reader.readEntries(res, rej));
        for(const e of batch) await walk(e, prefix + entry.name + '/');
      }while(batch.length);
    }
  }
  for(const e of entries) await walk(e, '');
  return out;
}

/* ---------- 再生 ---------- */
function play(i, autoplay, seekTo){
  if(i < 0 || i >= tracks.length) return;
  clearTimeout(gapTimer);
  if(url) URL.revokeObjectURL(url);
  idx = i;
  url = URL.createObjectURL(tracks[i].file);
  audio.src = url;
  audio.playbackRate = rate;
  playsLeft = Number($('#repeatN').value) || 0;

  const width = String(tracks.length).length;
  $('#bignum').textContent = String(i+1).padStart(width,'0');
  $('#oftotal').textContent = '/ ' + tracks.length + '　残り ' + (tracks.length-i-1) + '本';
  $('#fname').textContent = tracks[i].name;
  $('#fname').classList.remove('blank');
  $('#nowN').textContent = String(i+1).padStart(width,'0') + '/' + tracks.length;
  $('#nowName').textContent = tracks[i].name;
  $('#seek').disabled = false;
  renderScript(tracks[i].name);
  paintLtag();
  paintList();
  scrollToCurrent();

  if(seekTo){
    audio.addEventListener('loadedmetadata', ()=>{ audio.currentTime = seekTo; }, {once:true});
  }
  if(autoplay) audio.play().catch(()=>{});
  saveLast();
}

function setRate(r){
  rate = Math.min(3, Math.max(0.25, Math.round(r*100)/100));
  save('rate', rate);
  audio.playbackRate = rate;
  $('#rateNow').textContent = 'いま ' + label(rate);
  $('#rateDock').textContent = label(rate);
  [...$('#speeds').children].forEach(b => b.classList.toggle('on', Number(b.dataset.r) === rate));
  paintSetSum();
}

/* いまの設定の一言（設定の小窓を閉じていても分かるように） */
function paintSetSum(){
  const el = $('#setSum'); if(!el) return;
  const rn = $('#repeatN'), gp = $('#gap');
  const parts = [label(rate)];
  if(rn.value !== '1') parts.push(rn.options[rn.selectedIndex].text + '繰り返す');
  if(gp.value !== '0') parts.push(gp.options[gp.selectedIndex].text);
  if($('#loopAll').checked) parts.push('最後まで行ったら最初へ');
  el.textContent = parts.join('・');
}
/* 設定の小窓：外を押すか Esc で閉じる */
function openSettings(on){
  $('#settings').hidden = !on;
  $('#settingsBtn').setAttribute('aria-expanded', String(on));
  $('#settingsBtn').classList.toggle('on', on);
}
$('#settingsBtn').addEventListener('click', e => { e.stopPropagation(); openSettings($('#settings').hidden); });
document.addEventListener('click', e => { if(!$('#settings').hidden && !e.target.closest('#settings')) openSettings(false); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#settings').hidden){ openSettings(false); $('#settingsBtn').focus(); } });

function toggle(){
  if(idx < 0) return;
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
}

function step(sec){
  if(idx>=0) audio.currentTime = Math.max(0, Math.min(audio.duration||0, audio.currentTime + sec));
}

function goNext(byHand){
  clearTimeout(gapTimer);
  if(idx + 1 < tracks.length) play(idx+1, true);
  else if($('#loopAll').checked && !byHand) play(0, true);
  else setPlayLabel(false);
}

let importing = false;   // 記録を読み込んで読み直すあいだは、聴いた位置を書かない（読み込んだ値を上書きするため）
function saveLast(){
  if(idx < 0 || importing) return;
  save('last:'+folderKey, {name: tracks[idx].name, time: audio.currentTime||0});
}

/* ---------- イベント ---------- */
function setPlayLabel(on){
  $('#play').classList.toggle('playing', on);
  $('#play .lbl').textContent = on ? '一時停止' : '再生';
}
audio.addEventListener('play',  ()=> setPlayLabel(true));
audio.addEventListener('pause', ()=> setPlayLabel(false));
audio.addEventListener('loadedmetadata', ()=>{ $('#dur').textContent = fmt(audio.duration); paintSeek(); });

audio.addEventListener('timeupdate', ()=>{
  $('#cur').textContent = fmt(audio.currentTime);
  syncScript(audio.currentTime);
  if(audio.duration){ $('#seek').value = Math.round(audio.currentTime / audio.duration * 1000); paintSeek(); }
  const now = Date.now();
  if(now - lastSave > 3000){ lastSave = now; saveLast(); }
});

audio.addEventListener('ended', ()=>{
  if(idx >= 0 && !done.has(tracks[idx].name)){
    done.add(tracks[idx].name);
    save('done:'+folderKey, [...done]);
    emit('done', {f: folderKey, n: tracks[idx].name});
    paintList();
  }
  const n = Number($('#repeatN').value);
  const g = Number($('#gap').value) * 1000;
  if(n === 0 || playsLeft > 1){
    if(n !== 0) playsLeft--;
    gapTimer = setTimeout(()=>{ audio.currentTime = 0; audio.play().catch(()=>{}); }, g);
    return;
  }
  gapTimer = setTimeout(()=> goNext(false), g);
});

/* ---------- 前に開いたフォルダを覚える ---------- */
/* 音声そのものは持たない（大きすぎる）。フォルダへの手掛かりだけ IndexedDB に置く。
   ⛔ 手掛かりを保存できるのは showDirectoryPicker のある環境だけ（Chrome・Edge）。
   Safari・Firefox・ダブルクリックで開いた場合は、これまで通り毎回選ぶ。 */
function idb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('otodrill', 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('handles');
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function putDir(h, key){
  try{
    const db = await idb();
    await new Promise((res,rej)=>{
      const t = db.transaction('handles','readwrite');
      t.objectStore('handles').put(h, key || 'last');
      t.oncomplete = res; t.onerror = ()=> rej(t.error);
    });
  }catch(e){}
}
async function getDir(key){
  try{
    const db = await idb();
    return await new Promise((res,rej)=>{
      const t = db.transaction('handles','readonly');
      const q = t.objectStore('handles').get(key || 'last');
      q.onsuccess = ()=> res(q.result || null);
      q.onerror = ()=> rej(q.error);
    });
  }catch(e){ return null; }
}

/* webkitRelativePath と同じ形（フォルダ名/ファイル名）にそろえる。
   folderKey がこれで決まり、聴き終わった本・最後の位置・貯めた語の置き場になる。 */
async function filesFromDir(dir, prefix){
  const out = [];
  for await (const [name, h] of dir.entries()){
    if(h.kind === 'file'){
      const f = await h.getFile();
      f._rel = prefix + name;
      out.push(f);
    }else if(h.kind === 'directory'){
      out.push(...await filesFromDir(h, prefix + name + '/'));
    }
  }
  return out;
}

async function openDir(h, remember){
  pendingHandle = h;
  const files = await filesFromDir(h, h.name + '/');
  if(remember) await putDir(h);
  $('#reopen').hidden = true;
  loadFiles(files);
}

$('#pick').addEventListener('click', async ()=>{
  if(window.showDirectoryPicker){
    let h = null;
    try{ h = await showDirectoryPicker({id:'otodrill', mode:'read'}); }
    catch(e){ if(e && e.name === 'AbortError') return; }
    if(h){ await openDir(h, true); return; }
  }
  $('#picker').click();
});
$('#picker').addEventListener('change', e => loadFiles([...e.target.files]));

/* 立ち上げ直したとき：許可が残っていればそのまま開く。
   残っていなければ、1回押すだけで戻せるボタンを出す（ブラウザが許可を聞くため）。 */
(async function(){
  const h = await getDir();
  if(!h || !h.queryPermission) return;
  const b = $('#reopen');
  b.textContent = '前の ' + h.name + ' を出す';
  b.hidden = false;

/* 文法メモ。1文ずつ書くのではなく「型」を書いて文に当てる。
   （同じ型の練習が何十回も出るので、型で書くほうが行き渡る）
   古い形式（文 → メモ の平たい辞書）もそのまま読める。 */
function matchable(text){
  return ' ' + text.normalize('NFC').toLowerCase().replace(/[,;:"'()\[\]…—–]/g,'').replace(/\s+/g,' ').trim() + ' ';
}

function notesFor(text){
  const out = [];
  const flat = !notes.patterns && !notes.sentences;
  const one = flat ? notes[norm(text)] : (notes.sentences || {})[norm(text)];
  if(one) out.push({title:'この文', body:one});
  if(!flat){
    const t = matchable(text);
    // p.not がある型は、その語を含む文では出さない
    // （例：có phải là の文に「phải＝しなければならない」を出さない）
    (notes.patterns || []).forEach(p => {
      if(t.includes(p.match) && !(p.not && t.includes(p.not))) out.push(p);
    });
  }
  return out.slice(0, 3);
}

function tokenize(text){
  return text.split(/(\s+|[.,!?;:"'()\[\]…—–]+)/).filter(Boolean);
}

function syncScript(t){
  if(!sentEls.length) return;
  let hit = -1;
  for(let i=0;i<sentEls.length;i++){
    if(t >= sentEls[i].start && t < sentEls[i].end){ hit = i; break; }
  }
  if(hit === nowSent) return;
  if(nowSent >= 0) sentEls[nowSent].el.classList.remove('now');
  nowSent = hit;
  if(hit >= 0){
    sentEls[hit].el.classList.add('now');
    sentEls[hit].el.scrollIntoView({block:'nearest'});
  }
}

/* ---- 語を引く ---- */
/* ベトナム語は「học sinh」のように音節が組み合わさるので、長いほうから当てる。 */
function bestForm(sentence, at, token){
  const syl = sentence.text.split(/\s+/).map(w => w.replace(/[.,!?;:"'()\[\]…—–]/g,''));
  if(at < 0 || at >= syl.length || syl[at].toLowerCase() !== token.toLowerCase()){
    // 位置が合わないときだけ本文から探す（記号の入り方が想定外だった場合の保険）
    at = syl.findIndex(w => w.toLowerCase() === token.toLowerCase());
  }
  if(at < 0) return {form: token, hit: lex.words[norm(token)] || null};
  for(let n = Math.min(4, syl.length - at); n >= 1; n--){
    const form = syl.slice(at, at+n).join(' ');
    const hit = lex.words[norm(form)];
    if(hit) return {form, hit};
  }
  return {form: token, hit: null};
}

async function lookup(token, at, seg, file){
  const box = $('#lookup');
  const {form, hit} = bestForm(seg, at, token);
  const syls = form.split(/\s+/);

  const han = syls.map(sy => ({sy, m: lex.morphemes[norm(sy)]})).filter(x => x.m);
  box.hidden = false;
  box.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = '<span class="word"></span><button class="close">閉じる</button>';
  head.querySelector('.word').textContent = form;
  head.querySelector('.close').addEventListener('click', ()=> box.hidden = true);
  box.appendChild(head);

  if(han.length){
    const h = document.createElement('div');
    h.className = 'han';
    han.forEach(({sy, m})=>{
      const c = document.createElement('div');
      c.className = 'cell';
      c.innerHTML = '<span class="kanji"></span><span class="yomi"></span>';
      c.querySelector('.kanji').textContent = m.kanji || '？';
      c.querySelector('.yomi').textContent = sy + '　' + [m.on, m.ko].filter(Boolean).join(' ');
      h.appendChild(c);
    });
    box.appendChild(h);
  }

  const gm = glossOf(seg.text) && wordMeaning(token, seg.text);
  if(gm && (!hit || !hit.ja)){
    const g = document.createElement('div');
    g.className = 'gloss';
    g.innerHTML = '<span class="src">この文での意味（機械の訳・未確認）</span>';
    g.appendChild(document.createTextNode(gm.w + '　' + gm.ja));
    box.appendChild(g);
  }
  if(hit && hit.ja){
    const g = document.createElement('div');
    g.className = 'gloss';
    g.innerHTML = '<span class="src">手元の台帳</span>';
    g.appendChild(document.createTextNode(hit.ja));
    box.appendChild(g);
  }

  const wk = document.createElement('div');
  wk.className = 'gloss';
  wk.innerHTML = '<span class="src">Wiktionary</span>';
  const wkBody = document.createElement('span');
  wkBody.textContent = '引いています…';
  wk.appendChild(wkBody);
  box.appendChild(wk);

  const from = document.createElement('div');
  from.className = 'from';
  from.innerHTML = '<b></b><br><span class="meta"></span>';
  from.querySelector('b').textContent = seg.text;
  from.querySelector('.meta').textContent = file + '　' + fmt(seg.start);
  box.appendChild(from);

  const keep = document.createElement('button');
  keep.className = 'keep';
  const already = kept.some(k => k.form === form && k.sentence === seg.text);
  keep.textContent = already ? '貯めてある' : 'この文ごと貯める';
  keep.disabled = already;
  keep.addEventListener('click', ()=>{
    kept.push({form, ja: (hit && hit.ja) || '', kanji: han.map(x => x.m.kanji).join(''),
               sentence: seg.text, file, start: seg.start, at: new Date().toISOString().slice(0,10)});
    save('kept:'+folderKey, kept);
    emit('keep', {f: folderKey, v: kept[kept.length - 1]});
    keep.textContent = '貯めてある'; keep.disabled = true;
    paintExport();
  });
  box.appendChild(keep);

  // Wiktionary（無料・鍵なし。引けなくても他の表示は残る）
  try{
    const tryForms = form === token ? [form] : [form, token];
    let defs = null;
    for(const f of tryForms){
      const r = await fetch('https://en.wiktionary.org/api/rest_v1/page/definition/' + encodeURIComponent(f));
      if(!r.ok) continue;
      const d = await r.json();
      if(d[LP.code] && d[LP.code].length){ defs = d[LP.code]; break; }
    }
    wkBody.textContent = defs
      ? defs.slice(0,3).map(e => (e.partOfSpeech ? e.partOfSpeech + '：' : '') +
          e.definitions[0].definition.replace(/<[^>]+>/g,'')).join(' / ')
      : '項目がありません。';
  }catch(e){
    wkBody.textContent = 'いま引けませんでした（通信）。';
  }
}

/* ---- 貯めた語を書き出す ---- */
function paintExport(){
  const b = $('#export');
  b.hidden = !kept.length;

}

  const blob = new Blob([head + '\n' + body.join('\n') + '\n'], {type:'text/tab-separated-values'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);

function decks(){

const srcOf = it => it.src || it.deck.src;   // 1つの組に複数の音声がまたがることがある（文法編は1ユニット4〜6本）
function items(){
  const seen = new Set(), out = [];
  decks().forEach(d => d.items.forEach(it => { if(!seen.has(it.id)){ seen.add(it.id); out.push({...it, deck:d}); } }));
  return out;
}

/* ---- 鳴らす：start〜end だけ ---- */
function urlFor(src){
  const f = pfiles[src] || afiles[src];
  if(!purls[src] && f) purls[src] = URL.createObjectURL(f);
  return purls[src];
}
function say(it){
  const u = urlFor(srcOf(it));
  if(!u) return;
  cancelAnimationFrame(raf); clearTimeout(stopTimer);
  const go = ()=>{
    clip.currentTime = it.start;
    stopAt = it.end;
    clip.play().catch(()=>{});
    // 止める：画面の描き替えごとに見る。窓が裏に回ると描き替えが止まるので、時計でも止める
    const tick = ()=>{ if(clip.currentTime >= stopAt){ clip.pause(); return; } raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    clip.addEventListener('playing', ()=>{
      clearTimeout(stopTimer);
      stopTimer = setTimeout(()=> clip.pause(), Math.max(0, (stopAt - clip.currentTime) * 1000 + 40));
    }, {once:true});
  };
  if(clip.dataset.src !== srcOf(it)){
    clip.dataset.src = srcOf(it);
    clip.src = u;
    clip.addEventListener('loadedmetadata', go, {once:true});
  }else go();
}

/* ---- 記録 ---- */
function rec(id){ return srs[id] || {box:0, due:0, seen:0, miss:0}; }
let hist = load('hist', []);   // [時刻, 項目, 練習, 正誤(1/0)]
function mark(it, ok, skill, gain){
  const r = rec(it.id);
  r.seen++;
  hist.push([Date.now(), it.id, skill || pview, ok ? 1 : 0]);
  if(hist.length > 20000) hist = hist.slice(-20000);
  save('hist', hist);
  if(ok){ r.box = Math.min(MAXBOX, r.box + (gain || 1)); }
  else { r.box = 0; r.miss++; }
  r.due = Date.now() + WAIT[r.box];
  r.last = Date.now();
  srs[it.id] = r;
  save('srs', srs);
  emit('ans', {i: it.id, s: skill || pview, o: ok ? 1 : 0, g: gain || 1});
  paintStat();
}
function paintStat(){
  const all = items();
  const now = Date.now();
  const due = all.filter(it => rec(it.id).due <= now).length;
  const known = all.filter(it => rec(it.id).box >= 3).length;
  $('#pstat').textContent = '覚えた ' + known + '/' + all.length + '　いま出す ' + due;
}

/* 次に出す1つ：期限が来たものを、箱の低い順・最後に見たのが古い順に */
const words = t => t.replace(/[.,!?;:“”"]/g, '').split(/\s+/).filter(Boolean);
const orderable = it => it.deck.kind === 'text' && words(it.show).length >= 3 && words(it.show).length <= 12;
const clozable = it => it.deck.kind === 'text' && words(it.show).length >= 2 && words(it.show).length <= 14;
// 書く：文と語、発音編の語（ma・cam など）。字の名前（A a）と音の断片（-ng）は書く対象にしない
const typable = it => it.deck.kind === 'text' || (!/[\s\/]/.test(it.show) && !/^-/.test(it.show) && it.group !== 'letter');
const FILTER = {order: orderable, cloze: clozable, type: typable};
function nextItem(prevId){
  const now = Date.now();
  const all = FILTER[pview] ? items().filter(FILTER[pview]) : items();
  let pool = all.filter(it => it.id !== prevId);
  if(!pool.length) pool = all;
  if(!pool.length) return null;
  const due = pool.filter(it => rec(it.id).due <= now);
  const from = due.length ? due : pool;
  from.sort((a,b)=> (rec(a.id).box - rec(b.id).box) || ((rec(a.id).last||0) - (rec(b.id).last||0)) || (Math.random() - .5));
  const head = from.filter(it => rec(it.id).box === rec(from[0].id).box).slice(0, 5);
  return head[Math.floor(Math.random() * head.length)];
}

/* 選択肢：取り違えやすい組から先に、足りなければ同じ本の同じ課から */
function choicesFor(it){
  const d = it.deck;
  const byId = Object.fromEntries(d.items.map(x => [x.id, x]));
  const near = new Set();
  (d.confusable || []).forEach(g => { if(g.includes(it.id)) g.forEach(id => { if(id !== it.id && byId[id]) near.add(id); }); });
  const pick = [...near].sort(()=> Math.random() - .5).slice(0, 3);
  let rest = d.items.map(x => x.id).filter(id => id !== it.id && !pick.includes(id)).sort(()=> Math.random() - .5);
  if(d.kind === 'text'){
    // 文の組：言葉が重なるもの・長さが近いものを先に（まったく違う文だと、聞かなくても選べてしまう）
    const mine = new Set(words(it.show.toLowerCase()));
    const score = id => { const w = words(byId[id].show.toLowerCase());
      return w.filter(x => mine.has(x)).length * 2 - Math.abs(w.length - mine.size) * .5 + Math.random(); };
    rest = rest.filter(id => byId[id].show.toLowerCase() !== it.show.toLowerCase())
               .sort((a,b)=> score(b) - score(a));
    rest = rest.slice(0, 6).sort(()=> Math.random() - .5).concat(rest.slice(6));
  }
  while(pick.length < 3 && rest.length) pick.push(rest.shift());
  return [it.id, ...pick].sort(()=> Math.random() - .5).map(id => ({...byId[id], deck:d}));
}

/* ---- 穴埋め：1語だけ抜く。文法の語を優先して抜く ---- */
const FUNC = { includes: w => LP.functionWords.includes(w), get list(){ return LP.functionWords; } };   // 文法の語は言語パックから
function clozeQ(it){
  if(!it) return null;
  const w = words(it.show);
  const lw = w.map(x => x.toLowerCase());
  let cand = lw.map((x,i)=> i).filter(i => FUNC.includes(lw[i]));
  if(!cand.length) cand = lw.map((x,i)=> i).filter(i => i > 0 || w.length === 1);
  if(!cand.length) cand = [0];
  const at = cand[Math.floor(Math.random() * cand.length)];
  const ans = lw[at];
  // 選択肢：文法の語なら文法の語から。そうでなければ同じ組の語から、長さの近いもの
  const pool = FUNC.includes(ans) ? FUNC.list
    : [...new Set(it.deck.items.flatMap(x => words(x.show).map(y => y.toLowerCase())))];
  const others = pool.filter(x => x !== ans && !lw.includes(x))
    .map(x => [x, Math.abs(x.length - ans.length) + Math.random() * 3]).sort((a,b)=> a[1] - b[1]).slice(0, 8)
    .sort(()=> Math.random() - .5).slice(0, 3).map(x => x[0]);
  return {it, at, ans, w, opts:[ans, ...others].sort(()=> Math.random() - .5), done:false};
}
function answerCloze(c){
  q.done = true; q.picked = c;
  mark(q.it, c === q.ans, 'cloze');
  say(q.it);
  renderCloze();
}

  box.appendChild(note);

/* ---- 聞いて書く：語ごとに「合っている／声調・記号だけ違う／違う／抜けた」を返す ---- */
const toneRe = () => LP.nearMiss ? new RegExp('[' + LP.nearMiss.marks + ']', 'g') : /(?!)/g;   // 「惜しい」にする記号は言語パックから
function wparts(w){
  const d = w.normalize('NFD').toLowerCase().replace(/[.,!?;:“”"]/g, '');
  const tone = (d.match(toneRe()) || [''])[0];
  const shape = d.replace(toneRe(), '').normalize('NFC');
  const base = shape.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
  return {tone, shape, base};
}
function checkTyped(target, typed){
  const T = words(target).map(wparts), Y = words(typed).map(wparts);
  // 文字（記号なし）で並びを合わせる（LCS）
  const n = T.length, m = Y.length, L = Array.from({length:n+1}, ()=> new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    L[i][j] = T[i].base === Y[j].base ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  const res = []; let i = 0, j = 0;
  while(i < n || j < m){
    if(i < n && j < m && T[i].base === Y[j].base){
      const exact = T[i].shape === Y[j].shape && T[i].tone === Y[j].tone;
      res.push({t:words(target)[i], y:words(typed)[j], k: exact ? 'ok' : 'near'}); i++; j++;
    }else if(j < m && (i >= n || L[i][j+1] >= L[i+1][j])){
      res.push({t:null, y:words(typed)[j], k:'extra'}); j++;
    }else{
      res.push({t:words(target)[i], y:null, k:'miss'}); i++;
    }
  }
  // 抜けと余りが隣り合っていたら「違う語」として1つにまとめる
  const out = [];
  for(const r of res){
    const prev = out[out.length-1];
    if(prev && ((prev.k === 'miss' && r.k === 'extra') || (prev.k === 'extra' && r.k === 'miss'))){
      out[out.length-1] = {t: prev.t || r.t, y: prev.y || r.y, k:'wrong'};
    }else out.push(r);
  }
  return out;
}

/* Telex：aa→â aw→ă ee→ê oo→ô ow→ơ uw→ư w→ư dd→đ、語の終わりの s f r x j で声調 */
const TMARK = {s:'́', f:'̀', r:'̉', x:'̃', j:'̣'};
function placeTone(w, t){
  const d = w.normalize('NFC');
  const plain = d.normalize('NFD').replace(toneRe(), '').normalize('NFC');
  const chars = [...plain], low = chars.map(c => c.toLowerCase());
  const V = 'aăâeêioôơuưy';
  let idx = low.map((c,i)=> V.includes(c) ? i : -1).filter(i => i >= 0);
  if((low[0] === 'q' && low[1] === 'u') || (low[0] === 'g' && low[1] === 'i' && idx.length > 1)) idx = idx.filter(i => i !== 1);
  if(!idx.length) return w;
  const cl = [idx[0]]; for(const i of idx.slice(1)) if(i === cl[cl.length-1] + 1) cl.push(i);
  const marked = cl.filter(i => 'ăâêôơư'.includes(low[i]));
  let at;
  if(marked.length) at = marked[marked.length-1];
  else if(cl.length === 1) at = cl[0];
  else if(cl.length === 3) at = cl[1];
  else at = cl[cl.length-1] === chars.length - 1 ? cl[0] : cl[1];
  chars[at] = (chars[at].normalize('NFD') + TMARK[t]).normalize('NFC');
  return chars.join('');
}
function telexWord(w){
  if(!/^[\p{L}]+$/u.test(w)) return w;
  let tone = '';
  const m = w.match(/^(.*[aeiouyăâêôơư].*?)([sfrxj])$/iu);
  if(m){ w = m[1]; tone = m[2].toLowerCase(); }
  w = w.replace(/dd/g,'đ').replace(/DD|Dd/g,'Đ').replace(/uow/gi,'ươ').replace(/aa/g,'â').replace(/AA|Aa/g,'Â')
       .replace(/aw/g,'ă').replace(/ee/g,'ê').replace(/EE|Ee/g,'Ê').replace(/oo/g,'ô').replace(/OO|Oo/g,'Ô')
       .replace(/ow/g,'ơ').replace(/uw/g,'ư').replace(/w/g,'ư');
  return tone ? placeTone(w, tone) : w;
}
function telexLine(s){ return s.replace(/[\p{L}]+/gu, telexWord); }

function gradeType(v){

/* ---- 並べる：文をばらした語を、聞いた順に押して組み立てる ---- */
function orderQ(it){
  if(!it) return null;
  const w = words(it.show);
  const tiles = w.map((x,i)=> ({x,i}));
  do { tiles.sort(()=> Math.random() - .5); } while(tiles.every((t,i)=> t.i === i));
  return {it, done:false, heard:false, tiles, picked:[]};
}
function renderOrder(){
  const body = $('#pbody');
  if(!q) q = orderQ(nextItem(null));
  if(!q){ body.innerHTML = '<div class="quiz"><div class="pnote">この組には並べられる文がありません。文法編やまとめ問題を選んでください</div></div>'; return; }
  const it = q.it, w = words(it.show);
  body.innerHTML = '';
  const box = document.createElement('div'); box.className = 'quiz';
  box.innerHTML = '<div class="from">' + esc(it.deck.book + '　' + it.deck.title) + '</div>';

  hear.addEventListener('click', ()=>{ say(it); hear.blur(); });
  box.appendChild(hear);

  const slots = document.createElement('div'); slots.className = 'slots';
  q.picked.forEach((ti, k)=>{
    const b = document.createElement('button'); b.textContent = q.tiles[ti].x;
    if(!q.done) b.addEventListener('click', ()=>{ q.picked.splice(k, 1); renderOrder(); });   // 押すと戻せる
    slots.appendChild(b);
  });
  if(q.done) slots.classList.add(q.ok ? 'right' : 'wrong');
  box.appendChild(slots);

  q.tiles.forEach((t, ti)=>{

      q.picked.push(ti);
      if(q.picked.length === w.length){
        q.done = true;
        q.ok = q.picked.map(i => q.tiles[i].x.toLowerCase()).join(' ') === w.map(x => x.toLowerCase()).join(' ');
        mark(it, q.ok, 'order'); say(it);
      }
      renderOrder();
    });
    tiles.appendChild(b);
  });
  box.appendChild(tiles);

  const note = document.createElement('div'); note.className = 'pnote';

  body.appendChild(box);

/* ---- 解説：答えたあとに、文の意味・語ごとの意味・文法を出す（2026-10-01） ----
   本人「正解したら文法の意味とか説明を入れておいてくれないと、どう正解したのか、どう間違ったのかが分からない」
   「単語も押したときに内容が分からない。訳を出すのか」。
   ⭕ 語の意味は押さなくても読めるよう、語のすぐ下に書き添える。
   ⭕ 出どころを分ける：文法メモ（notes.json・手で書いた）／機械の訳（gloss.json・未確認）。⛔ 機械の訳を確かめた物のように見せない */
function glossOf(text){ return gloss[text] || gloss[(text || '').trim()] || null; }
function wordMeaning(w, text){
  const g = glossOf(text), k = norm(w);
  if(g) for(const [x, ja] of g.words){ if(norm(x) === k || norm(x).split(' ').includes(k)) return {w: x, ja, src: '機械'}; }
  const lx = lex.words[k] || lex.words[w];
  if(lx && lx.ja) return {w, ja: lx.ja, src: '台帳'};
  for(const t of Object.keys(gloss)){ const h = gloss[t].words.find(([x]) => norm(x) === k); if(h) return {w: h[0], ja: h[1], src: '機械'}; }
  return null;
}
/* 訳の無い文：台帳の語（bác sĩ・Việt Nam など2〜3音節）に合わせ、長い語から先にまとめる */
function segmentByLex(text){
  const ws = words(text), out = [];
  if(LP.segment !== 'syllable+lexicon') return ws;
  for(let i = 0; i < ws.length;){
    let n = 1;
    for(let k = Math.min(3, ws.length - i); k > 1; k--){ if(lex.words[norm(ws.slice(i, i + k).join(' '))]){ n = k; break; } }
    out.push(ws.slice(i, i + n).join(' ')); i += n;
  }
  return out;
}
/* 押した語の意味を、画面の下に少しのあいだ出す */
let toastT = 0;
function toast(html){
  const t = $('#toast'); t.innerHTML = html; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(()=> t.hidden = true, 4000);
}
function explainEl(it, res){
  // res：{ok, wrong:[{you, right}] }
  const box = document.createElement('section'); box.className = 'explain';
  const g = it.deck && it.deck.kind === 'text' ? glossOf(it.show) : null;
  let h = '<div class="exr"><span class="pill ' + (res.ok ? 'ok' : 'ng') + '">' + (res.ok ? '正解' : res.close ? 'おしい' : '不正解') + '</span>' +
    (res.msg ? '<span class="exmsg">' + esc(res.msg) + '</span>' : '') + '</div>';
  if(g && g.words.length){
    h += '<div class="gl" lang="' + LP.code + '">' + g.words.map(([w, ja]) => '<span class="glw"><b>' + esc(w) + '</b><small lang="ja">' + esc(ja) + '</small></span>').join('') + '</div>';
  }else if(it.deck && it.deck.kind === 'text'){
    h += '<div class="gl" lang="' + LP.code + '">' + segmentByLex(it.show).map(w => { const m = wordMeaning(w, it.show);
      return '<span class="glw"><b>' + esc(w) + '</b><small lang="ja">' + (m ? esc(m.ja) : '—') + '</small></span>'; }).join('') + '</div>';
  }
  if(g && g.ja) h += '<div class="exja"><span class="exk">意味</span><div>' + esc(g.ja) + (g.check ? '<div class="excheck">要確認：' + esc(g.check) + '（別のモデルの判定）</div>' : '') + '</div></div>';
  (res.wrong || []).forEach(x => {
    const a = wordMeaning(x.you, it.show), b = wordMeaning(x.right, it.show);
    h += '<div class="exdiff"><span class="exk">違い</span><span>選んだ <b>' + esc(x.you || '（なし）') + '</b>' + (a ? '＝' + esc(a.ja) : '') + '</span><span>正しくは <b>' + esc(x.right) + '</b>' + (b ? '＝' + esc(b.ja) : '') + '</span></div>';
  });
  const ns = it.deck && it.deck.kind === 'text' ? notesFor(it.show) : [];
  ns.forEach(n => { h += '<div class="exnote"><span class="exk">文法</span><div><b>' + esc(n.title || '') + '</b>' + esc(n.body) + '</div></div>'; });
  if(g && g.point && !ns.length) h += '<div class="exnote"><span class="exk">要点</span><div>' + esc(g.point) + '</div></div>';
  if(g) h += '<div class="exsrc">意味と要点は機械の訳（未確認）。文法は手で書いたメモ。</div>';
  else if(it.deck && it.deck.kind === 'text') h += '<div class="exsrc">この文の訳はまだありません。語の意味は台帳から。</div>';
  box.innerHTML = h;
  return box;
}

function answerSay(ok){ q.done = true; mark(q.it, ok, 'say'); nextQ(); }
function nextRow(){

function nextQ(){

  if(pview === 'order'){ q = orderQ(it); renderOrder(); return; }
  if(pview === 'cloze'){ q = clozeQ(it); renderCloze(); return; }

document.addEventListener('keydown', e=>{
  if(mode !== 'practice' || !q || pview === 'table') return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if(pview === 'type'){   // 書く欄の中では space と enter を欄に任せる
    if(e.target.id === 'typein') return;
    if(k === 'Enter' && q.done){ e.preventDefault(); nextQ(); }
    return;
  }
  if(pview === 'cloze'){
    if(!q.done && /^[1-4]$/.test(k)){ const c = q.opts[Number(k)-1]; if(c) answerCloze(c); }
    else if(k === ' '){ e.preventDefault(); if(q.done) say(q.it); }
    else if(k === 'Enter' && q.done){ e.preventDefault(); nextQ(); }
    return;
  }
  if(pview === 'order'){
    if(k === ' '){ e.preventDefault(); say(q.it); }
    else if(k === 'Enter' && q.done){ e.preventDefault(); nextQ(); }
    return;
  }
  if(pview === 'hear'){
    if(!q.done && /^[1-4]$/.test(k)){ const c = q.choices[Number(k)-1]; if(c){ q.done = true; q.picked = c.id; mark(q.it, c.id === q.it.id, 'hear'); renderQuiz(); } }
    else if(k === ' '){ e.preventDefault(); say(q.it); }
    else if(k === 'Enter' && q.done){ e.preventDefault(); nextQ(); }
  }else{
    if(k === ' '){ e.preventDefault(); if(!q.heard){ q.heard = true; say(q.it); renderQuiz(); } else say(q.it); }
    else if(q.heard && !q.done && k === 'ArrowRight'){ e.preventDefault(); answerSay(true); }
    else if(q.heard && !q.done && k === 'ArrowLeft'){ e.preventDefault(); answerSay(false); }

});

/* ================= 見渡す ================= */
/* どこまで覚えたかを、項目・語・練習の3つの目で見る。数え方は README と実現方式に書いた。 */
const SKILL = [['hear','聞いて選ぶ'], ['order','並べる'], ['cloze','穴埋め'], ['type','聞いて書く'], ['say','見て言う']];
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); };
function level(id){ const r = rec(id); return r.box >= 3 ? 2 : (r.seen > 0 ? 1 : 0); }   // 0 未着手 1 覚えかけ 2 覚えた

function stackBar(counts, total){
  const lab = ['未着手','覚えかけ','覚えた'];
  return '<div class="sbar">' + [2,1,0].filter(k => counts[k]).map(k =>
    '<i class="lv' + k + '" style="flex:' + counts[k] + '" title="' + lab[k] + '　' + counts[k] + '/' + total + '"></i>').join('') + '</div>';
}

function renderOverview(){
  const box = $('#overview');
  if(!pdata){ box.innerHTML = ''; return; }
  // すべての項目（id で1つに）
  const all = new Map();
  pdata.decks.forEach(d => d.items.forEach(it => { if(!all.has(it.id)) all.set(it.id, {...it, deck:d}); }));
  const list = [...all.values()];
  const known = list.filter(it => level(it.id) === 2).length;

  // 語：文と語の組に出てくる語。その語を含む項目のうち一番進んだ段で色を付ける
  const wmap = new Map();
  list.filter(it => it.deck.kind === 'text').forEach(it => words(it.show).forEach(w0 => {
    const w = w0.toLowerCase(); if(!/\p{L}/u.test(w)) return;
    const e = wmap.get(w) || {w, n:0, lv:0, items:[]};
    e.n++; e.lv = Math.max(e.lv, level(it.id)); e.items.push(it);
    wmap.set(w, e);
  }));
  const wl = [...wmap.values()].sort((a,b)=> b.n - a.n || a.w.localeCompare(b.w, LP.code));
  const wSeen = wl.filter(e => e.lv > 0).length;

  const today = dayKey(Date.now());

    });

  html += '</div>';

      '<span class="ct">' + (rate === null ? 'まだ' : rate + '%　' + hs.length + '回') + '</span></div>';
  });
  html += '</div>';

  // 12週の積み上げ

  // 語の地図

  html += '<h3 class="ovh">語の地図<small>よく出る語から。色はその語を含む文の進み具合、下線は書いて正解した語。押すと鳴る</small></h3>' +
    '<div class="seg wf">' + [['all','すべて ' + wl.length], ['2','覚えた ' + cnt[2]], ['1','覚えかけ ' + cnt[1]], ['0','未着手 ' + cnt[0]]]

    const it = e.items.slice().sort((x,y)=> x.show.length - y.show.length)[0];   // 一番短い項目（多くはその語だけ）を鳴らす
    say(it);
    const m = wordMeaning(e.w, it.show);
    toast('<b lang="' + LP.code + '">' + esc(m ? m.w : e.w) + '</b>' + (m ? esc(m.ja) + '<small>' + (m.src === '機械' ? '機械の訳（未確認）' : '台帳') + '</small>' : '<small>意味はまだありません</small>'));
  }));
  box.querySelectorAll('.wk').forEach(b => b.addEventListener('click', ()=> say(all.get(b.dataset.id))));
}
function tile(label, n, total){
  return '<div class="tile"><div class="eyebrow">' + label + '</div><div class="big">' + n +
    (total !== null ? '<small> / ' + total + '</small>' : '') + '</div></div>';
}
function heatmap(perDay){
  // 列＝週（古い→新しい）、行＝月〜日。色は1色の濃淡（多いほど濃い）
  const end = new Date(); end.setHours(0,0,0,0);
  const dow = (end.getDay() + 6) % 7;             // 月曜を0に
  const start = new Date(end.getTime() - (7*11 + dow) * DAY);
  const max = Math.max(1, ...Object.values(perDay));
  let cells = '';
  for(let w = 0; w < 12; w++){
    cells += '<div class="hcol">';
    for(let d = 0; d < 7; d++){
      const t = start.getTime() + (w*7 + d) * DAY;
      if(t > end.getTime()){ cells += '<i class="h none"></i>'; continue; }
      const n = perDay[dayKey(t)] || 0;
      const lv = n === 0 ? 0 : Math.min(4, 1 + Math.floor(n / max * 3.999));
      const dt = new Date(t);
      cells += '<i class="h h' + lv + '" title="' + (dt.getMonth()+1) + '/' + dt.getDate() + '　' + n + '問"></i>';
    }
    cells += '</div>';
  }
  return '<div class="heat"><div class="hdays"><span>月</span><span></span><span>水</span><span></span><span>金</span><span></span><span>日</span></div>' + cells +
    '</div><div class="legend ov"><span class="lg">少ない</span><i class="h h1"></i><i class="h h2"></i><i class="h h3"></i><i class="h h4"></i><span class="lg">多い</span></div>';
}

/* ================= 教材 ================= */
/* 教材ごとに、進み具合・紙の問題・文法・語彙を1か所で見る（本人 2026-09-30）。
   教材＝開いたフォルダ。課はフォルダの中の book.json で決める（無ければサブフォルダで仮に切る）。
   ⭕ 練習の箱と履歴は言語の側の id のまま全教材で1つ。教材ごとの数字は、その教材の項目で絞って数える。
   ⭕ 紙の問題の記録は足していくだけ。上書きしない（やり直した回も残る）。 */

let book = null, bookId = '';
let bview = load('b:view', 'lesson');
let bopen = null;      // 文法で開いている型
const PAPER = {o:['○',1], s:['△',.5], x:['×',0]};

function setBook(data){
  book = data && Array.isArray(data.lessons) ? data : null;
  bookId = (book && book.id) || folderKey;
  // 教材の一覧に載せる。手掛かりは教材ごとに覚える（一覧から開き直すため）
  const lib = load('books', {});
  lib[bookId] = {title: (book && book.title) || folderKey, folder: folderKey, lessons: lessons().length, last: Date.now()};
  save('books', lib);
  if(lastHandle) putDir(lastHandle, 'book:' + bookId);
  lessonCache = null; shows = null; blesson = null;
  if(mode === 'book') renderBook();
  paintLtag();
}

/* 課の並び。book.json が無いときは、サブフォルダごと（無ければ全体で1つ） */
function lessons(){
  if(book) return book.lessons;
  const subs = [...new Set(tracks.map(t => t.rel.split('/')).filter(a => a.length > 2).map(a => a[1]))];
  if(subs.length) return subs.map(sb => ({id: sb, title: sb, folder: sb}));
  return [{id: 'all', title: '全体'}];
}
function inLesson(L, t){
  if(L.match){
    if(L._re === undefined){ try{ L._re = new RegExp(L.match, 'i'); }catch(e){ L._re = null; } }
    return !!L._re && L._re.test(t.name);
  }
  if(L.tracks) return L.tracks.includes(t.name);
  if(L.folder) return t.rel.split('/')[1] === L.folder;
  return L.id === 'all';
}

/* 課ごとに：音声・本文の文・練習の項目。開くたびに数えるのは重いので1回だけ */
let lessonCache = null;
function lessonData(){
  if(lessonCache) return lessonCache;
  const ls = lessons();
  const allItems = pdata ? pdata.decks.flatMap(d => d.items.map(it => ({...it, deck: d}))) : [];
  lessonCache = ls.map(L => {
    const ts = tracks.filter(t => inLesson(L, t));
    const names = new Set(ts.map(t => t.name));
    const sents = [];
    ts.forEach(t => ((script && script[t.name]) ? script[t.name].segments : []).forEach(seg =>
      sents.push({file: t.name, seg, m: matchable(seg.text), n: ' ' + norm(seg.text) + ' ', long: norm(seg.text).split(' ').length >= 3})));
    const dk = new Set(L.decks || []);
    const its = allItems.filter(it => dk.has(it.deck.id) || names.has(srcOf(it)));
    return {L, tracks: ts, sents, items: its, ids: new Set(its.map(i => i.id))};
  });
  return lessonCache;
}

/* 語と型を、最初に出てくる課に寄せる（lesson が書いてあればそちら） */
function firstLesson(text, given){
  const ld = lessonData();
  if(given){ const i = ld.findIndex(x => x.L.id === given); if(i >= 0) return i; }
  // 文法の型は前後の空白まで含めて書いてある（matchable と突き合わせる）。語は記号を落とした本文と突き合わせる
  const isPat = text.startsWith(' ');
  const m = isPat ? text : ' ' + norm(text) + ' ';
  // ⛔ 発音の練習の1語だけの区間（「Đã」など）で課を決めない。3語以上の文で探し、無ければ何でも
  // book.json で assign:false の課（発音の練習など）は、ほかに無いときだけ使う
  const f = s => (isPat ? s.m : s.n).includes(m);
  for(const ok of [x => x.L.assign !== false && x.sents.some(s => s.long && f(s)), x => x.sents.some(s => s.long && f(s)), x => x.sents.some(f)]){
    const i = ld.findIndex(ok); if(i >= 0) return i;
  }
  return -1;
}
function sentsWith(m, li, field){
  field = field || 'm';
  const ld = lessonData();
  const pool = li >= 0 ? ld[li].sents.concat(...ld.filter((_, i) => i !== li).map(x => x.sents)) : ld.flatMap(x => x.sents);
  const hit = pool.filter(s => s[field].includes(m));
  return hit.filter(s => s.long).concat(hit.filter(s => !s.long));
}
function playSent(s){ say({src: s.file, start: s.seg.start, end: s.seg.end, deck: {}}); }

/* 語の覚えた具合：その語を含む練習の項目のうち、一番進んだ段 */
let wlMemo = new Map(), shows = null;
function wordLevel(w){
  if(wlMemo.has(w)) return wlMemo.get(w);
  let lv = typed.has(w) ? 2 : 0;
  if(pdata){
    if(!shows) shows = pdata.decks.flatMap(d => d.items.map(it => [' ' + norm(it.show) + ' ', it.id]));
    const m = ' ' + w + ' ';
    for(const [sh, id] of shows){ if(lv === 2) break; if(sh.includes(m)) lv = Math.max(lv, level(id)); }
  }
  wlMemo.set(w, lv);
  return lv;
}

function vocab(){
  const ld = lessonData();
  const out = ld.map(() => []);
  const rest = [];
  const seen = new Set();
  const put = (li, e) => { if(seen.has(e.w)) return; seen.add(e.w); (li >= 0 ? out[li] : rest).push(e); };
  Object.entries(lex.words || {}).forEach(([w, v]) => {
    const k = norm(w);
    put(firstLesson(k, v.lesson), {w: k, ja: v.ja || '', mo: v.morphemes});
  });
  kept.forEach(k => {
    const w = norm(k.form);
    const li = ld.findIndex(x => x.tracks.some(t => t.name === k.file));
    put(li, {w, ja: k.ja || '', kept: true});
  });
  // 台帳が無い教材：本文に出た語（1音節ずつ）を、最初に出た課に置く
  if(!Object.keys(lex.words || {}).length){
    ld.forEach((x, li) => x.sents.forEach(s => s.n.trim().split(' ').forEach(w => {
      if(/^\p{L}+$/u.test(w) && !/^\d/.test(w)) put(li, {w, ja: '', syl: true});
    })));
  }
  const keptSet = new Set(kept.map(k => norm(k.form)));
  out.concat([rest]).forEach(a => a.forEach(e => { e.kept = e.kept || keptSet.has(e.w); }));
  return {out, rest};
}

function grammar(){
  const ld = lessonData();
  const out = ld.map(() => []), rest = [];
  (notes.patterns || []).forEach(p => {
    const li = firstLesson(p.match, p.lesson);
    (li >= 0 ? out[li] : rest).push({...p, li});
  });
  return {out, rest};
}

/* ---- 紙の問題 ---- */
function paperDefs(){
  const own = load('paperdef:' + bookId, {});
  const ls = lessons();
  const defs = {};
  ls.forEach(L => { defs[L.id] = (L.exercises || []).concat(own[L.id] || []); });
  return defs;
}
function paperRecs(){ return load('paper:' + bookId, []); }
function paperLatest(){
  const last = {};
  paperRecs().forEach(r => { last[r.l + '|' + r.ex + '|' + r.n] = r; });
  return last;
}
function exCount(ex){ const o = load('excount:' + bookId, {}); return o[ex.id] || ex.count || 0; }
function paperScore(lid, defs, last){
  let got = 0, tot = 0, done = 0;
  (defs[lid] || []).forEach(ex => { for(let n = 1; n <= exCount(ex); n++){
    tot++; const r = last[lid + '|' + ex.id + '|' + n]; if(r){ done++; got += PAPER[r.r][1]; }
  }});
  return {got, tot, done};
}

function rateOf(ids){
  const hs = hist.filter(h => ids.has(h[1])).slice(-50);
  return hs.length ? {r: Math.round(hs.reduce((n, h) => n + h[3], 0) / hs.length * 100), n: hs.length} : null;
}
