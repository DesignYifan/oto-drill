<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音声ドリル</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=LINE+Seed+JP:wght@400;700&display=swap">
<style>
/* 見た目の値の正は vault の 008_project/LanguageVideo/_設計_見た目.md（マインドマップ・Language Video と同じ）。
   静かな少ない色。線で区切らず、余白と薄く広い影で層を分ける。色は「状態」にだけ差す。
   差し色は3つ：青（主たる操作・学習中）／ティール（覚えた）／すみれ（まだ知らない・間違えた）。
   ⛔ 切り替えの選んだ側は青にしない（黒）。⛔ 暖色は「要確認」（惜しい）にだけ使う。
   書体：ベトナム語の文字（ơ ư ạ …）を持つ Be Vietnam Pro と、日本語の LINE Seed JP。
   ⛔ 決めごとの Satoshi・SUIT はベトナム語の文字を持たない（2026-10-01 に確かめた）ので使わない。 */
:root{
  --ground:#f5f6f8;
  --surface:#FFFFFF;
  --subtle:#f8f9fb;
  --line:#eef0f4;
  --hair:#eef0f4;
  --ink:#16181d;
  --muted:#656a75;
  --ink3:#9ba1ad;
  --accent:#2f6bf0;
  --accent-soft:#e9f0fe;
  --on-accent:#FFFFFF;
  --teal:#21a9a0;
  --ok:#16786f;
  --ok-soft:#e4f3f1;
  --violet:#7a68f0;
  --shadow:0 1px 2px rgba(20,24,32,.02), 0 14px 38px rgba(20,24,32,.055);
  --sh-lift:0 1px 2px rgba(20,24,32,.02), 0 22px 52px rgba(20,24,32,.08);
  --sh-btn:0 1px 2px rgba(20,24,32,.04), 0 4px 14px rgba(20,24,32,.05);
  --r-card:16px; --r-in:12px; --r-sm:8px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#121418; --surface:#1b1e24; --subtle:#22262d; --line:#2a2f37; --hair:#2a2f37;
    --ink:#e8eaee; --muted:#a0a6b1; --ink3:#6f7581;
    --accent:#5b8af4; --accent-soft:#1f2a44; --on-accent:#FFFFFF;
    --teal:#3cc3b8; --ok:#5fd0c5; --ok-soft:#173330; --violet:#9b8cf5;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 38px rgba(0,0,0,.35);
    --sh-lift:0 1px 2px rgba(0,0,0,.3), 0 22px 52px rgba(0,0,0,.45);
    --sh-btn:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#121418; --surface:#1b1e24; --subtle:#22262d; --line:#2a2f37; --hair:#2a2f37;
  --ink:#e8eaee; --muted:#a0a6b1; --ink3:#6f7581;
  --accent:#5b8af4; --accent-soft:#1f2a44; --on-accent:#FFFFFF;
  --teal:#3cc3b8; --ok:#5fd0c5; --ok-soft:#173330; --violet:#9b8cf5;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 38px rgba(0,0,0,.35);
  --sh-lift:0 1px 2px rgba(0,0,0,.3), 0 22px 52px rgba(0,0,0,.45);
  --sh-btn:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:'Be Vietnam Pro','LINE Seed JP','Hiragino Sans',system-ui,sans-serif;
  font-size:14px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.app{height:100dvh; overflow:hidden; display:flex; flex-direction:column}

.eyebrow{
  font-family:inherit;
  font-size:10px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted);
}

/* ---- ヘッダー ---- */
header{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:14px 24px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.wordmark{display:flex; align-items:baseline; gap:10px}
.wordmark b{font-size:15px; font-weight:600; letter-spacing:.04em}
.folder{
  margin-left:auto; color:var(--muted); font-size:12px; text-align:right;
  display:flex; align-items:center; gap:8px;
}
.folder .name{
  font-family:inherit;
  color:var(--ink); font-size:12px;
}

button{
  font:inherit; font-size:13px;
  color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:6px;
  padding:6px 12px; cursor:pointer;
  transition:border-color .12s, background .12s, color .12s;
}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button.primary{
  background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:500;
}
button.primary:hover{filter:brightness(1.07)}
button.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600}

/* ---- 本体 ---- */
main{flex:1; display:grid; grid-template-columns:minmax(0,1fr) 352px; min-height:0}
@media (max-width:820px){
  main{grid-template-columns:1fr; grid-template-rows:minmax(0,1.4fr) minmax(148px,1fr)}
}

.panel{
  padding:30px 32px 24px; display:flex; flex-direction:column; gap:26px;
  min-width:0; min-height:0; overflow-y:auto;
}

/* 一覧をたたむ。閉じたら中身を消す。 */
.app.list-off #filter,
.app.list-off ol,
.app.list-off .ledger-empty{display:none}

/* 広いとき：右の列ごと消して、本体を広げる（幅を取るのが困るので） */
@media (min-width:821px){
  .app.list-off aside{display:none}
  .app.list-off main{grid-template-columns:minmax(0,1fr)}
  #foldList{display:none}
}
/* 狭いとき：下にたたむ。開ける手掛かりを画面の下に残す
   （窓を半分にして教科書と並べて使うため、下が一番手が届く） */
@media (max-width:820px){
  #toggleList{display:none}
  .app.list-off main{grid-template-rows:minmax(0,1fr) auto}
  .app.list-off aside{border-top:1px solid var(--line)}
}

.caret{font-size:10px; margin-right:5px; display:inline-block; transition:transform .12s}
.app.list-off .caret{transform:rotate(-90deg)}

/* 一覧の頭に置く開け閉め。閉じているときは、この帯ごと押せるようにする。 */
button.fold{
  border:0; background:transparent; color:var(--muted);
  padding:5px 6px; font-size:12px; white-space:nowrap; flex:none;
  display:flex; align-items:center;
}
button.fold:hover{color:var(--ink); border-color:transparent}
.app.list-off button.fold{flex:1; justify-content:flex-start}

/* 計器 */
.readout{display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap}
.bignum{
  font-family:inherit;
  font-size:64px; font-weight:600; line-height:.9; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.oftotal{
  font-family:inherit;
  font-size:15px; color:var(--muted); font-variant-numeric:tabular-nums;
  padding-bottom:5px;
}
.fname{
  font-size:16px; font-weight:500; word-break:break-all; text-wrap:balance;
  margin-top:10px;
}
.fname.blank{color:var(--muted); font-weight:400}

/* 進行 */
.track{display:flex; align-items:center; gap:14px}
.clock{
  font-family:inherit;
  font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:42px;
}
.clock.right{text-align:right}
input[type=range]{
  -webkit-appearance:none; appearance:none; flex:1; height:20px; background:transparent; cursor:pointer;
}
input[type=range]:focus-visible{outline:2px solid var(--accent); outline-offset:4px; border-radius:4px}
input[type=range]::-webkit-slider-runnable-track{height:2px; background:var(--line)}
input[type=range]::-moz-range-track{height:2px; background:var(--line)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:3px; height:20px; margin-top:-9px;
  background:var(--accent); border:0; border-radius:1px;
}
input[type=range]::-moz-range-thumb{
  width:3px; height:20px; background:var(--accent); border:0; border-radius:1px;
}
input[type=range]:disabled::-webkit-slider-thumb{background:var(--line)}

/* ---- 下に固定する操作卓 ---- */
/* 本文や一覧をどれだけ下までたどっても、再生位置・送り・速度は画面の下に出したままにする。
   （途中で止めるたびに上へ戻るのが手間だったため） */
.dock{
  flex:none;
  background:var(--surface);
  border-top:1px solid var(--line);
  box-shadow:0 -6px 22px rgba(26,36,30,.05);
  padding:9px 24px calc(9px + env(safe-area-inset-bottom, 0px));
  display:flex; flex-direction:column; gap:9px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .dock{box-shadow:0 -6px 22px rgba(0,0,0,.3)}
}
:root[data-theme="dark"] .dock{box-shadow:0 -6px 22px rgba(0,0,0,.3)}

/* 速度：細かい段はパネルの「速度」に置いたまま。ここは 0.1 の上げ下げだけ */
/* つまみは縮められるようにしておく（狭い画面で横にはみ出すため） */
.dock .track{gap:12px}
.dock .track input[type=range]{min-width:0}
.dock .clock{min-width:38px}

.rate-nudge{display:flex; align-items:center; gap:6px; flex:none}
.rate-nudge button{
  padding:3px 9px; line-height:1.4;
  font-family:inherit; font-size:13px;
}
.rate-dock{
  font-family:inherit; font-size:12px;
  color:var(--muted); font-variant-numeric:tabular-nums;
  min-width:42px; text-align:center;
}

/* 送り */
.dock-row{display:flex; align-items:center; gap:12px}
.now{flex:1; min-width:0; display:flex; align-items:baseline; gap:9px}
.now .n{
  font-family:inherit; font-size:12px;
  color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.now .nm{
  font-size:13px; color:var(--muted);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.dock-row .spacer{flex:1}
.transport{display:flex; align-items:center; gap:8px}
.transport button{padding:9px 14px; min-height:40px}
#play{min-width:112px; padding:11px 20px; font-size:14px}
.transport .mono{font-family:inherit; font-size:12px}

/* 狭いときは名前を落として、送りのボタンを画面幅いっぱいに広げる */
@media (max-width:820px){
  .dock{padding:8px 14px calc(8px + env(safe-area-inset-bottom, 0px)); gap:8px}
  .dock .track{gap:9px}
  .dock .clock{min-width:34px; font-size:11px}
  .rate-nudge{gap:4px}
  .rate-nudge button{padding:3px 7px}
  .rate-dock{min-width:36px}
  .now, .dock-row .spacer{display:none}
  .transport{flex:1; gap:6px}
  .transport button{flex:1 1 0; padding:10px 2px; min-width:0}
  #play{flex:1.5 1 0; min-width:0; padding:12px 2px}
}

/* 設定行 */
.setting{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.setting > .eyebrow{min-width:58px}
.speeds{display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--line); border-radius:6px; overflow:hidden}
.speeds button{
  border:0; border-right:1px solid var(--line); border-radius:0;
  padding:6px 11px;
  font-family:inherit; font-size:12px;
  font-variant-numeric:tabular-nums;
}
.speeds button:last-child{border-right:0}
.rate-now{
  font-family:inherit; font-size:12px;
  color:var(--muted); font-variant-numeric:tabular-nums; min-width:56px;
}
select{
  font:inherit; font-size:13px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line);
  border-radius:6px; padding:5px 8px;
}
select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
label.opt{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; cursor:pointer}
label.opt input[type=checkbox]{accent-color:var(--accent)}

/* キー一覧 */
.keys{
  margin-top:auto; padding-top:18px; border-top:1px solid var(--hair);
  color:var(--muted); font-size:12px; line-height:2.1;
  display:flex; flex-wrap:wrap; gap:4px 18px;
}
.keys span{white-space:nowrap}
kbd{
  font-family:inherit; font-size:11px;
  background:var(--ground); border:1px solid var(--line);
  border-radius:4px; padding:1px 5px; margin-right:3px; color:var(--ink);
}

/* ---- 本文（transcript.json があるときだけ出る） ---- */
.script{
  flex:1; min-height:0; overflow-y:auto;
  border-top:1px solid var(--hair); padding-top:16px;
  display:flex; flex-direction:column; gap:2px;
}
.sent{
  padding:7px 10px; border-radius:6px; cursor:pointer;
  line-height:1.9;
}
.sent:hover{background:var(--surface)}
.sent.now{background:var(--accent-soft)}
.sent .t{
  font-family:inherit; font-size:11px;
  color:var(--muted); font-variant-numeric:tabular-nums; margin-right:10px;
}
.w{border-radius:3px; padding:0 1px; cursor:pointer}
.w:hover{background:var(--accent); color:var(--on-accent)}
.w.picked{box-shadow:inset 0 -2px 0 var(--accent)}
.note{
  font-size:12px; color:var(--muted); margin:2px 0 6px 13px;
  padding-left:10px; line-height:1.7;
}
.script-empty{color:var(--muted); font-size:13px; padding:8px 2px}

/* 狭いときは本文の中で送らず、パネルごと送る（本文の枠が数十pxに潰れるため）。
   ⛔ この2つは .script の指定より後ろに置くこと（同じ強さなので、後ろが勝つ）。 */
@media (max-width:820px){
  .panel{padding:22px 18px 18px; gap:20px}
  .script{flex:none; min-height:0; overflow:visible}
}

/* ---- 引いた語 ---- */
.lookup{
  position:fixed; right:20px; bottom:calc(var(--dock-h, 104px) + 14px);
  width:min(400px, calc(100vw - 40px));
  max-height:min(56vh, 520px); overflow-y:auto; z-index:40;
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); padding:16px 18px;
  display:flex; flex-direction:column; gap:12px;
}
.lookup[hidden]{display:none}
.lookup .head{display:flex; align-items:baseline; gap:12px}
.lookup .word{font-size:22px; font-weight:600; word-break:break-word}
.lookup .close{margin-left:auto; padding:2px 8px; font-size:12px}
.han{display:flex; flex-wrap:wrap; gap:8px}
.han .cell{
  border:1px solid var(--line); border-radius:7px; padding:6px 10px;
  display:flex; align-items:baseline; gap:8px; background:var(--ground);
}
.han .kanji{font-size:19px; font-weight:600}
.han .yomi{font-size:11px; color:var(--muted); font-family:inherit}
.gloss{font-size:14px; line-height:1.7}
.gloss .src{
  font-family:inherit; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:2px;
}
.from{
  font-size:12px; color:var(--muted); line-height:1.8;
  border-top:1px solid var(--hair); padding-top:10px;
}
.from b{color:var(--ink); font-weight:500}
.lookup .keep{align-self:flex-start}

/* ---- 帳簿 ---- */
aside{
  background:var(--surface); border-left:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
}
@media (max-width:820px){ aside{border-left:0; border-top:1px solid var(--line)} }
.ledger-head{
  display:flex; align-items:center; gap:10px;
  padding:12px 16px; border-bottom:1px solid var(--line);
}
.ledger-head input{
  flex:1; min-width:0; font:inherit; font-size:13px; color:var(--ink);
  background:var(--ground); border:1px solid var(--line);
  border-radius:6px; padding:5px 9px;
}
.ledger-head input:focus-visible{outline:2px solid var(--accent); outline-offset:-1px}
.tally{
  font-family:inherit; font-size:12px;
  color:var(--muted); font-variant-numeric:tabular-nums;
}
ol{list-style:none; margin:0; padding:0; overflow-y:auto; flex:1}
ol:empty{flex:0 0 auto}
li{
  display:flex; align-items:center; gap:12px;
  padding:8px 16px 8px 13px;
  border-bottom:1px solid var(--hair);
  cursor:pointer; font-size:13px;
}
li:hover{background:var(--ground)}
li.current{background:var(--accent-soft)}
li .n{
  font-family:inherit; font-size:12px;
  color:var(--muted); font-variant-numeric:tabular-nums; min-width:30px;
}
li.current .n{color:var(--accent); font-weight:600}
li.current .nm{font-weight:600}
li .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
li .done{color:var(--ok); font-size:12px}
li.hidden{display:none}
.ledger-empty{padding:22px 18px; color:var(--muted); font-size:13px; line-height:1.8}

/* ドロップ */
#drop{
  position:fixed; inset:0; z-index:60; display:none;
  align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  border:3px dashed var(--accent);
  color:var(--accent); font-size:19px; font-weight:600; letter-spacing:.02em;
  pointer-events:none;
}
#drop.show{display:flex}

/* ================= 練習（practice.json があるときだけ出る） ================= */
/* 聴くだけだと、自分で選んで確かめられないので覚えられない（本人 2026-09-30）。
   表を押して1音ずつ鳴らす／聞いて選ぶ／見て言う、の3つ。 */
:root{ --miss:#6a58e0; --miss-soft:#efedfd }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --miss:#9b8cf5; --miss-soft:#26223d }
}
:root[data-theme="dark"]{ --miss:#9b8cf5; --miss-soft:#26223d }

.modes{display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden}
.modes button{border:0; border-radius:0; padding:6px 14px}
.modes button + button{border-left:1px solid var(--line)}

.app.practicing main, .app.practicing .dock, .app.practicing #toggleList{display:none}
.practice{flex:1; min-height:0; overflow-y:auto; padding:22px 32px 40px}
.practice[hidden]{display:none}
.pbar{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; margin-bottom:22px}
.pbar .seg{display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:6px; overflow:hidden}
.pbar .seg button{border:0; border-radius:0; padding:6px 12px}
.pbar .seg button + button{border-left:1px solid var(--line)}
.pbar .stat{margin-left:auto; color:var(--muted); font-size:12px; font-family:inherit}

/* 表 */
.gridwrap{display:flex; flex-direction:column; gap:22px}
.ghead{margin:0 0 8px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px}
.pcell{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:14px 6px 10px; background:var(--surface);
}
.pcell .big{font-size:26px; font-weight:500; line-height:1.2}
.pcell .say{font-size:12px; color:var(--muted); font-family:inherit}
.pcell.playing{border-color:var(--accent); background:var(--accent-soft)}
/* 文の組：1行ずつ左に寄せて並べる */
.grid.text{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.text .pcell{flex-direction:row; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; text-align:left}
.grid.text .pcell .big{font-size:16px; font-weight:400; line-height:1.5}
.grid.text .pcell .meter{margin-top:0; flex:none}
#pdecks{max-width:100%; min-width:0; padding:6px 8px}
.unchecked{font-size:12px; color:var(--muted); margin:-12px 0 18px}
.quiz .ask.long{font-size:30px; line-height:1.45}
.choices.text{grid-template-columns:1fr}
.choices.text button{font-size:17px; padding:13px 14px; align-items:flex-start; text-align:left}
/* 並べる */
.slots{min-height:58px; width:100%; display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  padding:12px; border:1px dashed var(--line); border-radius:8px; background:var(--surface)}
.tiles{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.tiles button, .slots button{font-size:18px; padding:9px 14px}
.slots.right{border-style:solid; border-color:var(--ok); background:var(--accent-soft)}
.slots.wrong{border-style:solid; border-color:var(--miss); background:var(--miss-soft)}
.meter{display:flex; gap:3px; margin-top:6px}
.meter i{width:6px; height:6px; border-radius:50%; background:var(--line)}
.meter i.f{background:var(--accent)}

/* 問い */
.quiz{max-width:560px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:20px; padding-top:12px}
.quiz .from{font-size:12px; color:var(--muted)}
.quiz .ask{font-size:72px; font-weight:500; line-height:1.1; min-height:80px; text-align:center}
.quiz .hear{min-width:180px; padding:14px 20px; font-size:15px}
.choices{display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%}
.choices button{padding:16px 8px; font-size:24px; display:flex; flex-direction:column; align-items:center; gap:2px}
.choices button small{font-size:11px; color:var(--muted); font-family:inherit}
.choices button.right{border-color:var(--ok); background:var(--accent-soft); color:var(--ok)}
.choices button.wrong{border-color:var(--miss); background:var(--miss-soft); color:var(--miss)}
.quiz .say{font-size:14px; color:var(--muted); font-family:inherit; min-height:22px}
.quiz .pnote{font-size:12px; color:var(--muted); text-align:center; min-height:20px}
.row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.row button{padding:11px 20px; min-width:140px}
.row button.miss{border-color:var(--miss); color:var(--miss)}
.pkeys{color:var(--muted); font-size:12px; margin-top:6px}

/* 穴埋め・書く */
span.blank{display:inline-block; min-width:3.5em; border-bottom:2px solid var(--accent); text-align:center}
span.blank.right{color:var(--ok)} span.blank.wrong{color:var(--miss); border-color:var(--miss)}
.typein{width:100%; font:inherit; font-size:22px; padding:12px 14px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); color:var(--ink)}
.typein:focus{outline:2px solid var(--accent); outline-offset:1px}
.diff{font-size:24px; line-height:2.2; text-align:center}
.diff .w{display:inline-flex; flex-direction:column; align-items:center; padding:0 6px; border-radius:6px}
.diff .w small{font-size:11px; line-height:1.3; font-family:inherit}
.diff .ok{color:var(--ok)}
.diff .near{background:var(--near-soft); color:var(--near)}
.diff .bad, .diff .miss{background:var(--miss-soft); color:var(--miss)}
.diff .extra{color:var(--muted)}
.legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:8px}
.lg{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted)}
.lg i{width:10px; height:10px; border-radius:3px; display:inline-block}
.lg i.ok{background:var(--ok)} .lg i.near{background:var(--near)} .lg i.bad{background:var(--miss)}

/* 見渡す：段は1色（緑）の濃淡。未着手は線の色 */
:root{ --lv0:var(--line); --lv1:var(--accent); --lv2:var(--teal); --near:#8a6420; --near-soft:#f6efe1 }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --near:#d9b85c; --near-soft:#2e2819 } }
:root[data-theme="dark"]{ --near:#d9b85c; --near-soft:#2e2819 }
.overview{max-width:1080px; margin:0 auto; width:100%}
.overview[hidden]{display:none}
.tiles4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:14px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 14px}
.tile .big{font-size:30px; font-weight:600; font-family:inherit; font-variant-numeric:tabular-nums}
.tile .big small{font-size:14px; color:var(--muted); font-weight:400}
.legend.ov{justify-content:flex-start; margin:0 0 12px}
.legend.ov .lg i.lv0, .wchip.lv0{background:var(--lv0)}
.lg i.lv1{background:var(--lv1)} .lg i.lv2{background:var(--lv2)}
.ovgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px}
.ovsec{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 14px}
.ovhead{display:flex; justify-content:space-between; margin-bottom:6px}
.ovhead span, .ovrow .ct{font-family:inherit; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.sbar{display:flex; gap:2px; height:10px; flex:1; min-width:40px}
.sbar i{border-radius:4px; min-width:3px}
.sbar i.lv0{background:var(--lv0)} .sbar i.lv1{background:var(--lv1)} .sbar i.lv2{background:var(--lv2)}
.ovsec > .sbar{height:14px; margin-bottom:10px}
.ovrow{display:grid; grid-template-columns:minmax(0,9em) 1fr 5.5em; align-items:center; gap:10px; width:100%;
  border:0; background:transparent; padding:4px 2px; text-align:left}
.ovrow:hover{background:var(--ground)}
.ovrow .nm{font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ovrow .ct{text-align:right}
.ovh{font-size:14px; margin:26px 0 10px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
.ovh small{font-weight:400; font-size:12px; color:var(--muted)}
.skills{display:flex; flex-direction:column; gap:8px; max-width:560px}
.skill{display:grid; grid-template-columns:7em 1fr 7.5em; gap:10px; align-items:center; font-size:13px}
.track1{height:10px; background:var(--lv0); border-radius:4px; overflow:hidden}
.track1 i{display:block; height:100%; background:var(--lv2); border-radius:4px}
.skill .ct{font-family:inherit; font-size:12px; color:var(--muted)}
.heat{display:flex; gap:3px}
.hdays{display:flex; flex-direction:column; gap:3px; margin-right:4px}
.hdays span{height:14px; font-size:10px; line-height:14px; color:var(--muted)}
.hcol{display:flex; flex-direction:column; gap:3px}
.h{width:14px; height:14px; border-radius:3px; display:inline-block}
.h0{background:var(--lv0)} .h1{background:#dde7fd} .h2{background:#b8cdfb} .h3{background:#8badf8} .h4{background:#2f6bf0}
.h.none{background:transparent}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .h1{background:#1f2a44} :root:not([data-theme="light"]) .h2{background:#2a3d6b}
  :root:not([data-theme="light"]) .h3{background:#3d5ea8} :root:not([data-theme="light"]) .h4{background:#5b8af4} }
:root[data-theme="dark"] .h1{background:#1f2a44} :root[data-theme="dark"] .h2{background:#2a3d6b} :root[data-theme="dark"] .h3{background:#3d5ea8} :root[data-theme="dark"] .h4{background:#5b8af4}
.legend.ov .h{width:10px; height:10px}
.wf{margin-bottom:10px; display:inline-flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:6px; overflow:hidden}
.wf button{border:0; border-radius:0; padding:5px 11px; font-size:12px}
.wf button + button{border-left:1px solid var(--line)}
.wmap{display:flex; flex-wrap:wrap; gap:5px}
.wchip{padding:3px 8px; font-size:13px; border:0; border-radius:5px}
.wchip.lv1{background:var(--lv1)} .wchip.lv2{background:var(--lv2); color:var(--on-accent)}
.wchip.typed{text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:2px}
.weak{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:8px}
.wk{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:9px 12px}
.wk small{color:var(--muted); font-size:11px}
@media (max-width:820px){ .tiles4{grid-template-columns:1fr 1fr} .skill{grid-template-columns:6em 1fr 6.5em} }

@media (max-width:820px){
  .practice{padding:16px 16px 32px}
  .quiz .ask{font-size:56px}
}


/* 教材 */
.blib{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; margin-bottom:22px}
.bcard{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:10px 12px}
.bcard small{color:var(--muted); font-size:11px}
.bcard.on{border-color:var(--accent); background:var(--accent-soft)}
.bhead{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:10px}
.bhead h2{font-size:20px; margin:0; font-weight:600}
.bnote, .bfoot{font-size:12px; color:var(--muted)}
.bfoot{margin:10px 0 0}
.btable{background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden}
.brow{display:grid; grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr)); gap:10px; padding:8px 14px; font-size:13px;
  font-variant-numeric:tabular-nums}
.brow + .brow{border-top:1px solid var(--hair)}
.brow.bth{color:var(--muted); font-size:11px}
.brow .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bpaper{margin-bottom:12px}
.pex{display:grid; grid-template-columns:minmax(0,10em) 1fr; gap:10px; align-items:center; padding:4px 0}
.pex .nm{font-size:13px}
.pcells{display:flex; flex-wrap:wrap; gap:4px}
.pc{width:38px; height:38px; padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:16px; line-height:1}
.pc small{font-size:9px; color:var(--muted); font-family:inherit}
.pc.ro{border-color:var(--ok); background:var(--accent-soft); color:var(--ok)}
.pc.rs{border-color:var(--near); background:var(--near-soft); color:var(--near)}
.pc.rx{border-color:var(--miss); background:var(--miss-soft); color:var(--miss)}
.addex{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.addex input{font:inherit; font-size:12px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink)}
.addex input[name=label]{flex:1; min-width:10em}
.addex input[name=count]{width:5em}
.addex button{font-size:12px; padding:5px 10px}
.bsec .ovh{margin-top:18px}
.gram{border:1px solid var(--line); border-radius:8px; background:var(--surface); margin-bottom:6px; overflow:hidden}
.gt{display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; border:0; border-radius:0; text-align:left; padding:10px 12px; background:transparent}
.gt span{font-size:12px; color:var(--muted)}
.gram.open{border-color:var(--accent)}
.gex{display:flex; flex-direction:column; gap:4px; padding:0 12px 12px}
.gs{text-align:left; font-size:14px; padding:6px 10px}
.bfilter{font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); width:100%; max-width:320px; margin-bottom:6px}
.vgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:6px}
.vw{display:flex; flex-direction:column; align-items:flex-start; gap:1px; text-align:left; padding:7px 10px}
.vw b{font-weight:500; font-size:14px}
.vw i{font-style:normal; font-size:12px; color:var(--muted)}
.vw span{font-size:12px; color:var(--muted)}
.vw em{font-style:normal; font-size:10px; color:var(--accent)}
.bport{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-top:32px; padding:12px 14px; border:1px dashed var(--line); border-radius:8px; font-size:12px}
.bport span{color:var(--muted); flex:1 1 18em}
@media (max-width:820px){ .brow{grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr)); gap:6px; padding:8px 10px; font-size:12px}
  .pex{grid-template-columns:1fr} }

/* ================= デザインシステムに合わせる（2026-10-01） ================= */
/* 本人（2026-10-01）「緑の色と背景のグレーが気に入らなくなってきた」「マインドマップや韓国の YouTube を取り込むやつの色感」
   「カードの左に口をつけるやつはやめる」。
   ⭕ 線で区切らない。カードは白＋薄く広い影＋角丸。ボタンは丸いつまみ。切り替えの選んだ側は黒。
   ⛔ 左の縦の帯（border-left で状態を出す）は使わない。状態は面の色で出す。 */
.eyebrow{font-size:11px; font-weight:500; letter-spacing:.02em; text-transform:none; color:var(--ink3)}
header{background:var(--ground); border-bottom:0; padding:14px 24px 10px}
.wordmark b{letter-spacing:0}
.folder .name{color:var(--muted)}
.bignum{letter-spacing:-.03em}

button{border:0; border-radius:999px; background:var(--surface); box-shadow:var(--sh-btn); padding:7px 14px; transition:background .12s, color .12s, box-shadow .12s}
button:hover{border-color:transparent; background:var(--subtle)}
button.primary{background:var(--accent); color:var(--on-accent); box-shadow:none}
button.primary:hover{background:var(--accent); filter:brightness(1.06)}
button.on{background:var(--ink); color:var(--surface); font-weight:500}
button.fold, button.fold:hover{box-shadow:none; background:transparent}
button:disabled{opacity:.5; cursor:default}

/* 切り替え：白い台の中に丸いつまみ。選んだ側は黒 */
.modes, .pbar .seg, .wf, .speeds{border:0; background:var(--surface); box-shadow:var(--sh-btn); border-radius:999px; padding:3px; gap:2px; overflow:visible}
.modes button, .pbar .seg button, .wf button, .speeds button{border:0; border-radius:999px; box-shadow:none; background:transparent; color:var(--muted); padding:5px 13px; font-size:12px; font-weight:500}
.modes button + button, .pbar .seg button + button, .wf button + button{border-left:0}
.speeds button, .speeds button:last-child{border-right:0}
.modes button:hover, .pbar .seg button:hover, .wf button:hover, .speeds button:hover{background:var(--subtle); color:var(--ink)}
.modes button.on, .pbar .seg button.on, .wf button.on, .speeds button.on{background:var(--ink); color:var(--surface)}

select, .ledger-head input, .typein, .addex input, .bfilter{border:0; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); border-radius:var(--r-in)}
.ledger-head input{background:var(--subtle); box-shadow:none}
kbd{border:0; background:var(--subtle); box-shadow:inset 0 0 0 1px var(--line)}

/* 聴く */
main{gap:16px; padding:0 16px 16px}
.panel{background:transparent}
aside{background:var(--surface); border-left:0; border-radius:var(--r-card); box-shadow:var(--shadow); overflow:hidden}
@media (max-width:820px){ aside{border-top:0} main{gap:10px; padding:0 10px 10px} }
.app.list-off aside{border-top:0}
.ledger-head{border-bottom:0}
li{border-bottom:0; border-left:0; padding:8px 14px; margin:0 6px; border-radius:var(--r-in)}
li:hover{background:var(--subtle)}
li.current{background:var(--accent-soft); border-left:0}
li .done{color:var(--teal)}
.keys{border-top:0}
.script{border-top:0}
.sent{border-left:0; border-radius:var(--r-in)}
.sent:hover{background:var(--surface)}
.sent.now{background:var(--accent-soft)}
.note{border-left:0; background:var(--surface); border-radius:var(--r-sm); padding:6px 10px; margin:2px 0 8px 10px}
.dock{border-top:0; box-shadow:0 -1px 2px rgba(20,24,32,.02), 0 -14px 38px rgba(20,24,32,.055)}
.transport button{min-height:40px}
.lookup{border:0; border-radius:var(--r-card); box-shadow:var(--sh-lift)}
.han .cell{border:0; background:var(--subtle); border-radius:var(--r-sm)}
.from{border-top:0; background:var(--subtle); border-radius:var(--r-sm); padding:8px 10px}
.gloss .src{text-transform:none; letter-spacing:.02em; font-size:11px; color:var(--ink3)}
#drop{border:2px dashed var(--accent)}

/* 練習・見渡す・教材：カードは白＋影＋角丸。線は引かない */
.pcell, .tile, .ovsec, .btable, .gram, .bcard, .wk, .vw, .slots{border:0; border-radius:var(--r-card); box-shadow:var(--shadow); background:var(--surface)}
.pcell, .wk, .vw, .bcard{border-radius:var(--r-in)}
.pcell:hover, .wk:hover, .vw:hover, .bcard:hover{background:var(--subtle)}
.pcell.playing{background:var(--accent-soft); border-color:transparent}
.slots{border:0; box-shadow:inset 0 0 0 1.5px var(--line)}
.slots.right{box-shadow:none; background:var(--ok-soft)}
.slots.wrong{box-shadow:none; background:var(--miss-soft)}
.choices button{border-radius:var(--r-in)}
.choices button.right{background:var(--ok-soft); color:var(--ok); border-color:transparent}
.choices button.wrong{background:var(--miss-soft); color:var(--miss); border-color:transparent}
.row button.miss{color:var(--miss); background:var(--miss-soft); box-shadow:none}
.meter i.f{background:var(--teal)}
.ovrow{box-shadow:none; border-radius:var(--r-sm)}
.ovrow:hover{background:var(--subtle)}
.wchip{box-shadow:none; border-radius:999px; padding:3px 10px; background:var(--subtle); color:var(--muted)}
.wchip.lv1{background:var(--accent-soft); color:var(--accent)}
.wchip.lv2{background:var(--ok-soft); color:var(--ok)}
.brow + .brow{border-top:0}
.brow:nth-child(even){background:var(--subtle)}
.bcard.on{background:var(--ink); color:var(--surface)}
.bcard.on small{color:var(--ink3)}
.gram{overflow:hidden}
.gram.open{box-shadow:var(--sh-lift)}
.gt, .gt:hover{box-shadow:none; border-radius:0; background:transparent}
.gs{box-shadow:none; background:var(--subtle); border-radius:var(--r-sm)}
.gs:hover{background:var(--accent-soft)}
/* 語彙：覚えた具合は左の帯ではなく、右上の小さな点で出す */
.vw{border-left:0; position:relative; padding:9px 26px 9px 12px}
.vw::after{content:""; position:absolute; top:12px; right:12px; width:7px; height:7px; border-radius:50%; background:var(--lv0)}
.vw.lv1::after{background:var(--accent)} .vw.lv2::after{background:var(--teal)}
.pc{border-radius:var(--r-sm); box-shadow:inset 0 0 0 1px var(--line); background:var(--surface)}
.pc.ro{box-shadow:none; background:var(--ok-soft); color:var(--ok)}
.pc.rs{box-shadow:none; background:var(--near-soft); color:var(--near)}
.pc.rx{box-shadow:none; background:var(--miss-soft); color:var(--miss)}
.bport{border:0; background:var(--surface); box-shadow:var(--shadow); border-radius:var(--r-card)}
.unchecked{color:var(--near)}
.lg i.ok{background:var(--teal)}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="wordmark">
      <b>音声ドリル</b>
      <span class="eyebrow">folder player</span>
    </div>
    <div class="modes" id="modes" hidden>
      <button data-mode="book">教材</button>
      <button data-mode="listen" class="on">聴く</button>
      <button data-mode="practice">練習</button>
      <button data-mode="overview">見渡す</button>
    </div>
    <button class="primary" id="pick">フォルダを選ぶ</button>
    <button id="reopen" hidden></button>
    <input type="file" id="picker" webkitdirectory directory multiple hidden>
    <div class="folder">
      <button id="toggleList" aria-controls="list" aria-expanded="true"><span class="caret">▼</span><span class="lbl">一覧を隠す</span></button>
      <button id="export" hidden>貯めた語を書き出す</button>
      <span class="name" id="folder">未読み込み</span>
    </div>
  </header>

  <main>
    <section class="panel">
      <div>
        <div class="readout">
          <div class="bignum" id="bignum">—</div>
          <div class="oftotal" id="oftotal"></div>
        </div>
        <div class="fname blank" id="fname">フォルダを選ぶと、中の音声が番号順に並びます</div>
      </div>

      <div class="setting">
        <span class="eyebrow">速度</span>
        <div class="speeds" id="speeds"></div>
        <span class="rate-now" id="rateNow"></span>
      </div>

      <div class="setting">
        <span class="eyebrow">ドリル</span>
        <label class="opt">1本を
          <select id="repeatN" aria-label="1本あたりの再生回数">
            <option value="1">1回</option>
            <option value="2">2回</option>
            <option value="3">3回</option>
            <option value="5">5回</option>
            <option value="0">ずっと</option>
          </select>
        </label>
        <label class="opt">次まで
          <select id="gap" aria-label="次のトラックまでの間">
            <option value="0">間をあけない</option>
            <option value="1">1秒あける</option>
            <option value="2">2秒あける</option>
            <option value="3">3秒あける</option>
            <option value="5">5秒あける</option>
          </select>
        </label>
        <label class="opt"><input type="checkbox" id="loopAll"> 最後まで行ったら最初へ</label>
      </div>

      <div class="script" id="script" hidden></div>

      <div class="keys">
        <span><kbd>space</kbd>再生／停止</span>
        <span><kbd>←</kbd><kbd>→</kbd>5秒</span>
        <span><kbd>⇧←</kbd><kbd>⇧→</kbd>前後の本</span>
        <span><kbd>↑</kbd><kbd>↓</kbd>速度</span>
        <span><kbd>0</kbd>速度を1.0に</span>
        <span><kbd>R</kbd>頭から</span>
      </div>
    </section>

    <aside>
      <div class="ledger-head">
        <button class="fold" id="foldList" aria-controls="list" aria-expanded="true"><span class="caret">▼</span><span class="lbl">一覧を隠す</span></button>
        <input id="filter" placeholder="番号や名前でしぼる" autocomplete="off" aria-label="一覧をしぼる">
        <span class="tally" id="tally"></span>
      </div>
      <ol id="list"></ol>
      <div class="ledger-empty" id="ledgerEmpty">
        まだ何も読み込まれていません。<br>
        「フォルダを選ぶ」を押すか、Finderからフォルダをこの画面に落としてください。
      </div>
    </aside>
  </main>

  <!-- 画面の下に出したままにする操作卓 -->
  <div class="dock" id="dock">
    <div class="track">
      <span class="clock" id="cur">0:00</span>
      <input type="range" id="seek" value="0" min="0" max="1000" step="1" disabled aria-label="再生位置">
      <span class="clock right" id="dur">0:00</span>
      <div class="rate-nudge">
        <button id="rateDown" aria-label="速度を下げる">−</button>
        <span class="rate-dock" id="rateDock" aria-live="off">1×</span>
        <button id="rateUp" aria-label="速度を上げる">＋</button>
      </div>
    </div>

    <div class="dock-row">
      <div class="now"><span class="n" id="nowN"></span><span class="nm" id="nowName"></span></div>
      <div class="transport">
        <button id="prev">⟵ 前</button>
        <button id="back" class="mono">− 5秒</button>
        <button class="primary" id="play">再生</button>
        <button id="fwd" class="mono">＋ 5秒</button>
        <button id="next">次 ⟶</button>
      </div>
      <div class="spacer"></div>
    </div>
  </div>

  <section class="practice" id="practice" hidden>
    <div class="pbar">
      <select id="pdecks" aria-label="練習する組"></select>
      <div class="seg" id="pviews">
        <button data-v="table">表</button>
        <button data-v="hear">聞いて選ぶ</button>
        <button data-v="order">並べる</button>
        <button data-v="cloze">穴埋め</button>
        <button data-v="type">聞いて書く</button>
        <button data-v="say">見て言う</button>
      </div>
      <span class="stat" id="pstat"></span>
    </div>
    <div id="pbody"></div>
  </section>

  <section class="practice overview" id="overview" hidden></section>

  <section class="practice overview book" id="book" hidden></section>
</div>

<div class="lookup" id="lookup" hidden></div>

<div id="drop">フォルダをここに落とす</div>

<script>
(function(){
'use strict';

const $ = s => document.querySelector(s);
const AUDIO_RE = /\.(mp3|m4a|m4b|aac|wav|aiff?|ogg|oga|opus|flac|webm|mp4)$/i;
const RATES = [0.5,0.75,0.8,0.9,1,1.1,1.25,1.5,2];

const audio = new Audio();
audio.preload = 'auto';
['preservesPitch','mozPreservesPitch','webkitPreservesPitch'].forEach(k=>{ try{ audio[k]=true; }catch(e){} });

let tracks = [];
let idx = -1;
let url = null;
let folderKey = '';
let done = new Set();
let playsLeft = 1;
let gapTimer = null;
let lastSave = 0;
let rate = 1;
let mode = 'listen';   // listen ／ practice ／ overview ／ book
let afiles = {};       // 音声のファイル名 → File（教材の面から区間を鳴らすため）
let lastHandle = null; // いま開いているフォルダの手掛かり（教材ごとに覚え直す）
let pendingHandle = null;

/* ---------- 保存（使えない環境でも動く） ---------- */
function load(key, fallback){
  try{ const v = localStorage.getItem('otodrill:'+key); return v===null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function save(key, val){
  try{ localStorage.setItem('otodrill:'+key, JSON.stringify(val)); }catch(e){}
}

/* ---------- 表示 ---------- */
function fmt(s){
  if(!isFinite(s) || s<0) s = 0;
  const m = Math.floor(s/60), r = Math.floor(s%60);
  return m + ':' + String(r).padStart(2,'0');
}
function label(r){ return r.toFixed(2).replace(/0$/,'').replace(/\.$/,'') + '×'; }

function renderList(){
  const ol = $('#list');
  ol.innerHTML = '';
  tracks.forEach((t,i)=>{
    const li = document.createElement('li');
    li.dataset.i = i;
    li.innerHTML = '<span class="n"></span><span class="nm"></span><span class="done"></span>';
    li.querySelector('.n').textContent = String(i+1).padStart(String(tracks.length).length,'0');
    li.querySelector('.nm').textContent = t.name;
    li.addEventListener('click', ()=> play(i, true));
    ol.appendChild(li);
  });
  $('#ledgerEmpty').style.display = 'none';
  paintList();
  applyFilter();
}

function paintList(){
  const items = $('#list').children;
  for(let i=0;i<items.length;i++){
    items[i].classList.toggle('current', i===idx);
    items[i].querySelector('.done').textContent = done.has(tracks[i].name) ? '✓' : '';
  }
  const shown = tracks.filter(t => done.has(t.name)).length;
  $('#tally').textContent = tracks.length ? (shown + '/' + tracks.length) : '';
}

function applyFilter(){
  const q = $('#filter').value.trim().toLowerCase();
  const items = $('#list').children;
  for(let i=0;i<items.length;i++){
    items[i].classList.toggle('hidden', !!q && !tracks[i].name.toLowerCase().includes(q));
  }
}

function scrollToCurrent(){
  const el = $('#list').children[idx];
  if(el) el.scrollIntoView({block:'nearest'});
}

/* ---------- 読み込み ---------- */
function loadFiles(files){
  const list = files.filter(f => AUDIO_RE.test(f.name) && !f.name.startsWith('.'));
  if(!list.length){
    $('#fname').textContent = '音声ファイルが見つかりませんでした。mp3・m4a・wav などが入ったフォルダを選んでください。';
    $('#fname').classList.add('blank');
    return;
  }

  list.forEach(f => { f._rel = f._rel || f.webkitRelativePath || f.name; });
  list.sort((a,b)=> a._rel.localeCompare(b._rel, 'ja', {numeric:true, sensitivity:'base'}));

  tracks = list.map(f => ({file:f, name:f.name, rel:f._rel}));
  afiles = {}; list.forEach(f => { afiles[f.name] = f; });
  const first = tracks[0].rel;
  folderKey = first.includes('/') ? first.split('/')[0] : 'files';

  $('#folder').textContent = folderKey + ' · ' + tracks.length + '本';
  done = new Set(load('done:'+folderKey, []));
  renderList();
  // 開いたフォルダの手掛かり（ファイル選び・落とした場合は無いことがある）
  lastHandle = pendingHandle; pendingHandle = null;
  // ⛔ folderKey と tracks が決まってから読む（付属ファイルが無いと待たずに走り、前のフォルダの値で教材を登録してしまう）
  loadSidecars(files);

  const last = load('last:'+folderKey, null);
  let start = 0, at = 0;
  if(last){
    const i = tracks.findIndex(t => t.name === last.name);
    if(i >= 0){ start = i; at = last.time || 0; }
  }
  play(start, false, at);
}

async function filesFromDrop(dt){
  const entries = [...dt.items].map(it => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
  if(!entries.length) return [...dt.files];
  const out = [];
  async function walk(entry, prefix){
    if(entry.isFile){
      const f = await new Promise((res,rej)=> entry.file(res, rej));
      f._rel = prefix + entry.name;
      out.push(f);
    }else if(entry.isDirectory){
      const reader = entry.createReader();
      let batch;
      do{
        batch = await new Promise((res,rej)=> reader.readEntries(res, rej));
        for(const e of batch) await walk(e, prefix + entry.name + '/');
      }while(batch.length);
    }
  }
  for(const e of entries) await walk(e, '');
  return out;
}

/* ---------- 再生 ---------- */
function play(i, autoplay, seekTo){
  if(i < 0 || i >= tracks.length) return;
  clearTimeout(gapTimer);
  if(url) URL.revokeObjectURL(url);
  idx = i;
  url = URL.createObjectURL(tracks[i].file);
  audio.src = url;
  audio.playbackRate = rate;
  playsLeft = Number($('#repeatN').value) || 0;

  const width = String(tracks.length).length;
  $('#bignum').textContent = String(i+1).padStart(width,'0');
  $('#oftotal').textContent = '/ ' + tracks.length + '　残り ' + (tracks.length-i-1) + '本';
  $('#fname').textContent = tracks[i].name;
  $('#fname').classList.remove('blank');
  $('#nowN').textContent = String(i+1).padStart(width,'0') + '/' + tracks.length;
  $('#nowName').textContent = tracks[i].name;
  $('#seek').disabled = false;
  renderScript(tracks[i].name);
  paintList();
  scrollToCurrent();

  if(seekTo){
    audio.addEventListener('loadedmetadata', ()=>{ audio.currentTime = seekTo; }, {once:true});
  }
  if(autoplay) audio.play().catch(()=>{});
  saveLast();
}

function setRate(r){
  rate = Math.min(3, Math.max(0.25, Math.round(r*100)/100));
  save('rate', rate);
  audio.playbackRate = rate;
  $('#rateNow').textContent = 'いま ' + label(rate);
  $('#rateDock').textContent = label(rate);
  [...$('#speeds').children].forEach(b => b.classList.toggle('on', Number(b.dataset.r) === rate));
}

function toggle(){
  if(idx < 0) return;
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
}

function step(sec){
  if(idx>=0) audio.currentTime = Math.max(0, Math.min(audio.duration||0, audio.currentTime + sec));
}

function goNext(byHand){
  clearTimeout(gapTimer);
  if(idx + 1 < tracks.length) play(idx+1, true);
  else if($('#loopAll').checked && !byHand) play(0, true);
  else $('#play').textContent = '再生';
}

let importing = false;   // 記録を読み込んで読み直すあいだは、聴いた位置を書かない（読み込んだ値を上書きするため）
function saveLast(){
  if(idx < 0 || importing) return;
  save('last:'+folderKey, {name: tracks[idx].name, time: audio.currentTime||0});
}

/* ---------- イベント ---------- */
audio.addEventListener('play',  ()=> $('#play').textContent = '一時停止');
audio.addEventListener('pause', ()=> $('#play').textContent = '再生');
audio.addEventListener('loadedmetadata', ()=> $('#dur').textContent = fmt(audio.duration));

audio.addEventListener('timeupdate', ()=>{
  $('#cur').textContent = fmt(audio.currentTime);
  syncScript(audio.currentTime);
  if(audio.duration) $('#seek').value = Math.round(audio.currentTime / audio.duration * 1000);
  const now = Date.now();
  if(now - lastSave > 3000){ lastSave = now; saveLast(); }
});

audio.addEventListener('ended', ()=>{
  if(idx >= 0 && !done.has(tracks[idx].name)){
    done.add(tracks[idx].name);
    save('done:'+folderKey, [...done]);
    paintList();
  }
  const n = Number($('#repeatN').value);
  const g = Number($('#gap').value) * 1000;
  if(n === 0 || playsLeft > 1){
    if(n !== 0) playsLeft--;
    gapTimer = setTimeout(()=>{ audio.currentTime = 0; audio.play().catch(()=>{}); }, g);
    return;
  }
  gapTimer = setTimeout(()=> goNext(false), g);
});

/* ---------- 前に開いたフォルダを覚える ---------- */
/* 音声そのものは持たない（大きすぎる）。フォルダへの手掛かりだけ IndexedDB に置く。
   ⛔ 手掛かりを保存できるのは showDirectoryPicker のある環境だけ（Chrome・Edge）。
   Safari・Firefox・ダブルクリックで開いた場合は、これまで通り毎回選ぶ。 */
function idb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('otodrill', 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('handles');
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function putDir(h, key){
  try{
    const db = await idb();
    await new Promise((res,rej)=>{
      const t = db.transaction('handles','readwrite');
      t.objectStore('handles').put(h, key || 'last');
      t.oncomplete = res; t.onerror = ()=> rej(t.error);
    });
  }catch(e){}
}
async function getDir(key){
  try{
    const db = await idb();
    return await new Promise((res,rej)=>{
      const t = db.transaction('handles','readonly');
      const q = t.objectStore('handles').get(key || 'last');
      q.onsuccess = ()=> res(q.result || null);
      q.onerror = ()=> rej(q.error);
    });
  }catch(e){ return null; }
}

/* webkitRelativePath と同じ形（フォルダ名/ファイル名）にそろえる。
   folderKey がこれで決まり、聴き終わった本・最後の位置・貯めた語の置き場になる。 */
async function filesFromDir(dir, prefix){
  const out = [];
  for await (const [name, h] of dir.entries()){
    if(h.kind === 'file'){
      const f = await h.getFile();
      f._rel = prefix + name;
      out.push(f);
    }else if(h.kind === 'directory'){
      out.push(...await filesFromDir(h, prefix + name + '/'));
    }
  }
  return out;
}

async function openDir(h, remember){
  pendingHandle = h;
  const files = await filesFromDir(h, h.name + '/');
  if(remember) await putDir(h);
  $('#reopen').hidden = true;
  loadFiles(files);
}

$('#pick').addEventListener('click', async ()=>{
  if(window.showDirectoryPicker){
    let h = null;
    try{ h = await showDirectoryPicker({id:'otodrill', mode:'read'}); }
    catch(e){ if(e && e.name === 'AbortError') return; }
    if(h){ await openDir(h, true); return; }
  }
  $('#picker').click();
});
$('#picker').addEventListener('change', e => loadFiles([...e.target.files]));

/* 立ち上げ直したとき：許可が残っていればそのまま開く。
   残っていなければ、1回押すだけで戻せるボタンを出す（ブラウザが許可を聞くため）。 */
(async function(){
  const h = await getDir();
  if(!h || !h.queryPermission) return;
  const b = $('#reopen');
  b.textContent = '前の ' + h.name + ' を出す';
  b.hidden = false;
  b.addEventListener('click', async ()=>{
    try{
      if(await h.requestPermission({mode:'read'}) !== 'granted') return;
      await openDir(h, false);
    }catch(e){
      b.textContent = '前のフォルダを出せませんでした。選び直してください';
    }
  });
  try{
    if(await h.queryPermission({mode:'read'}) === 'granted') await openDir(h, false);
  }catch(e){}
})();

$('#play').addEventListener('click', e => { toggle(); e.currentTarget.blur(); });
$('#prev').addEventListener('click', e => { play(idx-1, true); e.currentTarget.blur(); });
$('#next').addEventListener('click', e => { goNext(true); e.currentTarget.blur(); });
$('#back').addEventListener('click', e => { step(-5); e.currentTarget.blur(); });
$('#fwd').addEventListener('click',  e => { step(5);  e.currentTarget.blur(); });
$('#rateDown').addEventListener('click', e => { setRate(rate - 0.1); e.currentTarget.blur(); });
$('#rateUp').addEventListener('click',   e => { setRate(rate + 0.1); e.currentTarget.blur(); });

$('#seek').addEventListener('input', e => {
  if(audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration;
});

/* ---------- 一覧の開け閉め ---------- */
/* 一覧が画面の幅を取るのが困る、というところから。閉じても、いま何本目かは下の操作卓に出ている。 */
/* 開け閉めのボタンは2つある。広いときはヘッダー（列ごと消えるので一覧側に置けない）、
   狭いときは一覧の頭（下にたたむので、そこに手掛かりを残す）。状態はひとつ。 */
function paintListToggle(){
  const off = document.querySelector('.app').classList.contains('list-off');
  ['#toggleList','#foldList'].forEach(sel=>{
    $(sel).querySelector('.lbl').textContent = off ? '一覧を出す' : '一覧を隠す';
    $(sel).setAttribute('aria-expanded', String(!off));
  });
}
if(load('listOff', false)) document.querySelector('.app').classList.add('list-off');
paintListToggle();

['#toggleList','#foldList'].forEach(sel=>{
  $(sel).addEventListener('click', e => {
    const off = document.querySelector('.app').classList.toggle('list-off');
    save('listOff', off);
    paintListToggle();
    if(!off) scrollToCurrent();   // 開いたら、いま鳴っている本まで戻す
    e.currentTarget.blur();
  });
});

$('#filter').addEventListener('input', applyFilter);

['repeatN','gap','loopAll'].forEach(id=>{
  const el = $('#'+id);
  const key = 'opt:'+id;
  const saved = load(key, null);
  if(saved !== null){ if(el.type === 'checkbox') el.checked = saved; else el.value = saved; }
  el.addEventListener('change', ()=>{
    save(key, el.type === 'checkbox' ? el.checked : el.value);
    if(id === 'repeatN') playsLeft = Number(el.value) || 0;
  });
});

RATES.forEach(r=>{
  const b = document.createElement('button');
  b.dataset.r = r;
  b.textContent = label(r);
  b.addEventListener('click', e => { setRate(r); e.currentTarget.blur(); });
  $('#speeds').appendChild(b);
});
setRate(load('rate', 1));

document.addEventListener('keydown', e=>{
  if(e.target === $('#filter')) return;
  if(mode !== 'listen') return;   // 練習と見渡すのキーは、その側で受ける
  const k = e.key;
  if(k === ' '){ e.preventDefault(); toggle(); }
  else if(k === 'ArrowLeft'){  e.preventDefault(); e.shiftKey ? play(idx-1, true) : step(-5); }
  else if(k === 'ArrowRight'){ e.preventDefault(); e.shiftKey ? goNext(true)      : step(5); }
  else if(k === 'ArrowUp'){    e.preventDefault(); setRate(rate + 0.1); }
  else if(k === 'ArrowDown'){  e.preventDefault(); setRate(rate - 0.1); }
  else if(k === '0'){ setRate(1); }
  else if(k === 'r' || k === 'R'){ audio.currentTime = 0; audio.play().catch(()=>{}); }
});

let dragDepth = 0;
window.addEventListener('dragenter', e=>{ e.preventDefault(); dragDepth++; $('#drop').classList.add('show'); });
window.addEventListener('dragover',  e=> e.preventDefault());
window.addEventListener('dragleave', ()=>{ if(--dragDepth <= 0) $('#drop').classList.remove('show'); });
window.addEventListener('drop', async e=>{
  e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('show');
  // ⛔ dataTransfer は await をまたぐと空になる。手掛かりの要求は待つ前に出しておく。
  const handles = [...e.dataTransfer.items]
    .map(it => it.getAsFileSystemHandle ? it.getAsFileSystemHandle().catch(()=>null) : null)
    .filter(Boolean);
  const files = await filesFromDrop(e.dataTransfer);
  // 落とした先がフォルダなら、次も出せるように覚えておく（教材の手掛かりにもなるので、読み込む前に取る）
  let dirH = null;
  for(const p of handles){ const h = await p; if(h && h.kind === 'directory'){ dirH = h; break; } }
  pendingHandle = dirH;
  loadFiles(files);
  if(dirH){ await putDir(dirH); $('#reopen').hidden = true; }
});

/* ================= 読む ================= */
/* 音声と同じフォルダに置いた transcript.json / lexicon.json / notes.json を読む。
   ⛔ どれもこの端末の中だけ。公開しているのはこのプログラムだけで、教材の文は上がらない。 */

let script = null;    // { "001.mp3": {lang, segments:[{start,end,text,words}]} }
let lex = {morphemes:{}, words:{}};
let notes = {};       // 文（正規化した本文）→ 文法メモ
let kept = [];        // 貯めた語
let sentEls = [];     // いま出している文の要素
let nowSent = -1;

const norm = t => t.normalize('NFC').trim().toLowerCase().replace(/[.,!?;:"'()\[\]…—–]/g,'').replace(/\s+/g,' ');

async function loadSidecars(files){
  const pick = n => files.find(f => f.name.toLowerCase() === n);
  const read = async f => { try{ return JSON.parse(await f.text()); }catch(e){ return null; } };
  script = null; lex = {morphemes:{}, words:{}}; notes = {};
  const t = pick('transcript.json'), l = pick('lexicon.json'), n = pick('notes.json');
  if(t) script = await read(t);
  if(l){ const d = await read(l); if(d) lex = {morphemes:d.morphemes||{}, words:d.words||{}}; }
  if(n) notes = await read(n) || {};
  const p = pick('practice.json');
  const bk = pick('book.json');
  setPractice(p ? await read(p) : null, files);
  kept = load('kept:'+folderKey, []);
  setBook(bk ? await read(bk) : null);
  paintExport();
  if(idx >= 0 && tracks[idx]) renderScript(tracks[idx].name);
}

function renderScript(name){
  const box = $('#script');
  sentEls = []; nowSent = -1;
  if(!script){ box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  const data = script[name];
  if(!data || !data.segments.length){
    box.innerHTML = '<div class="script-empty">この音声の本文はありません。</div>';
    return;
  }
  box.innerHTML = '';
  data.segments.forEach((seg, si) => {
    const el = document.createElement('div');
    el.className = 'sent';
    const t = document.createElement('span');
    t.className = 't'; t.textContent = fmt(seg.start);
    el.appendChild(t);
    let wi = 0;
    tokenize(seg.text).forEach(tok => {
      if(/[\p{L}]/u.test(tok)){
        const at = wi++;
        const w = document.createElement('span');
        w.className = 'w'; w.textContent = tok;
        w.addEventListener('click', ev => { ev.stopPropagation(); lookup(tok, at, seg, name); });
        el.appendChild(w);
      }else{
        el.appendChild(document.createTextNode(tok));
      }
    });
    el.addEventListener('click', ()=>{ audio.currentTime = seg.start; audio.play().catch(()=>{}); });
    box.appendChild(el);
    sentEls.push({el, start:seg.start, end:seg.end});
    notesFor(seg.text).forEach(n => {
      const nd = document.createElement('div');
      nd.className = 'note';
      if(n.title){
        const b = document.createElement('b');
        b.textContent = n.title + '　';
        nd.appendChild(b);
      }
      nd.appendChild(document.createTextNode(n.body));
      box.appendChild(nd);
    });
  });
}

/* 文法メモ。1文ずつ書くのではなく「型」を書いて文に当てる。
   （同じ型の練習が何十回も出るので、型で書くほうが行き渡る）
   古い形式（文 → メモ の平たい辞書）もそのまま読める。 */
function matchable(text){
  return ' ' + text.normalize('NFC').toLowerCase().replace(/[,;:"'()\[\]…—–]/g,'').replace(/\s+/g,' ').trim() + ' ';
}

function notesFor(text){
  const out = [];
  const flat = !notes.patterns && !notes.sentences;
  const one = flat ? notes[norm(text)] : (notes.sentences || {})[norm(text)];
  if(one) out.push({title:'この文', body:one});
  if(!flat){
    const t = matchable(text);
    // p.not がある型は、その語を含む文では出さない
    // （例：có phải là の文に「phải＝しなければならない」を出さない）
    (notes.patterns || []).forEach(p => {
      if(t.includes(p.match) && !(p.not && t.includes(p.not))) out.push(p);
    });
  }
  return out.slice(0, 3);
}

function tokenize(text){
  return text.split(/(\s+|[.,!?;:"'()\[\]…—–]+)/).filter(Boolean);
}

function syncScript(t){
  if(!sentEls.length) return;
  let hit = -1;
  for(let i=0;i<sentEls.length;i++){
    if(t >= sentEls[i].start && t < sentEls[i].end){ hit = i; break; }
  }
  if(hit === nowSent) return;
  if(nowSent >= 0) sentEls[nowSent].el.classList.remove('now');
  nowSent = hit;
  if(hit >= 0){
    sentEls[hit].el.classList.add('now');
    sentEls[hit].el.scrollIntoView({block:'nearest'});
  }
}

/* ---- 語を引く ---- */
/* ベトナム語は「học sinh」のように音節が組み合わさるので、長いほうから当てる。 */
function bestForm(sentence, at, token){
  const syl = sentence.text.split(/\s+/).map(w => w.replace(/[.,!?;:"'()\[\]…—–]/g,''));
  if(at < 0 || at >= syl.length || syl[at].toLowerCase() !== token.toLowerCase()){
    // 位置が合わないときだけ本文から探す（記号の入り方が想定外だった場合の保険）
    at = syl.findIndex(w => w.toLowerCase() === token.toLowerCase());
  }
  if(at < 0) return {form: token, hit: lex.words[norm(token)] || null};
  for(let n = Math.min(4, syl.length - at); n >= 1; n--){
    const form = syl.slice(at, at+n).join(' ');
    const hit = lex.words[norm(form)];
    if(hit) return {form, hit};
  }
  return {form: token, hit: null};
}

async function lookup(token, at, seg, file){
  const box = $('#lookup');
  const {form, hit} = bestForm(seg, at, token);
  const syls = form.split(/\s+/);

  const han = syls.map(sy => ({sy, m: lex.morphemes[norm(sy)]})).filter(x => x.m);
  box.hidden = false;
  box.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = '<span class="word"></span><button class="close">閉じる</button>';
  head.querySelector('.word').textContent = form;
  head.querySelector('.close').addEventListener('click', ()=> box.hidden = true);
  box.appendChild(head);

  if(han.length){
    const h = document.createElement('div');
    h.className = 'han';
    han.forEach(({sy, m})=>{
      const c = document.createElement('div');
      c.className = 'cell';
      c.innerHTML = '<span class="kanji"></span><span class="yomi"></span>';
      c.querySelector('.kanji').textContent = m.kanji || '？';
      c.querySelector('.yomi').textContent = sy + '　' + [m.on, m.ko].filter(Boolean).join(' ');
      h.appendChild(c);
    });
    box.appendChild(h);
  }

  if(hit && hit.ja){
    const g = document.createElement('div');
    g.className = 'gloss';
    g.innerHTML = '<span class="src">手元の台帳</span>';
    g.appendChild(document.createTextNode(hit.ja));
    box.appendChild(g);
  }

  const wk = document.createElement('div');
  wk.className = 'gloss';
  wk.innerHTML = '<span class="src">Wiktionary</span>';
  const wkBody = document.createElement('span');
  wkBody.textContent = '引いています…';
  wk.appendChild(wkBody);
  box.appendChild(wk);

  const from = document.createElement('div');
  from.className = 'from';
  from.innerHTML = '<b></b><br><span class="meta"></span>';
  from.querySelector('b').textContent = seg.text;
  from.querySelector('.meta').textContent = file + '　' + fmt(seg.start);
  box.appendChild(from);

  const keep = document.createElement('button');
  keep.className = 'keep';
  const already = kept.some(k => k.form === form && k.sentence === seg.text);
  keep.textContent = already ? '貯めてある' : 'この文ごと貯める';
  keep.disabled = already;
  keep.addEventListener('click', ()=>{
    kept.push({form, ja: (hit && hit.ja) || '', kanji: han.map(x => x.m.kanji).join(''),
               sentence: seg.text, file, start: seg.start, at: new Date().toISOString().slice(0,10)});
    save('kept:'+folderKey, kept);
    keep.textContent = '貯めてある'; keep.disabled = true;
    paintExport();
  });
  box.appendChild(keep);

  // Wiktionary（無料・鍵なし。引けなくても他の表示は残る）
  try{
    const tryForms = form === token ? [form] : [form, token];
    let defs = null;
    for(const f of tryForms){
      const r = await fetch('https://en.wiktionary.org/api/rest_v1/page/definition/' + encodeURIComponent(f));
      if(!r.ok) continue;
      const d = await r.json();
      if(d.vi && d.vi.length){ defs = d.vi; break; }
    }
    wkBody.textContent = defs
      ? defs.slice(0,3).map(e => (e.partOfSpeech ? e.partOfSpeech + '：' : '') +
          e.definitions[0].definition.replace(/<[^>]+>/g,'')).join(' / ')
      : '項目がありません。';
  }catch(e){
    wkBody.textContent = 'いま引けませんでした（通信）。';
  }
}

/* practice.json：{decks:[{id,book,title,src,ask,items:[{id,show,say,group,start,end}],confusable:[[id]]}]}
   ⭕ 音声は切らず、元の mp3 の start〜end だけ鳴らす。

const WAIT = [0, 10*60e3, DAY, 3*DAY, 7*DAY, 21*DAY];   // 箱ごとの次までの間

function items(){
  const seen = new Set(), out = [];
  decks().forEach(d => d.items.forEach(it => { if(!seen.has(it.id)){ seen.add(it.id); out.push({...it, deck:d}); } }));
  return out;
}

/* 組が多い（本1冊で48組）ので、ボタンを並べず選ぶ形にする。

/* ---- 鳴らす：start〜end だけ ---- */
function urlFor(src){
  const f = pfiles[src] || afiles[src];
  if(!purls[src] && f) purls[src] = URL.createObjectURL(f);
  return purls[src];
}
function say(it){
  const u = urlFor(srcOf(it));
  if(!u) return;
  cancelAnimationFrame(raf); clearTimeout(stopTimer);
  const go = ()=>{
    clip.currentTime = it.start;
    stopAt = it.end;
    clip.play().catch(()=>{});
    // 止める：画面の描き替えごとに見る。窓が裏に回ると描き替えが止まるので、時計でも止める
    const tick = ()=>{ if(clip.currentTime >= stopAt){ clip.pause(); return; } raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    clip.addEventListener('playing', ()=>{
      clearTimeout(stopTimer);
      stopTimer = setTimeout(()=> clip.pause(), Math.max(0, (stopAt - clip.currentTime) * 1000 + 40));
    }, {once:true});
  };
  if(clip.dataset.src !== srcOf(it)){
    clip.dataset.src = srcOf(it);
    clip.src = u;
    clip.addEventListener('loadedmetadata', go, {once:true});
  }else go();
}

/* ---- 記録 ---- */
function rec(id){ return srs[id] || {box:0, due:0, seen:0, miss:0}; }
let hist = load('hist', []);   // [時刻, 項目, 練習, 正誤(1/0)]
function mark(it, ok, skill, gain){
  const r = rec(it.id);
  r.seen++;
  hist.push([Date.now(), it.id, skill || pview, ok ? 1 : 0]);
  if(hist.length > 20000) hist = hist.slice(-20000);
  save('hist', hist);
  if(ok){ r.box = Math.min(MAXBOX, r.box + (gain || 1)); }
  else { r.box = 0; r.miss++; }
  r.due = Date.now() + WAIT[r.box];
  r.last = Date.now();
  srs[it.id] = r;
  save('srs', srs);
  paintStat();
}
function paintStat(){
  const all = items();
  const now = Date.now();
  const due = all.filter(it => rec(it.id).due <= now).length;
  const known = all.filter(it => rec(it.id).box >= 3).length;
  $('#pstat').textContent = '覚えた ' + known + '/' + all.length + '　いま出す ' + due;
}

/* 次に出す1つ：期限が来たものを、箱の低い順・最後に見たのが古い順に */
const words = t => t.replace(/[.,!?;:“”"]/g, '').split(/\s+/).filter(Boolean);
const orderable = it => it.deck.kind === 'text' && words(it.show).length >= 3 && words(it.show).length <= 12;
const clozable = it => it.deck.kind === 'text' && words(it.show).length >= 2 && words(it.show).length <= 14;
// 書く：文と語、発音編の語（ma・cam など）。字の名前（A a）と音の断片（-ng）は書く対象にしない
const typable = it => it.deck.kind === 'text' || (!/[\s\/]/.test(it.show) && !/^-/.test(it.show) && it.group !== 'letter');
const FILTER = {order: orderable, cloze: clozable, type: typable};
function nextItem(prevId){
  const now = Date.now();
  const all = FILTER[pview] ? items().filter(FILTER[pview]) : items();
  let pool = all.filter(it => it.id !== prevId);
  if(!pool.length) pool = all;
  if(!pool.length) return null;
  const due = pool.filter(it => rec(it.id).due <= now);
  const from = due.length ? due : pool;
  from.sort((a,b)=> (rec(a.id).box - rec(b.id).box) || ((rec(a.id).last||0) - (rec(b.id).last||0)) || (Math.random() - .5));
  const head = from.filter(it => rec(it.id).box === rec(from[0].id).box).slice(0, 5);
  return head[Math.floor(Math.random() * head.length)];
}

/* 選択肢：取り違えやすい組から先に、足りなければ同じ本の同じ課から */
function choicesFor(it){
  const d = it.deck;
  const byId = Object.fromEntries(d.items.map(x => [x.id, x]));
  const near = new Set();
  (d.confusable || []).forEach(g => { if(g.includes(it.id)) g.forEach(id => { if(id !== it.id && byId[id]) near.add(id); }); });
  const pick = [...near].sort(()=> Math.random() - .5).slice(0, 3);
  let rest = d.items.map(x => x.id).filter(id => id !== it.id && !pick.includes(id)).sort(()=> Math.random() - .5);
  if(d.kind === 'text'){
    // 文の組：言葉が重なるもの・長さが近いものを先に（まったく違う文だと、聞かなくても選べてしまう）
    const mine = new Set(words(it.show.toLowerCase()));
    const score = id => { const w = words(byId[id].show.toLowerCase());
      return w.filter(x => mine.has(x)).length * 2 - Math.abs(w.length - mine.size) * .5 + Math.random(); };
    rest = rest.filter(id => byId[id].show.toLowerCase() !== it.show.toLowerCase())
               .sort((a,b)=> score(b) - score(a));
    rest = rest.slice(0, 6).sort(()=> Math.random() - .5).concat(rest.slice(6));
  }
  while(pick.length < 3 && rest.length) pick.push(rest.shift());
  return [it.id, ...pick].sort(()=> Math.random() - .5).map(id => ({...byId[id], deck:d}));
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderQuiz(){
  if(!q){

      : '聞こえた' + (it.deck.ask || '音') + 'を選んでください';
    box.appendChild(note);

    if(!q.heard){ q.heard = true; setTimeout(()=> say(it), 150); }

    box.insertAdjacentHTML('beforeend', '<div class="say">' + (q.heard ? esc(it.say) : '') + '</div>');
    if(!q.heard){
      const b = document.createElement('button'); b.className = 'primary hear'; b.textContent = '声に出してから、答えを聞く';
      b.addEventListener('click', ()=>{ q.heard = true; say(it); renderQuiz(); });
      box.appendChild(b);
      box.insertAdjacentHTML('beforeend', '<div class="pkeys"><kbd>space</kbd> 答えを聞く</div>');
    }else if(!q.done){
      const again = document.createElement('button'); again.textContent = 'もう一度聞く';
      again.addEventListener('click', ()=>{ say(it); again.blur(); });

      const ok = document.createElement('button'); ok.className = 'primary'; ok.textContent = '言えた';
      ng.addEventListener('click', ()=> answerSay(false));

      row.append(ng, ok); box.appendChild(row);
      box.insertAdjacentHTML('beforeend', '<div class="pkeys"><kbd>space</kbd> もう一度聞く　<kbd>←</kbd> 言えなかった　<kbd>→</kbd> 言えた</div>');
    }
  }
  body.appendChild(box);
}
/* ---- 穴埋め：1語だけ抜く。文法の語を優先して抜く ---- */
const FUNC = ['không','có','là','đã','rồi','chưa','sẽ','đang','vừa','mới','của','ở','được','cho','với','bằng','hơn','nhất',
  'lắm','quá','rất','hơi','mấy','gì','ai','đâu','nào','bao','nhiêu','phải','muốn','cần','nên','thích','cũng','và','nhưng',
  'hãy','đi','nhé','nhỉ','ạ','này','đó','kia','ấy','các','những','một','từ','đến','để','thì','nếu','vì','khi','hay','biết','thể'];
function clozeQ(it){
  if(!it) return null;
  const w = words(it.show);
  const lw = w.map(x => x.toLowerCase());
  let cand = lw.map((x,i)=> i).filter(i => FUNC.includes(lw[i]));
  if(!cand.length) cand = lw.map((x,i)=> i).filter(i => i > 0 || w.length === 1);
  if(!cand.length) cand = [0];
  const at = cand[Math.floor(Math.random() * cand.length)];
  const ans = lw[at];
  // 選択肢：文法の語なら文法の語から。そうでなければ同じ組の語から、長さの近いもの
  const pool = FUNC.includes(ans) ? FUNC
    : [...new Set(it.deck.items.flatMap(x => words(x.show).map(y => y.toLowerCase())))];
  const others = pool.filter(x => x !== ans && !lw.includes(x))
    .map(x => [x, Math.abs(x.length - ans.length) + Math.random() * 3]).sort((a,b)=> a[1] - b[1]).slice(0, 8)
    .sort(()=> Math.random() - .5).slice(0, 3).map(x => x[0]);
  return {it, at, ans, w, opts:[ans, ...others].sort(()=> Math.random() - .5), done:false};
}
function answerCloze(c){
  q.done = true; q.picked = c;
  mark(q.it, c === q.ans, 'cloze');
  say(q.it);
  renderCloze();
}

    b.addEventListener('click', ()=>{ if(!q.done) answerCloze(c); });

/* ---- 聞いて書く：語ごとに「合っている／声調・記号だけ違う／違う／抜けた」を返す ---- */
const TONE_RE = /[̣̀́̃̉]/g;
function wparts(w){
  const d = w.normalize('NFD').toLowerCase().replace(/[.,!?;:“”"]/g, '');
  const tone = (d.match(TONE_RE) || [''])[0];
  const shape = d.replace(TONE_RE, '').normalize('NFC');
  const base = shape.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
  return {tone, shape, base};
}
function checkTyped(target, typed){
  const T = words(target).map(wparts), Y = words(typed).map(wparts);
  // 文字（記号なし）で並びを合わせる（LCS）
  const n = T.length, m = Y.length, L = Array.from({length:n+1}, ()=> new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    L[i][j] = T[i].base === Y[j].base ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  const res = []; let i = 0, j = 0;
  while(i < n || j < m){
    if(i < n && j < m && T[i].base === Y[j].base){
      const exact = T[i].shape === Y[j].shape && T[i].tone === Y[j].tone;
      res.push({t:words(target)[i], y:words(typed)[j], k: exact ? 'ok' : 'near'}); i++; j++;
    }else if(j < m && (i >= n || L[i][j+1] >= L[i+1][j])){
      res.push({t:null, y:words(typed)[j], k:'extra'}); j++;
    }else{
      res.push({t:words(target)[i], y:null, k:'miss'}); i++;
    }
  }
  // 抜けと余りが隣り合っていたら「違う語」として1つにまとめる
  const out = [];
  for(const r of res){
    const prev = out[out.length-1];
    if(prev && ((prev.k === 'miss' && r.k === 'extra') || (prev.k === 'extra' && r.k === 'miss'))){
      out[out.length-1] = {t: prev.t || r.t, y: prev.y || r.y, k:'wrong'};
    }else out.push(r);
  }
  return out;
}

/* Telex：aa→â aw→ă ee→ê oo→ô ow→ơ uw→ư w→ư dd→đ、語の終わりの s f r x j で声調 */
const TMARK = {s:'́', f:'̀', r:'̉', x:'̃', j:'̣'};
function placeTone(w, t){
  const d = w.normalize('NFC');
  const plain = d.normalize('NFD').replace(TONE_RE, '').normalize('NFC');
  const chars = [...plain], low = chars.map(c => c.toLowerCase());
  const V = 'aăâeêioôơuưy';
  let idx = low.map((c,i)=> V.includes(c) ? i : -1).filter(i => i >= 0);
  if((low[0] === 'q' && low[1] === 'u') || (low[0] === 'g' && low[1] === 'i' && idx.length > 1)) idx = idx.filter(i => i !== 1);
  if(!idx.length) return w;
  const cl = [idx[0]]; for(const i of idx.slice(1)) if(i === cl[cl.length-1] + 1) cl.push(i);
  const marked = cl.filter(i => 'ăâêôơư'.includes(low[i]));
  let at;
  if(marked.length) at = marked[marked.length-1];
  else if(cl.length === 1) at = cl[0];
  else if(cl.length === 3) at = cl[1];
  else at = cl[cl.length-1] === chars.length - 1 ? cl[0] : cl[1];
  chars[at] = (chars[at].normalize('NFD') + TMARK[t]).normalize('NFC');
  return chars.join('');
}
function telexWord(w){
  if(!/^[\p{L}]+$/u.test(w)) return w;
  let tone = '';
  const m = w.match(/^(.*[aeiouyăâêôơư].*?)([sfrxj])$/iu);
  if(m){ w = m[1]; tone = m[2].toLowerCase(); }
  w = w.replace(/dd/g,'đ').replace(/DD|Dd/g,'Đ').replace(/uow/gi,'ươ').replace(/aa/g,'â').replace(/AA|Aa/g,'Â')
       .replace(/aw/g,'ă').replace(/ee/g,'ê').replace(/EE|Ee/g,'Ê').replace(/oo/g,'ô').replace(/OO|Oo/g,'Ô')
       .replace(/ow/g,'ơ').replace(/uw/g,'ư').replace(/w/g,'ư');
  return tone ? placeTone(w, tone) : w;
}
function telexLine(s){ return s.replace(/[\p{L}]+/gu, telexWord); }

        if(v !== inp.value){ inp.value = v; }
      }

    });
    inp.addEventListener('keydown', e=>{

    });
    box.appendChild(inp);

    opt.innerHTML = '<input type="checkbox"' + (load('telex', true) ? ' checked' : '') + '> 画面の Telex で打つ（aa→â　dd→đ　s f r x j で声調）';
    opt.querySelector('input').addEventListener('change', e => { save('telex', e.target.checked); inp.focus(); });
    box.appendChild(opt);
    const row = document.createElement('div'); row.className = 'row';

    row.append(give, ok); box.appendChild(row);
    box.insertAdjacentHTML('beforeend', '<div class="pkeys"><kbd>tab</kbd> もう一度聞く　<kbd>enter</kbd> 答え合わせ</div>');
    setTimeout(()=> inp.focus(), 0);
  }else{
    const diff = document.createElement('div'); diff.className = 'diff';
    diff.innerHTML = q.res.map(r => {
      if(r.k === 'ok') return '<span class="w ok">' + esc(r.t) + '</span>';
      if(r.k === 'near') return '<span class="w near" title="あなた：' + esc(r.y) + '">' + esc(r.t) + '<small>' + esc(r.y) + '</small></span>';
      if(r.k === 'wrong') return '<span class="w bad" title="あなた：' + esc(r.y) + '">' + esc(r.t) + '<small>' + esc(r.y) + '</small></span>';
      if(r.k === 'miss') return '<span class="w miss">' + esc(r.t) + '<small>抜け</small></span>';
      return '<span class="w extra"><s>' + esc(r.y) + '</s><small>余り</small></span>';
    }).join(' ');
    box.appendChild(diff);
    const legend = '<span class="lg"><i class="ok"></i>合っている</span><span class="lg"><i class="near"></i>声調・記号だけ違う</span><span class="lg"><i class="bad"></i>違う・抜け</span>';
    const note = document.createElement('div'); note.className = 'pnote';
    note.innerHTML = (q.ok ? '正解。' : q.close ? '文字は合っています。声調と記号を直せば正解です。' : '正しい文は上のとおりです。') + '<div class="legend">' + legend + '</div>';
    box.appendChild(note);

    box.insertAdjacentHTML('beforeend', '<div class="pkeys"><kbd>enter</kbd> 次へ</div>');

  body.appendChild(box);
