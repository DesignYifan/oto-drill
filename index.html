/* ---- 穴埋め：1語だけ抜く。文法の語を優先して抜く ---- */
const FUNC = { includes: w => LP.functionWords.includes(w), get list(){ return LP.functionWords; } };   // 文法の語は言語パックから
function clozeQ(it){
  if(!it) return null;
  const w = words(it.show);
  const lw = w.map(x => x.toLowerCase());
  let cand = lw.map((x,i)=> i).filter(i => FUNC.includes(lw[i]));
  if(!cand.length) cand = lw.map((x,i)=> i).filter(i => i > 0 || w.length === 1);
  if(!cand.length) cand = [0];
  const at = cand[Math.floor(Math.random() * cand.length)];
  const ans = lw[at];
  // 選択肢：文法の語なら文法の語から。そうでなければ同じ組の語から、長さの近いもの
  const pool = FUNC.includes(ans) ? FUNC.list
    : [...new Set(it.deck.items.flatMap(x => words(x.show).map(y => y.toLowerCase())))];
  const others = pool.filter(x => x !== ans && !lw.includes(x))
    .map(x => [x, Math.abs(x.length - ans.length) + Math.random() * 3]).sort((a,b)=> a[1] - b[1]).slice(0, 8)
    .sort(()=> Math.random() - .5).slice(0, 3).map(x => x[0]);
  return {it, at, ans, w, opts:[ans, ...others].sort(()=> Math.random() - .5), done:false};
}
function answerCloze(c){
  if(q.done) return;
  q.done = true; q.picked = c;
  if(q.typed){
    const r = checkTyped(q.ans, c.trim());
    q.gapOk = r.length === 1 && r[0].k === 'ok' || r.every(x => x.k === 'ok');
    q.gapClose = !q.gapOk && r.every(x => x.k === 'ok' || x.k === 'near');
    q.picked = c.trim() || '（なし）';
  }
  mark(q.it, q.typed ? q.gapOk : c === q.ans, q.typed ? 'gap' : 'cloze');
  say(q.it);
  renderCloze();
}

/* ---- 聞いて書く：語ごとに「合っている／声調・記号だけ違う／違う／抜けた」を返す ---- */
const toneRe = () => LP.nearMiss ? new RegExp('[' + LP.nearMiss.marks + ']', 'g') : /(?!)/g;   // 「惜しい」にする記号は言語パックから
function wparts(w){
  const d = w.normalize('NFD').toLowerCase().replace(/[.,!?;:“”"]/g, '');
  const tone = (d.match(toneRe()) || [''])[0];
  const shape = d.replace(toneRe(), '').normalize('NFC');
  const base = shape.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
  return {tone, shape, base};
}
function checkTyped(target, typed){
  const T = words(target).map(wparts), Y = words(typed).map(wparts);
  // 文字（記号なし）で並びを合わせる（LCS）
  const n = T.length, m = Y.length, L = Array.from({length:n+1}, ()=> new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    L[i][j] = T[i].base === Y[j].base ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  const res = []; let i = 0, j = 0;
  while(i < n || j < m){
    if(i < n && j < m && T[i].base === Y[j].base){
      const exact = T[i].shape === Y[j].shape && T[i].tone === Y[j].tone;
      res.push({t:words(target)[i], y:words(typed)[j], k: exact ? 'ok' : 'near'}); i++; j++;
    }else if(j < m && (i >= n || L[i][j+1] >= L[i+1][j])){
      res.push({t:null, y:words(typed)[j], k:'extra'}); j++;
    }else{
      res.push({t:words(target)[i], y:null, k:'miss'}); i++;
    }
  }
  // 抜けと余りが隣り合っていたら「違う語」として1つにまとめる
  const out = [];
  for(const r of res){
    const prev = out[out.length-1];
    if(prev && ((prev.k === 'miss' && r.k === 'extra') || (prev.k === 'extra' && r.k === 'miss'))){
      out[out.length-1] = {t: prev.t || r.t, y: prev.y || r.y, k:'wrong'};
    }else out.push(r);
  }
  return out;
}

/* Telex：aa→â aw→ă ee→ê oo→ô ow→ơ uw→ư w→ư dd→đ、語の終わりの s f r x j で声調 */
const TMARK = {s:'́', f:'̀', r:'̉', x:'̃', j:'̣'};
function placeTone(w, t){
  const d = w.normalize('NFC');
  const plain = d.normalize('NFD').replace(toneRe(), '').normalize('NFC');
  const chars = [...plain], low = chars.map(c => c.toLowerCase());
  const V = 'aăâeêioôơuưy';
  let idx = low.map((c,i)=> V.includes(c) ? i : -1).filter(i => i >= 0);
  if((low[0] === 'q' && low[1] === 'u') || (low[0] === 'g' && low[1] === 'i' && idx.length > 1)) idx = idx.filter(i => i !== 1);
  if(!idx.length) return w;
  const cl = [idx[0]]; for(const i of idx.slice(1)) if(i === cl[cl.length-1] + 1) cl.push(i);
  const marked = cl.filter(i => 'ăâêôơư'.includes(low[i]));
  let at;
  if(marked.length) at = marked[marked.length-1];
  else if(cl.length === 1) at = cl[0];
  else if(cl.length === 3) at = cl[1];
  else at = cl[cl.length-1] === chars.length - 1 ? cl[0] : cl[1];
  chars[at] = (chars[at].normalize('NFD') + TMARK[t]).normalize('NFC');
  return chars.join('');
}
function telexWord(w){
  if(!/^[\p{L}]+$/u.test(w)) return w;
  let tone = '';
  const m = w.match(/^(.*[aeiouyăâêôơư].*?)([sfrxj])$/iu);
  if(m){ w = m[1]; tone = m[2].toLowerCase(); }
  w = w.replace(/dd/g,'đ').replace(/DD|Dd/g,'Đ').replace(/uow/gi,'ươ').replace(/aa/g,'â').replace(/AA|Aa/g,'Â')
       .replace(/aw/g,'ă').replace(/ee/g,'ê').replace(/EE|Ee/g,'Ê').replace(/oo/g,'ô').replace(/OO|Oo/g,'Ô')
       .replace(/ow/g,'ơ').replace(/uw/g,'ư').replace(/w/g,'ư');
  return tone ? placeTone(w, tone) : w;
}
function telexLine(s){ return s.replace(/[\p{L}]+/gu, telexWord); }

function renderType(){

      : qResult('ng', '不正解', '正しい文は下のとおりです'));
    const diff = document.createElement('div'); diff.className = 'diff';
    diff.innerHTML = q.res.map(r => {

/* ---- 解説：答えたあとに、文の意味・語ごとの意味・文法を出す（2026-10-01） ----
   本人「正解したら文法の意味とか説明を入れておいてくれないと、どう正解したのか、どう間違ったのかが分からない」
   「単語も押したときに内容が分からない。訳を出すのか」。
   ⭕ 語の意味は押さなくても読めるよう、語のすぐ下に書き添える。
   ⭕ 出どころを分ける：文法メモ（notes.json・手で書いた）／機械の訳（gloss.json・未確認）。⛔ 機械の訳を確かめた物のように見せない */
function glossOf(text){ return gloss[text] || gloss[(text || '').trim()] || null; }
function wordMeaning(w, text){
  const g = glossOf(text), k = norm(w);
  if(g) for(const [x, ja] of g.words){ if(norm(x) === k || norm(x).split(' ').includes(k)) return {w: x, ja, src: 'auto'}; }
  const lx = lex.words[k] || lex.words[w];
  if(lx && lx.ja) return {w, ja: lx.ja, src: 'lex'};
  for(const t of Object.keys(gloss)){ const h = gloss[t].words.find(([x]) => norm(x) === k); if(h) return {w: h[0], ja: h[1], src: 'auto'}; }
  return null;
}
/* 訳の無い文：台帳の語（bác sĩ・Việt Nam など2〜3音節）に合わせ、長い語から先にまとめる */
function segmentByLex(text){
  const ws = words(text), out = [];
  if(LP.segment !== 'syllable+lexicon') return ws;
  for(let i = 0; i < ws.length;){
    let n = 1;
    for(let k = Math.min(3, ws.length - i); k > 1; k--){ if(lex.words[norm(ws.slice(i, i + k).join(' '))]){ n = k; break; } }
    out.push(ws.slice(i, i + n).join(' ')); i += n;
  }
  return out;
}
/* 押した語の意味を、画面の下に少しのあいだ出す */
let toastT = 0;
function toast(html){
  const t = $('#toast'); t.innerHTML = html; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(()=> t.hidden = true, 4000);

function explainEl(it, res){
  // res：{ok, wrong:[{you, right}] }
  const box = document.createElement('section'); box.className = 'explain';
  const g = it.deck && it.deck.kind === 'text' ? glossOf(it.show) : null;
  const wp = wordPic(it.show);
  let h = (wp ? '<img class="wpic" src="' + wp + '" alt="">' : '') + '<div class="exr"><span class="pill ' + (res.ok ? 'ok' : 'ng') + '">' + (res.ok ? '正解' : res.close ? 'おしい' : '不正解') + '</span>' +
    (res.msg ? '<span class="exmsg">' + esc(res.msg) + '</span>' : '') + '</div>';
  if(g && g.words.length){
    h += '<div class="gl" lang="' + LP.code + '">' + g.words.map(([w, ja]) => '<span class="glw"><b>' + esc(w) + '</b><small lang="ja">' + esc(ja) + '</small></span>').join('') + '</div>';
  }else if(it.deck && it.deck.kind === 'text'){
    h += '<div class="gl" lang="' + LP.code + '">' + segmentByLex(it.show).map(w => { const m = wordMeaning(w, it.show);
      return '<span class="glw"><b>' + esc(w) + '</b><small lang="ja">' + (m ? esc(m.ja) : '—') + '</small></span>'; }).join('') + '</div>';
  }
  if(g && g.ja) h += '<div class="exja"><span class="exk">意味</span><div>' + esc(g.ja) + (g.check ? '<div class="excheck">要確認：' + esc(g.check) + '（別のモデルの判定）</div>' : '') + '</div></div>';
  (res.wrong || []).forEach(x => {
    const a = wordMeaning(x.you, it.show), b = wordMeaning(x.right, it.show);
    h += '<div class="exdiff"><span class="exk">違い</span><span>選んだ <b>' + esc(x.you || '（なし）') + '</b>' + (a ? '＝' + esc(a.ja) : '') + '</span><span>正しくは <b>' + esc(x.right) + '</b>' + (b ? '＝' + esc(b.ja) : '') + '</span></div>';
  });
  const ns = it.deck && it.deck.kind === 'text' ? notesFor(it.show) : [];
  ns.forEach(n => { h += '<div class="exnote"><span class="exk">文法</span><div><b>' + esc(unmark(n.title)) + '</b>' + esc(unmark(n.body)) + '</div></div>'; });
  if(g && g.point && !ns.length) h += '<div class="exnote"><span class="exk">要点</span><div>' + esc(g.point) + '</div></div>';
  if(g) h += '<div class="exsrc">意味と要点は自動翻訳です（未確認）。文法は手で書いたメモです。</div>';
  else if(it.deck && it.deck.kind === 'text') h += '<div class="exsrc">この文の訳はまだありません。語の意味は単語の一覧から出しています。</div>';
  box.innerHTML = h;
  if(it.deck && it.deck.kind === 'text'){
    const ctx = ctxOf(it.show, it.id);
    // 段5：間違えたら「なぜ違う？」に、どの練習で・自分の答え・正解をアプリが添える（2026-10-04）
    if(!res.ok){
      const pairs = (res.wrong || []).filter(x => x.right && norm(x.you || '') !== norm(x.right));
      // ⛔ 穴埋めでは、正解は文ではなく穴に入る語（文を正解として渡すと、AI が文全体と比べてしまった）
      const gapAns = q && typeof q.ans === 'string' ? q.ans : null;
      ctx.why = {how: STEPNAME[pview] || '', you: youOf(q), right: gapAns || it.show, sentence: gapAns ? it.show : '', rightJa: jaOf(it) || (g && g.ja) || '', close: !!res.close,
        pairs: pairs.filter(x => x.you)};
    }
    const st = res.ok || res.close ? null : noteMiss(it, res);
    const ask = askEl(ctx);
    if(st) box.insertBefore(stuckEl(st, it, ask), box.firstChild);
    box.appendChild(ask);
  }
  return box;
}

function answerSay(ok){ q.done = true; mark(q.it, ok, pview === 'speak' ? 'speak' : 'say'); nextQ(); }
function nextRow(){

/* 問いを1つ作る（どの練習も同じ入口） */
function makeQ(v, it){
  if(!it) return null;
  if(v === 'order' || v === 'build'){ const x = orderQ(it); if(x){ x.build = v === 'build'; if(x.build) x.heard = true; } return x; }
  if(v === 'cloze' || v === 'gap'){ const x = clozeQ(it); if(x) x.typed = v === 'gap'; return x; }
  if(v === 'type') return {it, done: false, heard: false};
  if(v === 'mean') return {it, done: false, heard: false, choices: meanChoices(it)};
  if(v === 'write') return {it, done: false};
  if(DRILLV[v]) return {it, done: false};
  return {it, done: false, heard: false, choices: v === 'hear' ? choicesFor(it) : null};
}
function nextQ(){
  if(runOn && run){ runNext(); return; }
  const prev = q && q.it.id;
  q = makeQ(pview, nextItem(prev));
  renderPractice();
}

document.addEventListener('keydown', e=>{
  if(mode !== 'practice' || !q || pview === 'table' || pview === 'typing') return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if(pview === 'type' || pview === 'gap' || pview === 'write' || DRILLV[pview]){   // 書く欄の中では space と enter を欄に任せる
    if(e.target.classList && e.target.classList.contains('typein')) return;
    if(k === 'Enter' && q.done){ e.preventDefault(); nextQ(); }
    return;
  }
  if(pview === 'mean'){
    if(!q.done && /^[1-4]$/.test(k)){ const c = q.choices[Number(k)-1]; if(c) answerMean(c); }
    else if(k === ' '){ e.preventDefault(); say(q.it); }
    else if(k === 'Enter' && q.done){ e.preventDefault(); nextQ(); }
    return;
  }
  if(pview === 'cloze'){
    if(!q.done && /^[1-4]$/.test(k)){ const c = q.opts[Number(k)-1]; if(c) answerCloze(c); }
    else if(k === ' '){ e.preventDefault(); if(q.done) say(q.it); }
    else if(k === 'Enter' && q.done){ e.preventDefault(); nextQ(); }
    return;
  }
  if(pview === 'order' || pview === 'build'){
    if(k === ' '){ e.preventDefault(); if(pview === 'order' || q.done) say(q.it); }
    else if(k === 'Enter' && q.done){ e.preventDefault(); nextQ(); }
    return;
  }
  if(pview === 'hear'){
    if(!q.done && /^[1-4]$/.test(k)){ const c = q.choices[Number(k)-1]; if(c){ q.done = true; q.picked = c.id; mark(q.it, c.id === q.it.id, 'hear'); renderQuiz(); } }
    else if(k === ' '){ e.preventDefault(); say(q.it); }
    else if(k === 'Enter' && q.done){ e.preventDefault(); nextQ(); }
  }else{
    if(k === ' '){ e.preventDefault(); if(!q.heard){ q.heard = true; say(q.it); renderQuiz(); } else say(q.it); }
    else if(q.heard && !q.done && k === 'ArrowRight'){ e.preventDefault(); answerSay(true); }
    else if(q.heard && !q.done && k === 'ArrowLeft'){ e.preventDefault(); answerSay(false); }
  }
});

/* どこまで覚えたかを、項目・語・練習の3つの目で見る。数え方は README と実現方式に書いた。 */
const SKILL = [['mean','聴いて意味'], ['build','組み立てる'], ['gap','穴を書く'], ['write','日本語から書く'], ['type','聴いて書く'], ['speak','日本語から言う'], ['transform','書き換える'], ['respond','質問に答える'], ['hear','聴いて選ぶ'], ['say','見て言う'], ['order','並べ替える'], ['cloze','穴埋め']];
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); };
function level(id){ const r = rec(id); return r.box >= 3 ? 2 : (r.seen > 0 ? 1 : 0); }   // 0 未着手 1 覚えかけ 2 覚えた

function stackBar(counts, total){
  const lab = ['未着手','覚えかけ','覚えた'];
  return '<div class="sbar">' + [2,1,0].filter(k => counts[k]).map(k =>
    '<i class="lv' + k + '" style="flex:' + counts[k] + '" title="' + lab[k] + '　' + counts[k] + '/' + total + '"></i>').join('') + '</div>';

  SKILL.forEach(([k, name]) => {
    const hs = hist.filter(h => h[2] === k).slice(-50);

    say(it);

    toast('<b lang="' + LP.code + '">' + esc(m ? m.w : e.w) + '</b>' + (m ? esc(m.ja) + '<small>' + (m.src === 'auto' ? '自動翻訳（未確認）' : '単語の一覧') + '</small>' : '<small>意味はまだありません</small>'));
  }));
  box.querySelectorAll('.wk').forEach(b => b.addEventListener('click', ()=> say(all.get(b.dataset.id))));
}
function tile(label, n, total){
  return '<div class="tile"><div class="eyebrow">' + label + '</div><div class="big">' + n +
    (total !== null ? '<small> / ' + total + '</small>' : '') + '</div></div>';
}
function heatmap(perDay){
  // 列＝週（古い→新しい）、行＝月〜日。色は1色の濃淡（多いほど濃い）
  const end = new Date(); end.setHours(0,0,0,0);
  const dow = (end.getDay() + 6) % 7;             // 月曜を0に
  const start = new Date(end.getTime() - (7*11 + dow) * DAY);
  const max = Math.max(1, ...Object.values(perDay));
  let cells = '';
  for(let w = 0; w < 12; w++){
    cells += '<div class="hcol">';
    for(let d = 0; d < 7; d++){
      const t = start.getTime() + (w*7 + d) * DAY;
      if(t > end.getTime()){ cells += '<i class="h none"></i>'; continue; }
      const n = perDay[dayKey(t)] || 0;
      const lv = n === 0 ? 0 : Math.min(4, 1 + Math.floor(n / max * 3.999));
      const dt = new Date(t);
      cells += '<i class="h h' + lv + '" title="' + (dt.getMonth()+1) + '/' + dt.getDate() + '　' + n + '問"></i>';
    }
    cells += '</div>';
  }
  return '<div class="heat"><div class="hdays"><span>月</span><span></span><span>水</span><span></span><span>金</span><span></span><span>日</span></div>' + cells +
    '</div><div class="legend ov"><span class="lg">少ない</span><i class="h h1"></i><i class="h h2"></i><i class="h h3"></i><i class="h h4"></i><span class="lg">多い</span></div>';
}

/* ================= 教材 ================= */
/* 教材ごとに、進み具合・紙の問題・文法・語彙を1か所で見る（本人 2026-09-30）。
   教材＝開いたフォルダ。課はフォルダの中の book.json で決める（無ければサブフォルダで仮に切る）。
   ⭕ 練習の箱と履歴は言語の側の id のまま全教材で1つ。教材ごとの数字は、その教材の項目で絞って数える。
   ⭕ 紙の問題の記録は足していくだけ。上書きしない（やり直した回も残る）。 */

let book = null, bookId = '';
let bview = load('b:view', 'lesson'); if(bview === 'paper') bview = 'lesson';   // 紙の問題の画面はやめた（2026-10-04）
let bopen = null;      // 文法で開いている型
const PAPER = {o:['○',1], s:['△',.5], x:['×',0]};

function setBook(data){

  bookId = (book && book.id) || folderKey;

}

/* 課の並び。book.json が無いときは、サブフォルダごと（無ければ全体で1つ） */
function lessons(){
  if(book) return book.lessons;
  const subs = [...new Set(tracks.map(t => t.rel.split('/')).filter(a => a.length > 2).map(a => a[1]))];
  if(subs.length) return subs.map(sb => ({id: sb, title: sb, folder: sb}));
  return [{id: 'all', title: '全体'}];
}
function inLesson(L, t){
  if(L.match){
    if(L._re === undefined){ try{ L._re = new RegExp(L.match, 'i'); }catch(e){ L._re = null; } }
    return !!L._re && L._re.test(t.name);
  }
  if(L.tracks) return L.tracks.includes(t.name);
  if(L.folder) return t.rel.split('/')[1] === L.folder;
  return L.id === 'all';
}

/* 課ごとに：音声・本文の文・練習の項目。開くたびに数えるのは重いので1回だけ */
let lessonCache = null;
function lessonData(){
  if(lessonCache) return lessonCache;
  const ls = lessons();
  const allItems = pdata ? pdata.decks.flatMap(d => d.items.map(it => ({...it, deck: d}))) : [];
  lessonCache = ls.map(L => {
    const ts = tracks.filter(t => inLesson(L, t));
    const names = new Set(ts.map(t => t.name));
    const sents = [];
    ts.forEach(t => ((script && script[t.name]) ? script[t.name].segments : []).forEach(seg =>
      sents.push({file: t.name, seg, m: matchable(seg.text), n: ' ' + norm(seg.text) + ' ', long: norm(seg.text).split(' ').length >= 3})));
    const dk = new Set(L.decks || []);
    const its = allItems.filter(it => dk.has(it.deck.id) || names.has(srcOf(it)));
    return {L, tracks: ts, sents, items: its, ids: new Set(its.map(i => i.id))};
  });
  return lessonCache;
}

/* 語と型を、最初に出てくる課に寄せる（lesson が書いてあればそちら） */
function firstLesson(text, given){
  const ld = lessonData();
  if(given){ const i = ld.findIndex(x => x.L.id === given); if(i >= 0) return i; }
  // 文法の型は前後の空白まで含めて書いてある（matchable と突き合わせる）。語は記号を落とした本文と突き合わせる
  const isPat = text.startsWith(' ');
  const m = isPat ? text : ' ' + norm(text) + ' ';
  // ⛔ 発音の練習の1語だけの区間（「Đã」など）で課を決めない。3語以上の文で探し、無ければ何でも
  // book.json で assign:false の課（発音の練習など）は、ほかに無いときだけ使う
  const f = s => (isPat ? s.m : s.n).includes(m);
  for(const ok of [x => x.L.assign !== false && x.sents.some(s => s.long && f(s)), x => x.sents.some(s => s.long && f(s)), x => x.sents.some(f)]){
    const i = ld.findIndex(ok); if(i >= 0) return i;
  }
  return -1;
}
function sentsWith(m, li, field){
  field = field || 'm';
  const ld = lessonData();
  const pool = li >= 0 ? ld[li].sents.concat(...ld.filter((_, i) => i !== li).map(x => x.sents)) : ld.flatMap(x => x.sents);
  const hit = pool.filter(s => s[field].includes(m));
  return hit.filter(s => s.long).concat(hit.filter(s => !s.long));
}
function playSent(s){ say({src: s.file, start: s.seg.start, end: s.seg.end, deck: {}}); }

/* 語の覚えた具合：その語を含む練習の項目のうち、一番進んだ段 */
let wlMemo = new Map(), shows = null;
function wordLevel(w){
  if(wlMemo.has(w)) return wlMemo.get(w);
  let lv = typed.has(w) ? 2 : 0;
  if(pdata){
    if(!shows) shows = pdata.decks.flatMap(d => d.items.map(it => [' ' + norm(it.show) + ' ', it.id]));
    const m = ' ' + w + ' ';
    for(const [sh, id] of shows){ if(lv === 2) break; if(sh.includes(m)) lv = Math.max(lv, level(id)); }
  }
  wlMemo.set(w, lv);
  return lv;
}

function vocab(){
  const ld = lessonData();
  const out = ld.map(() => []);
  const rest = [];
  const seen = new Set();
  const put = (li, e) => { if(seen.has(e.w)) return; seen.add(e.w); (li >= 0 ? out[li] : rest).push(e); };
  Object.entries(lex.words || {}).forEach(([w, v]) => {
    const k = norm(w);
    put(firstLesson(k, v.lesson), {w: k, ja: v.ja || '', mo: v.morphemes});
  });
  kept.forEach(k => {
    const w = norm(k.form);
    const li = ld.findIndex(x => x.tracks.some(t => t.name === k.file));
    put(li, {w, ja: k.ja || '', kept: true});
  });
  // 台帳が無い教材：本文に出た語（1音節ずつ）を、最初に出た課に置く
  if(!Object.keys(lex.words || {}).length){
    ld.forEach((x, li) => x.sents.forEach(s => s.n.trim().split(' ').forEach(w => {
      if(/^\p{L}+$/u.test(w) && !/^\d/.test(w)) put(li, {w, ja: '', syl: true});
    })));
  }
  const keptSet = new Set(kept.map(k => norm(k.form)));
  out.concat([rest]).forEach(a => a.forEach(e => { e.kept = e.kept || keptSet.has(e.w); }));
  return {out, rest};
}

function grammar(){
  const ld = lessonData();
  const out = ld.map(() => []), rest = [];
  (notes.patterns || []).forEach(p => {
    const li = firstLesson(p.match, p.lesson);
    (li >= 0 ? out[li] : rest).push({...p, li});
  });
  return {out, rest};
}

function paperDefs(){
  const own = load('paperdef:' + bookId, {});
  const ls = lessons();
  const defs = {};
  ls.forEach(L => { defs[L.id] = (L.exercises || []).concat(own[L.id] || []); });
  return defs;
}
function paperRecs(){ return load('paper:' + bookId, []); }
function paperLatest(){
  const last = {};
  paperRecs().forEach(r => { last[r.l + '|' + r.ex + '|' + r.n] = r; });
  return last;
}
function exCount(ex){ const o = load('excount:' + bookId, {}); return o[ex.id] || ex.count || 0; }
function paperScore(lid, defs, last){
  let got = 0, tot = 0, done = 0;
  (defs[lid] || []).forEach(ex => { for(let n = 1; n <= exCount(ex); n++){
    tot++; const r = last[lid + '|' + ex.id + '|' + n]; if(r){ done++; got += PAPER[r.r][1]; }
  }});
  return {got, tot, done};
}

function rateOf(ids){
  const hs = hist.filter(h => ids.has(h[1])).slice(-50);
  return hs.length ? {r: Math.round(hs.reduce((n, h) => n + h[3], 0) / hs.length * 100), n: hs.length} : null;
}

const STEP = [['listen', '聴く'], ['words', '単語'], ['practice', '練習'], ['paper', '紙の問題']];
const wknown = () => new Set(load('wknown:' + bookId, []));
let blesson = null;     // いま開いている課の id

const exItems = new Map();   // 紙の問題の問題文（項目 id → 項目）。押したときに鳴らすため
function exHTML(lid, ex, last){
  const cnt = exCount(ex);
  let h = '<div class="pex"><div class="exhead"><span class="nm">' + esc(ex.label) + '</span>' +
    (ex.vi ? '<span class="exvi">' + esc(ex.vi) + '</span>' : '') +

    '</div>';
  if(!cnt){
    h += '<div class="excount"><span>問の数を入れると、印を付けられます</span><input type="number" min="1" max="60" data-ex="' + esc(ex.id) + '" aria-label="問の数" placeholder="数"><button class="setcount" data-ex="' + esc(ex.id) + '">決める</button></div></div>';
    return h;
  }
  /* 問題文：練習の音声の文字起こしがあれば、各問の横に出す（2026-10-04 本人「教科書の問題をそのまま引っ張ってきてくれればいい」）。
     ⭕ 押すとその問だけ鳴る。⛔ 文字起こしなので聞き違いが混ざることがある */
  const lx = lessonData().find(y => y.L.id === lid);
  const qs = lx ? lx.items.filter(it => !isSound(it) && (ex.tracks || []).includes(srcOf(it)) && it.end > it.start).sort((a, b) => a.start - b.start) : [];
  if(qs.length){
    h += '<div class="exqs">' + Array.from({length: Math.max(cnt, qs.length)}, (_, i) => {
      const n = i + 1, r = last[lid + '|' + ex.id + '|' + n], it = qs[i];
      if(it) exItems.set(it.id, it);
      return '<div class="exq">' + (n <= cnt ? '<button class="pc' + (r ? ' r' + r.r : '') + '" data-l="' + esc(lid) + '" data-ex="' + esc(ex.id) + '" data-n="' + n + '" aria-label="' + n + '問目　' + (r ? PAPER[r.r][0] : 'まだ') + '"><small>' + n + '</small>' + (r ? PAPER[r.r][0] : '') + '</button>' : '<span></span>') +
        '<span class="qt" lang="' + LP.code + '">' + (it ? esc(it.show) : '') + '</span>' +
        (it ? '<button class="exsay" data-item="' + esc(it.id) + '">▶ 聴く</button>' : '<span></span>') + '</div>';
    }).join('') + '</div>' + (ex.count && !load('excount:' + bookId, {})[ex.id] ? '<div class="excountnote">問の数は音声から見積もっています。違っていたら <button class="linkish recount" data-ex="' + esc(ex.id) + '">直す</button></div>' : '') + '</div>';
    return h;
  }
  h += '<div class="pcells">';
  for(let n = 1; n <= cnt; n++){
    const r = last[lid + '|' + ex.id + '|' + n];
    h += '<button class="pc' + (r ? ' r' + r.r : '') + '" data-l="' + esc(lid) + '" data-ex="' + esc(ex.id) + '" data-n="' + n + '" aria-label="' + n + '問目　' + (r ? PAPER[r.r][0] : 'まだ') + '" title="' +
      (r ? new Date(r.t).toLocaleDateString('ja-JP') : 'まだ') + '"><small>' + n + '</small>' + (r ? PAPER[r.r][0] : '') + '</button>';
  }
  return h + '</div>' + (ex.count && !load('excount:' + bookId, {})[ex.id] ? '<div class="excountnote">問の数は音声の番号から見積もっています。違っていたら <button class="linkish recount" data-ex="' + esc(ex.id) + '">直す</button></div>' : '') + '</div>';
}

/* 課の4段。null はその段が無い（中身が無い） */
function lessonSteps(li, defs, last, V){
  const x = lessonData()[li], L = x.L;
  const exs = defs[L.id] || [];
  const exTracks = new Set(exs.flatMap(e => e.tracks || []));
  const listen = x.tracks.filter(t => !exTracks.has(t.name));
  const known = wknown();
  // ⛔ 語の台帳が無い教材の「本文の音節」は数えない（指示文や数字まで入り、覚える語の一覧にならない）
  const words = V.out[li].filter(e => !e.syl);
  const isKnown = w => known.has(w) || wordLevel(w) === 2;
  const ps = paperScore(L.id, defs, last);
  const st = {
    listen: listen.length ? {n: listen.filter(t => done.has(t.name)).length, of: listen.length, list: listen} : null,
    words: words.length ? {n: words.filter(e => isKnown(e.w)).length, of: words.length, list: words, isKnown} : null,
    practice: x.items.length ? {n: x.items.filter(i => rec(i.id).box >= 1).length, of: x.items.length} : null,
    paper: null,   // 紙の問題はやめた（2026-10-04 本人「練習と同じ感じで、このドリルの中で解く」「別の練習のところで入ってるんだったら、これはなしでいい」）。教科書の練習問題は24問とも「練習」の組（問題・まとめ問題）に入っている。⭕ 付けた印の記録は消さずに残す
  };
  STEP.forEach(([k]) => { if(st[k]) st[k].done = st[k].n >= st[k].of; });
  st.all = STEP.every(([k]) => !st[k] || st[k].done);
  return st;
}
function dot(s){ return '<i class="sdot ' + (!s ? 'none' : s.done ? 'done' : s.n ? 'doing' : 'todo') + '"></i>'; }

  const ld = lessonData(), V = vocab();

    (cst => '<span class="lprog" aria-label="ステージ ' + cst.cleared + ' / ' + cst.of + ' クリア">' + (cst.all ? '<b class="crown">クリア</b>' : '<i style="--p:' + (cst.of ? cst.cleared / cst.of * 100 : 0) + '%"></i><small>' + cst.cleared + '/' + cst.of + '</small>') + '</span>')(chapterState(i, defs, last)) +

  let n = 0;

    st.listen.n + ' / ' + st.listen.of + ' 本');
  if(st.words) h += card('words', '単語', '<div class="lwords">' + st.words.list.map(e =>

    '<button class="lwk" data-w="' + esc(e.w) + '" aria-label="' + esc(e.w) + ' を覚えた" aria-pressed="' + st.words.isKnown(e.w) + '"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg></button></span>').join('') + '</div>' +
    '<div class="row" style="justify-content:flex-start;margin-top:12px"><button class="primary wcopen" data-li="' + li + '">単語カードで覚える</button></div>' +

    st.words.n + ' / ' + st.words.of + ' 語');
  if(!st.words && V.out[li].some(e => e.syl)) h += '<section class="lstep muted"><div class="lsh"><span class="num">–</span><b>単語</b><span class="ct">まだ無い</span></div>' +
    '<p class="bfoot" style="margin:0">この教材には語の一覧（lexicon.json）がまだありません。巻末の語彙表か各課の「新しい語」の頁の写真があれば、課ごとの単語をここに並べられます。</p></section>';
  if(st.practice) h += card('practice', '練習', '<div class="lsets">' + setChipsHTML([...new Set(x.items.map(i => i.deck.id))].map(id => pdata.decks.find(d => d.id === id)), null) + '</div>' +
    '<div class="lprac"><span>種類ごとの小さな組（' + SET_SIZE + ' 項目まで）。押すとその組だけを練習します。全部の項目に一度ずつ正解すると、この段は済みです。</span><button id="lpractice">この課を全部まとめて</button></div>',
    st.practice.n + ' / ' + st.practice.of + ' 項目');
  if(st.paper) h += card('paper', '紙の問題', st.paper.exs.map(ex => exHTML(x.L.id, ex, last)).join('') +
    '<p class="bfoot">本で解いて、1問ずつ ○ → △ → × の印を付けます。「この問題の音声」を押すと音声の画面に移り、そこでも印を付けられます。</p>',
    st.paper.n + ' / ' + st.paper.of + ' 問' + (st.paper.ps.done ? '　' + fmtN(st.paper.ps.got) + ' 点' : ''));
  const next = ld[li + 1];
  h += '<div class="lnext">' + (next ? '<button class="' + (st.all ? 'primary' : '') + '" data-lesson="' + esc(next.L.id) + '">次の課へ：' + esc(next.L.title) + '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>' : '') + '</div>';
  return h + '</div></div>';
}

/* ================= 単語カード（2026-10-04） =================
   本人「日本語があって、それを隠してベトナム語が言えるとか、ベトナム語があって、それを隠して日本語が言えるとか、単語カード形式みたいな感じに」
   「せっかく画像も作ってたから、単語のテストみたいにしたりしてほしい」。
   ⭕ 向き：ベトナム語 → 日本語／日本語 → ベトナム語。絵は答えを明かさない側に出す（日本語→ベトナム語なら表、逆なら裏）。
   ⭕ 「覚えた」は課の単語の印（wknown）と同じものに付く。「もう一度」は後ろに回す。
   ⭕ 音は、単語の音声で1語ずつ切った区間を使う。無ければ端末の声 */
function wordClip(w){
  let hit = null;
  for(const x of lessonData()) for(const it of x.items){
    if(isSound(it) || !(it.end > it.start) || norm(it.show) !== w) continue;
    if(!hit || (it.group === '単語' && hit.group !== '単語')) hit = it;
  }
  return hit;
}
function sayWord(w){ const it = wordClip(w); if(it) say(it); else speakText(w); }
let wc = null;
function openCards(li){
  const list = vocab().out[li].filter(e => !e.syl && e.ja);
  if(!list.length){ toast('この課には、訳のある語がまだありません'); return; }
  const k = wknown(), skip = load('wc:skip', true);
  let queue = list.filter(e => !(skip && k.has(e.w)));
  const allKnown = !queue.length; if(allKnown) queue = list.slice();
  const sh = a => a.map(v => [Math.random(), v]).sort((p, q2) => p[0] - q2[0]).map(v => v[1]);
  wc = {li, list, queue: sh(queue), i: 0, flipped: false, got: 0, again: 0, allKnown};
  let box = $('#wcard');
  if(!box){ box = document.createElement('div'); box.id = 'wcard'; box.className = 'wcwrap'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', '単語カード'); document.body.appendChild(box);
    box.addEventListener('click', e => { if(e.target === box) closeCards(); }); }
  box.hidden = false; paintCards();
}
function closeCards(){ const box = $('#wcard'); if(box) box.hidden = true; wc = null; clip.pause(); rerender(); }
function paintCards(){
  const box = $('#wcard'); if(!box || !wc) return;
  const dir = load('wc:dir', 'vi'), L = lessonData()[wc.li].L;
  const head = '<div class="wchead"><b>単語カード　' + esc(L.title) + '</b><span class="ct">' + Math.min(wc.i + 1, wc.queue.length) + ' / ' + wc.queue.length + '</span><button class="apclose wcclose" aria-label="閉じる"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>' +
    '<div class="wcopts"><div class="seg">' + [['vi', LP.name + ' → 日本語'], ['ja', '日本語 → ' + LP.name]]   /* 'vi' は『学ぶ言語が表』の意味の印（言語ではない） */.map(([k2, t]) => '<button class="wcdir' + (dir === k2 ? ' on' : '') + '" data-d="' + k2 + '">' + t + '</button>').join('') + '</div>' +
    '<label class="opt"><input type="checkbox" class="wcskip"' + (load('wc:skip', true) ? ' checked' : '') + '> 覚えた語は出さない</label></div>';
  if(wc.i >= wc.queue.length){
    box.innerHTML = '<div class="wcbox">' + head + '<div class="wccard"><div class="wq">おわり</div><div class="wsub">覚えた ' + wc.got + ' 語・もう一度 ' + wc.again + ' 回</div></div>' +
      '<div class="wcbtns"><button class="wcredo">もう一度はじめから</button><button class="primary wcclose">閉じる</button></div></div>';
    return;
  }
  const e = wc.queue[wc.i], pic = wordPic(e.w);
  const img = pic ? '<img src="' + pic + '" alt="">' : '';
  const vi = '<div class="' + (dir === 'vi' ? 'wq' : 'wa vi') + '" lang="' + LP.code + '">' + esc(e.w) + '</div>';
  // 日本語を表に出すときは、答えのベトナム語が混ざらないように：最初の意味だけ・ローマ字の入ったかっこは外す（例「日；時の名詞（mỗi ngày）」→「日」）
  const jaShort = e.ja.split(/[；;]/)[0].replace(/[（(][^）)]*[A-Za-zÀ-ỹ][^）)]*[）)]/g, '').trim() || e.ja;
  const ja = '<div class="' + (dir === 'ja' ? 'wq' : 'wa') + '" lang="ja">' + esc(dir === 'ja' ? jaShort : e.ja) + '</div>';
  const front = dir === 'vi' ? vi : (img + ja);
  const back = dir === 'vi' ? (img + ja) : vi;
  box.innerHTML = '<div class="wcbox">' + head +
    '<div class="wccard">' + front + (wc.flipped ? back : '<div class="wsub">' + (dir === 'vi' ? '日本語で言ってから、めくる' : LP.name + 'で言ってから、めくる') + '</div>') + '</div>' +
    '<div class="wcbtns">' + (wc.flipped
      ? '<button class="wcagain">もう一度</button><button class="primary wcgot">覚えた</button><button class="wcplay">▶ 音</button>'
      : '<button class="primary wcflip">めくる</button>' + (dir === 'vi' ? '<button class="wcplay">▶ 音</button>' : '')) + '</div>' +
    '<div class="wckeys">space：めくる　→：覚えた　←：もう一度　esc：閉じる</div></div>';
  if(dir === 'vi' && !wc.flipped && wc.autoplay !== wc.i){ wc.autoplay = wc.i; sayWord(e.w); }   // ベトナム語の向きは、表を出したときに音も鳴らす
}
function cardAct(a){
  if(!wc) return;
  const e = wc.queue[wc.i];
  if(a === 'flip'){ if(wc.i >= wc.queue.length) return; wc.flipped = true; if(load('wc:dir', 'vi') === 'ja') sayWord(e.w); }
  else if(a === 'got' && wc.flipped){ const k = wknown(); if(!k.has(e.w)){ k.add(e.w); save('wknown:' + bookId, [...k]); emit('wk', {b: bookId, w: e.w, on: true}); } wc.got++; wc.i++; wc.flipped = false; }
  else if(a === 'again' && wc.flipped){ wc.queue.push(e); wc.again++; wc.i++; wc.flipped = false; }
  paintCards();
}
document.addEventListener('click', e => {
  const b = e.target.closest('#wcard button, #wcard input'); if(!b || !wc) return;
  if(b.classList.contains('wcclose')) closeCards();
  else if(b.classList.contains('wcflip')) cardAct('flip');
  else if(b.classList.contains('wcgot')) cardAct('got');
  else if(b.classList.contains('wcagain')) cardAct('again');
  else if(b.classList.contains('wcplay')) sayWord(wc.queue[wc.i].w);
  else if(b.classList.contains('wcdir')){ save('wc:dir', b.dataset.d); wc.flipped = false; wc.autoplay = -1; paintCards(); }
  else if(b.classList.contains('wcredo')) openCards(wc.li);
  else if(b.classList.contains('wcskip')){ save('wc:skip', b.checked); openCards(wc.li); }
});
document.addEventListener('keydown', e => {
  if(!wc || $('#wcard').hidden) return;
  if(e.key === 'Escape'){ e.preventDefault(); closeCards(); }
  else if(e.key === ' '){ e.preventDefault(); e.stopPropagation(); wc.flipped ? sayWord(wc.queue[wc.i].w) : cardAct('flip'); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); e.stopPropagation(); cardAct('got'); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); e.stopPropagation(); cardAct('again'); }
}, true);

/* 課の手引き：本文を聴く前に読む（2026-10-04 本人「メインの音声を聞いて練習問題をする前に、必要な文法とか単語とかの基本的な解説」
   「どういう順番でやれば正解なのか、説明してない単語はどれなのか」）。
   ⭕ guide.json（教材のフォルダ・公開しない）。説明は教科書の文を写さず自分の言葉で。★＝本文に出るのに教科書の単語欄に無い語 */
function guideHTML(id){
  const g = guide[id]; if(!g) return '';
  const tr = list => list && list.length ? '<div class="ltracks">' + list.map(t => '<button class="lt' + (done.has(t) ? ' heard' : '') + '" data-t="' + esc(t) + '"><span>' + esc(trackLabel(t)) + '</span><small>' + (done.has(t) ? '聴いた' : '聴く') + '</small></button>').join('') + '</div>' : '';
  const nNew = (g.words || []).filter(w => w.mark === 'new').length;
  return '<details class="lstep lguide"' + (load('guide:open', false) ? ' open' : '') + '><summary class="lsh"><span class="num">0</span><b>聴く前に</b><span class="ct">この課の要点と進め方<svg class="ic gcaret" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></span></summary>' +
    (g.goal ? '<p class="ggoal">' + esc(g.goal) + '</p>' : '') +
    (g.points && g.points.length ? '<div><h4>文法の要点</h4><div class="lguide">' + g.points.map(p => '<div class="gpt"><b>' + esc(p.title) + '</b><p lang="ja">' + esc(p.body) + '</p></div>').join('') + '</div></div>' : '') +
    (g.words && g.words.length ? '<div><h4>初めて出る語（' + g.words.length + '語' + (nNew ? '・★ 教科書の単語欄に無い語 ' + nNew : '') + '）</h4><div class="gwords">' +
      g.words.map(w => '<span class="gw' + (w.mark === 'new' ? ' new' : '') + '" lang="' + LP.code + '">' + (w.mark === 'new' ? '★ ' : '') + esc(w.w) + (w.ja ? '<small lang="ja">' + esc(w.ja) + '</small>' : '') + '</span>').join('') + '</div></div>' : '') +
    (g.steps && g.steps.length ? '<div><h4>進め方</h4><ol>' + g.steps.map(st => '<li>' + esc(st.text) + tr(st.tracks) + '</li>').join('') + '</ol></div>' : '') +
    (g.fixes && g.fixes.length ? '<div class="gfix"><b>文字起こしの聞き違い：</b>' + g.fixes.map(f => esc(f.heard) + ' → <b>' + esc(f.should) + '</b>（' + esc(f.note) + '）').join('　') + '</div>' : '') +
    '</details>';
}
document.addEventListener('toggle', e => { if(e.target.classList && e.target.classList.contains('lguide')) save('guide:open', e.target.open); }, true);   // 開け閉めは覚えておく

/* 音声の名前を、何の音声かが分かる言葉に（cơ sở のファイル名の型だけ。ほかは名前のまま） */
function trackLabel(name){
  const m = name.match(/(Phat am|Hoi ?thoai|Nghe|Doc)\s*(\d*)/i);
  if(!m) return name.replace(/\.[^.]+$/, '');
  const k = {'phat am': '発音', 'hoithoai': '会話', 'hoi thoai': '会話', 'nghe': '聞き取り', 'doc': '読み物'}[m[1].toLowerCase()] || m[1];
  return k + (m[2] ? ' ' + m[2] : '');
}

/* 聴く画面：いまの音声がどの課の何か。問題の音声なら、その場で印を付けられる */
function lessonOfTrack(name){
  const ld = lessonData();
  const li = ld.findIndex(x => x.tracks.some(t => t.name === name));
  if(li < 0) return null;
  const ex = (paperDefs()[ld[li].L.id] || []).find(e => (e.tracks || []).includes(name));
  return {li, L: ld[li].L, ex};
}
function paintLtag(){
  const box = $('#ltag');

  box.hidden = false;
  box.classList.add('slim');   // いつも細い1行（紙の問題の印の欄はやめた・2026-10-04。問題は「練習」で解く）
  box.innerHTML = '<div class="lth"><span class="pill">' + esc(hit.L.title) + '</span><span>' + esc(hit.ex ? hit.ex.label : trackLabel(tracks[idx].name)) + '</span>' +
    (hit.ex ? '<button class="linkish gopractice" data-lesson="' + esc(hit.L.id) + '">この問題を練習で解く</button>' : '') +
    '<button class="linkish golesson" data-lesson="' + esc(hit.L.id) + '">課の画面へ<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button></div>';
}

function openTrack(name){
  const i = tracks.findIndex(t => t.name === name);

/* ================= 記録の連動（2026-10-02） =================
   本人「これってデータって連動できたりするの？」→「それで行こうか」。
   ⭕ 記録は「出来事を足していくだけ」。端末ごとに別のファイル（記録/<端末>.jsonl）へ書き、開くときに全部を読んで合わせる。
      同じファイルを2つの端末から書き換えないので、iCloud の同期のぶつかり合いで消えない。
   ⭕ 箱（覚えた具合）は保存せず、答えた出来事を時刻順に並べ直して数え直す。端末が2つでも同じ答えになる。
   ⭕ 設定（速度・画面の選択）は端末ごと。連動しない。
   ⭕ フォルダを選んでいないときは今と同じ（ブラウザの中だけ）。選んだときに、それまでの分をまとめて書く。
   実現方式：vault 008_project/AppBuilding/specs/20261001_oto-drill-app_実現方式.md 「★ 決まったこと」 */
const DEV = (()=>{ let d = load('dev', null); if(!d){ d = 'web-' + Math.random().toString(36).slice(2, 7); save('dev', d); } return d; })();
let evOwn = load('ev:own', []);      // この端末の出来事（全部）
let evOthers = [];                    // ほかの端末の出来事（フォルダから読んだもの）
let evPend = load('ev:pend', [])  ;   // まだフォルダに書いていない出来事の id

function emit(k, data){
  const e = Object.assign({id: DEV + '.' + Date.now().toString(36) + '.' + (evSeq++), t: Date.now(), dev: DEV, k}, data);
  evOwn.push(e); evPend.push(e.id);

/* 前からある記録を、一度だけ出来事に直す */
(function migrate(){
  if(load('ev:migrated', false)) return;
  // 移す前の記録を丸ごと控える（組み直しで何かを落としても戻せるように）
  const snap = {}; for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k.startsWith('otodrill:')) snap[k] = localStorage.getItem(k); }
  try{ localStorage.setItem('otodrill-backup:before-sync', JSON.stringify({at: new Date().toISOString(), keys: snap})); }catch(e){}
  const out = [];
  const add = (t, k, d) => out.push(Object.assign({id: DEV + '.m' + out.length, t: t || 0, dev: DEV, k}, d));
  (load('hist', []) || []).forEach(h => add(h[0], 'ans', {i: h[1], s: h[2], o: h[3], g: h[2] === 'type' ? 2 : 1}));
  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i); if(!key.startsWith('otodrill:')) continue;
    const k = key.slice(9), v = load(k, null), m = k.match(/^(paper|paperdef|excount|wknown|kept|done):(.+)$/);
    if(!m || !v) continue;
    const id = m[2];
    if(m[1] === 'paper') v.forEach(r => add(r.t, 'paper', {b: id, l: r.l, ex: r.ex, n: r.n, r: r.r}));
    if(m[1] === 'paperdef') Object.entries(v).forEach(([l, ds]) => ds.forEach(d => add(0, 'exdef', {b: id, l, d})));
    if(m[1] === 'excount') Object.entries(v).forEach(([ex, n]) => add(0, 'excnt', {b: id, ex, v: n}));
    if(m[1] === 'wknown') v.forEach(w => add(0, 'wk', {b: id, w, on: true}));
    if(m[1] === 'kept') v.forEach(x => add(0, 'keep', {f: id, v: x}));
    if(m[1] === 'done') v.forEach(n => add(0, 'done', {f: id, n}));
  }
  const ty = load('typed', []); if(ty.length) add(0, 'typed', {w: ty});
  evOwn = out.concat(evOwn); evPend = evOwn.map(e => e.id);
  save('ev:own', evOwn); save('ev:pend', evPend); save('ev:migrated', true);
})();

/* 出来事から記録を組み直す（全部の端末ぶん） */
function rebuild(){
  const seen = new Set(), all = [];
  evOwn.concat(evOthers).forEach(e => { if(e && e.id && !seen.has(e.id)){ seen.add(e.id); all.push(e); } });
  all.sort((a, b) => a.t - b.t || (a.id < b.id ? -1 : 1));
  const S = {}, H = [], TY = new Set(), P = {}, PD = {}, EC = {}, WK = {}, KP = {}, DN = {};
  for(const e of all){
    if(e.k === 'ans'){
      const r = S[e.i] || {box: 0, due: 0, seen: 0, miss: 0};
      r.seen++;
      if(e.o){ r.box = Math.min(MAXBOX, r.box + (e.g || 1)); } else { r.box = 0; r.miss++; }
      r.due = e.t + WAIT[r.box]; r.last = e.t; S[e.i] = r;
      H.push([e.t, e.i, e.s, e.o]);
    }
    else if(e.k === 'typed') e.w.forEach(w => TY.add(w));
    else if(e.k === 'paper') (P[e.b] = P[e.b] || []).push({l: e.l, ex: e.ex, n: e.n, r: e.r, t: e.t});
    else if(e.k === 'exdef'){ const o = PD[e.b] = PD[e.b] || {}; (o[e.l] = o[e.l] || []).some(d => d.id === e.d.id) || o[e.l].push(e.d); }
    else if(e.k === 'excnt') (EC[e.b] = EC[e.b] || {})[e.ex] = e.v;
    else if(e.k === 'wk'){ const z = WK[e.b] = WK[e.b] || new Set(); e.on ? z.add(e.w) : z.delete(e.w); }
    else if(e.k === 'keep'){ const z = KP[e.f] = KP[e.f] || []; z.some(x => x.form === e.v.form && x.sentence === e.v.sentence) || z.push(e.v); }
    else if(e.k === 'done') (DN[e.f] = DN[e.f] || new Set()).add(e.n);
  }
  srs = S; hist = H.slice(-20000); typed = TY;
  save('srs', srs); save('hist', hist); save('typed', [...typed]);
  Object.entries(P).forEach(([b, v]) => save('paper:' + b, v));
  Object.entries(PD).forEach(([b, v]) => save('paperdef:' + b, v));
  Object.entries(EC).forEach(([b, v]) => save('excount:' + b, v));
  Object.entries(WK).forEach(([b, v]) => save('wknown:' + b, [...v]));
  Object.entries(KP).forEach(([f, v]) => save('kept:' + f, v));
  Object.entries(DN).forEach(([f, v]) => save('done:' + f, [...v]));
  if(folderKey){ kept = load('kept:' + folderKey, []); done = new Set(load('done:' + folderKey, [])); }
  recInfo.read = all.length;
}

async function recFolder(create){
  if(!recDir) return null;

async function flushEvents(){
  if(!recDir || !evPend.length) return;
  try{
    const dir = await recFolder(true);
    const fh = await dir.getFileHandle(DEV + '.jsonl', {create: true});
    const file = await fh.getFile();
    const w = await fh.createWritable({keepExistingData: true});
    await w.seek(file.size);
    const pend = new Set(evPend);
    await w.write(evOwn.filter(e => pend.has(e.id)).map(e => JSON.stringify(e)).join('\n') + '\n');
    await w.close();
    evPend = []; save('ev:pend', evPend);
    recInfo.wrote = Date.now(); recInfo.err = '';
  }catch(e){ recInfo.err = '書けませんでした（' + e.name + '）'; }
  paintRecInfo();
}
async function readOthers(){
  if(!recDir) return;
  try{
    const dir = await recFolder(true);
    const evs = [], devs = [];
    for await (const [name, h] of dir.entries()){
      if(h.kind !== 'file' || !name.endsWith('.jsonl')) continue;
      devs.push(name.replace(/\.jsonl$/, ''));
      if(name === DEV + '.jsonl') continue;
      const text = await (await h.getFile()).text();
      text.split('\n').forEach(line => { if(line.trim()){ try{ evs.push(JSON.parse(line)); }catch(e){} } });
    }
    evOthers = evs; recInfo.devices = devs; recInfo.err = '';
  }catch(e){ recInfo.err = '読めませんでした（' + e.name + '）'; }
}

    '<label>文の間<select id="flowGap">' + [1, 2, 4].map(n => '<option' + (o.gap === n ? ' selected' : '') + ' value="' + n + '">' + n + '秒</option>').join('') + '</select></label>' +
    '<label class="opt"><input type="checkbox" id="flowJa"' + (o.ja ? ' checked' : '') + '> 訳を出す</label>' +

  p.querySelectorAll('.flowrange button').forEach(b => b.onclick = () => { const n = keep(); n.range = b.dataset.r; save('flow:opt', n); openFlow(true); });
  p.querySelectorAll('.flowunits input, .flowopts select, .flowopts input').forEach(i => i.onchange = keep);
  const go = (ids, all, from) => {
    const n = keep();
    const queue = ld.map((x, li) => (all || ids.has(x.L.id)) ? flowItems(li, n.kind).map(it => ({it, title: x.L.title})) : []).flat();
    if(!queue.length){ toast('課を1つ以上選んでください'); return; }
    audio.pause(); clearTimeout(gapTimer);

  const rb = $('#flowResume'); if(rb) rb.onclick = () => go(null, true, load('flow:pos', {}).i || 0);

}
/* 画面の下の操作卓から：1文ずつ聴いているあいだは、再生・前・次が文単位で効く */
function flowToggle(){ flow.paused = !flow.paused; if(flow.paused){ clip.pause(); clearTimeout(flow.timer); clearInterval(flow.poll); } else flowStep(); paintFlow(); }
function flowGo(d){ clearTimeout(flow.timer); clearInterval(flow.poll); flow.r = 0; flow.i = Math.max(0, Math.min(flow.i + d, flow.queue.length)); flow.paused = false; flowStep(); }
function stopFlow(){ if(!flow) return; clearTimeout(flow.timer); clearInterval(flow.poll); clip.pause(); flow = null; setPlayLabel(!audio.paused); }
function flowStep(){
  if(!flow) return;
  if(flow.i >= flow.queue.length){
    if(flow.opt.loop){ flow.i = 0; flow.r = 0; }
    else { const done = flow.queue.length; if(flow.all) save('flow:pos', null); stopFlow(); openFlow(true); toast(done + '文を聴き終えました'); return; }
  }
  if(flow.all) save('flow:pos', {kind: flow.opt.kind, all: true, i: flow.i});   // 通しで聴くときは、どこまで聴いたかを覚える
  const {it} = flow.queue[flow.i];
  paintFlow();
  let started = false, waited = 0;
  clearInterval(flow.poll);
  say(it);
  flow.poll = setInterval(() => {
    if(!flow || flow.paused) return;
    waited += 100;
    if(!clip.paused) started = true;
    if((started && clip.paused) || (!started && waited > 6000)){   // 鳴り終えた（6秒たっても始まらなければ飛ばす）
      clearInterval(flow.poll);
      flow.timer = setTimeout(() => {
        if(!flow) return;
        if(++flow.r >= flow.opt.n){ flow.r = 0; flow.i++; }
        flowStep();
      }, flow.opt.gap * 1000);
    }
  }, 100);
}
function paintFlow(){
  const p = $('#flowPanel'); if(!flow) return;
  setPlayLabel(!flow.paused);
  const {it, title} = flow.queue[Math.min(flow.i, flow.queue.length - 1)];
  const ja = flow.opt.ja ? jaOf(it) : null;
  p.innerHTML = FLOWHEAD +
    '<div class="apctx">' + esc(title) + '　' + FLOWNAME[flow.opt.kind] + '　' + (flow.i + 1) + ' / ' + flow.queue.length + (flow.opt.n > 1 ? '　' + (flow.r + 1) + '回目' : '') + (flow.paused ? '　一時停止中' : '') + '</div>' +
    '<div class="jbar"><i style="width:' + ((flow.i) / flow.queue.length * 100) + '%"></i></div>' +
    '<div class="flownow" lang="' + LP.code + '">' + esc(it.show) + '</div>' + (ja ? '<div class="flowja" lang="ja">' + esc(ja) + '</div>' : '') +
    '<div class="apctx">再生・前・次は画面の下で。5秒戻すは今の文をもう一度。閉じても流れ続けます</div>' +
    '<button class="linkish" id="flowStop">やめて選び直す</button>';
  p.querySelector('.apclose').onclick = () => openFlow(false);
  $('#flowStop').onclick = () => { stopFlow(); openFlow(true); };
}

/* ================= これどういうこと？と質問帳（2026-10-02） =================

   ⭕ AI は自分の知識ではなく「材料（文・訳・語・文法メモ）の範囲で」答えさせる（材料ありで 10問中10問、なしは大きく崩れた：AITeam_モデル台帳）。

const AI_LOCAL = 'http://localhost:8791/v1/chat/completions';
/* 同じ場所の枠に埋め込まれ、外側が oto.ask を持っていればそれで聞く（jibun-kyozai の学ぶ面・2026-10-04 段5） */
try{ if(!window.oto && window.parent !== window && window.parent.oto && typeof window.parent.oto.ask === 'function') window.oto = {ask: (s, u) => window.parent.oto.ask(s, u)}; }catch(e){}
let aiBackend = null;            // 'app' | 'local' | null

const onLocalhost = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
/* ⭕ 開いたときに AI がまだ起きていなくても、あとで起きたら気づく（2026-10-03 本人「連動中にはなるけど AI につながっていませんと言われる」） */
async function detectAI(){

  try{
    const c = new AbortController(); setTimeout(()=> c.abort(), 1500);

function material(ctx){
  const lines = ['文：' + ctx.text];
  if(ctx.ja) lines.push('訳：' + ctx.ja);
  if(ctx.words && ctx.words.length) lines.push('語：' + ctx.words.map(([w, j]) => w + '＝' + j).join('／'));
  (ctx.notes || []).forEach(n => lines.push('文法メモ：' + (n.title ? n.title + '：' : '') + n.body));
  return lines.join('\n');
}
/* 考えているあいだ、右下の球の中で玉と弧が回る */
async function aiAsk(ctx, question, history, onDelta){
  const fab = document.getElementById('askFab'); fab && fab.classList.add('thinking');
  try{ return await aiAskRaw(ctx, question, history, onDelta); } finally { fab && fab.classList.remove('thinking'); }
}
/* 先生の手引き（lang/<言語>.guide.json）：質問と文に出る語で関係する項目を選んで渡す
   ⭕ 2026-10-03 本人「材料にはない文とか言ってくるから、ベトナム語の文法とか表現のデータベースをちゃんと理解して、先生というかコーチのように答えて」。
   ⛔ 手引きなしで知識だけに任せると崩れた（AITeam_モデル台帳）ので、知識で答えさせつつ手引きで支える */
const guides = {};
async function guideOf(code){
  const url = LP.ai && LP.ai.guide; if(!url) return [];
  if(!guides[code]){ try{ guides[code] = (await (await fetch(url)).json()).entries || []; }catch(e){ guides[code] = []; } }
  return guides[code];
}
async function pickGuide(ctx, question, history){
  const es = await guideOf(LP.code);
  const q = question + ' ' + (history || []).slice(-1).map(h => h.q).join(' ');
  const mv = matchable(q + ' ' + (ctx.text || ''));
  const score = e => e.keys.reduce((n, k) => n + (/[ぁ-んァ-ヶ一-龠]/.test(k) ? (q.includes(k) ? 2 : 0) : (mv.includes(' ' + k.toLowerCase() + ' ') ? (q.toLowerCase().includes(k.toLowerCase()) ? 3 : 1) : 0)), 0);
  return es.map(e => [score(e), e]).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 4).map(x => x[1]);
}
async function aiAskRaw(ctx, question, history, onDelta){
  const coach = (LP.ai && LP.ai.coach) || (LP.name + 'の先生');
  // 段5：その課までの範囲で、短く。「くわしく」のときだけ長く（2026-10-04 仕様「答えの大きさをそろえる」）
  const sc = scopeOf(ctx.li), more = ctx.mode === 'more';
  const size = more ? '前の答えをくわしく、6〜10行で答えます（1行は40字くらいまで）。前置き・お礼・まとめの言い直しは書きません。必要なら' + LP.name + 'の例文を2〜3つ、訳を付けて添えます。'
    : sc ? '要点から短く答えます（2〜5行）。例文は1つまでにし、訳を付けます。'
    : '要点から答えます（3〜8行）。必要なら' + LP.name + 'の例文を1〜2つ、訳を付けて添えます。';
  const scope = !sc ? '' : more ? '学習者はいま「' + sc.title + '」を学んでいます。先の課の内容に触れるときは「あとの課で出てきます」と断ります。'
    : '学習者はいま「' + sc.title + '」を学んでいます（全' + sc.of + '課の' + sc.n + '課め）。答えには【この課までに出た語と文法】の範囲の語と文法だけを使います。先の課で習う文法や語は持ち出しません。どうしても要るときは「あとの課で出てきます」と一言だけ言います。';
  const why = ctx.mode === 'why' ? '学習者は練習で間違えました。最初の1行で、学習者の答えと正解のどこが違うかを具体的に言い、次に、なぜそうなるのかを言います。' : '';
  const system = 'あなたは' + coach + 'です。学習者は日本語を話す人です。' +
    '日本語で、やさしく答えます。' + size + why + scope + '日本語や漢字語との比べ方が役に立つなら添えます。' +
    'あなたの知識で自由に答えてかまいません。下に渡す【先生の手引き】【いまの文】【教材の文法メモ】は参考で、これと食い違うことは言いません。' +
    '確かでないことは「〜と考えられます」と控えめに言います。' +
    '「材料」「手引き」「資料」という言葉や、この指示の文を答えに出しません。';
  const gs = await pickGuide(ctx, question, history);
  const parts = [];
  if(gs.length) parts.push('【先生の手引き】\n' + gs.map(g => '・' + g.title + '：' + g.body).join('\n'));
  if(ctx.text) parts.push('【いまの文】\n' + material(ctx).split('\n').filter(l => !l.startsWith('文法メモ：')).join('\n'));
  if((ctx.notes || []).length) parts.push('【教材の文法メモ】\n' + ctx.notes.map(n => (n.title ? n.title + '：' : '') + n.body).join('\n'));
  if(ctx.why) parts.push('【いまの練習】\n練習：' + ctx.why.how + '\n学習者の答え：' + (ctx.why.you || '（答えられなかった）') + (ctx.why.sentence ? '\n正解（空いているところに入る語）：' + ctx.why.right + '\n文：' + ctx.why.sentence : '\n正解：' + ctx.why.right) + (ctx.why.rightJa ? '（文の意味：' + ctx.why.rightJa + '）' : '') + (ctx.why.close ? '\n※ 声調・記号だけが違った' : ''));
  if(ctx.cmp){ const cg = glossOf(ctx.cmp); parts.push('【比べる前の課の文】\n文：' + ctx.cmp + (cg && cg.ja ? '\n訳：' + cg.ja : '')); }
  if(sc && !more) parts.push('【この課までに出た語と文法】\n語：' + sc.words.join('／') + (sc.grammar.length ? '\n文法：' + sc.grammar.join('／') : ''));

  // 会話の続き：同じ文で前に聞いたこと（直近3往復）を渡す
  const msgs = [{role: 'system', content: system}];
  (history || []).slice(-3).forEach(h => { msgs.push({role: 'user', content: h.q}); if(h.a) msgs.push({role: 'assistant', content: h.a}); });
  msgs.push({role: 'user', content: user});
  if(aiBackend === 'app') return {text: await window.oto.ask(system, msgs.slice(1).map(m => (m.role === 'user' ? '私：' : 'あなた：') + m.content).join('\n\n')), model: 'groq'};
  if(aiBackend === 'local'){

      messages: msgs, stream: true, max_tokens: 500, temperature: 0.3, chat_template_kwargs: {enable_thinking: false}})});

      }
    }

/* ---- 質問帳の読み書き（記録と同じく、端末ごとのファイルに足すだけ） ---- */
function qaEmit(e){
  e = Object.assign({id: DEV + '.q' + Date.now().toString(36) + (evSeq++), t: Date.now(), dev: DEV, lang: LP.code}, e);
  qaOwn.push(e); qaPend.push(e.id); save('qa:own', qaOwn); save('qa:pend', qaPend);
  flushQA();
  return e;
}
async function qaDir(lang){
  if(!recDir) return null;
  const d = await recDir.getDirectoryHandle('質問帳', {create: true});
  return await d.getDirectoryHandle(lang, {create: true});
}
async function flushQA(){
  if(!recDir || !qaPend.length) return;
  try{
    const pend = new Set(qaPend);
    const byLang = {};
    qaOwn.filter(e => pend.has(e.id)).forEach(e => (byLang[e.lang] = byLang[e.lang] || []).push(e));
    for(const [lang, es] of Object.entries(byLang)){
      const fh = await (await qaDir(lang)).getFileHandle(DEV + '.jsonl', {create: true});
      const f = await fh.getFile(); const w = await fh.createWritable({keepExistingData: true});
      await w.seek(f.size); await w.write(es.map(e => JSON.stringify(e)).join('\n') + '\n'); await w.close();
    }
    qaPend = []; save('qa:pend', qaPend);
  }catch(e){ recInfo.err = '質問帳に書けませんでした（' + e.name + '）'; paintRecInfo(); }
}
async function readQA(){
  if(!recDir) return;
  try{
    const d = await qaDir(LP.code), out = [];
    for await (const [name, h] of d.entries()){
      if(h.kind !== 'file' || !name.endsWith('.jsonl') || name === DEV + '.jsonl') continue;
      (await (await h.getFile()).text()).split('\n').forEach(l => { if(l.trim()){ try{ out.push(JSON.parse(l)); }catch(e){} } });
    }
    qaOthers = out;
  }catch(e){}
}
/* この文について聞いたことと、その答え（確かめた答えがあればそれを先に） */
function qaFor(text){
  const all = qaOwn.concat(qaOthers);
  const answers = {};
  all.filter(e => e.k === 'a').forEach(a => { answers[a.qid] = a; });
  const later = {};   // 答え待ちだった問いに、あとから AI が答えたもの
  all.filter(e => e.k === 'ai').forEach(a => { later[a.qid] = a; });
  return all.filter(e => e.k === 'q' && e.lang === LP.code && norm(e.text) === norm(text))
    .sort((a, b) => a.t - b.t).map(q => ({q: q.ai || !later[q.id] ? q : Object.assign({}, q, {ai: later[q.id].ai, model: later[q.id].model}), a: answers[q.id] || null}));
}

/* 会話の形：自分の問いは右、答えは左（球の印つき）。答えの段の札は吹き出しの上に小さく */
const ORB_MINI = '<svg class="orb mini" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="url(#orbBase)"/><g clip-path="url(#orbClip)"><path fill="url(#orbA)" d="M6 30c6-14 20-20 30-12s8 22 22 20c2 10-10 22-24 20S0 46 6 30z"/><path fill="url(#orbB)" d="M58 22c-4 14-18 12-26 22S20 62 10 54c10-2 6-16 16-26S52 4 58 22z"/></g><ellipse cx="24" cy="18" rx="14" ry="9" fill="url(#orbShine)"/></svg>';
function bubbleQ(text){ return '<div class="msg me"><div class="bub">' + esc(text) + '</div></div>'; }

        : 'このページは公開版なので、Mac の AI を呼べません。質問は質問帳に残しました。') + 'あとで Claude が確かめて答えます。' +

        : !onLocalhost && !window.oto ? '<a class="askswitch" href="http://localhost:8790/">Mac の AI つきのページで開く</a>' : ''), 'wait'));
}
const THINK_DOTS = '<span class="dots" aria-label="考えています"><i></i><i></i><i></i><i></i></span>';
/* 解説・引いた語の窓の下に出す「これどういうこと？」 */
function askEl(ctx){
  const box = document.createElement('section'); box.className = 'ask';
  const LOCAL_URL = 'http://localhost:8790/';

function lessonIdxOf(id){

/* その課までに出た語と文法の見出し（AI に渡す範囲）。よく出る語から、上限120語 */
const scopeMemo = new Map();
function scopeOf(li){
  if(li == null || li < 0 || !pdata) return null;

  //    49文に出る là が落ちた（2026-10-04・別のモデルの判定で「là は範囲外」と出て分かった）
  const wm = new Map(), cnt = new Map();

/* 自分の答え（練習の種類ごとに持ち方が違う） */

function similarEarlier(ctx){

  const ld = lessonData(), mine = norm(ctx.text), me = new Set(mine.split(' '));
  let best = null, bs = 0;
  for(let i = 0; i < li; i++) for(const s of ld[i].sents){

    if(sim) out.push({k: 'compare', label: '前の課の「' + (sim.length > 24 ? sim.slice(0, 23) + '…' : sim) + '」と何が違う？', q: '前の課の「' + sim + '」と、この文は何が違うの？', sim});

  const last = (past || []).slice(-1)[0];

  let open = true;
  out.forEach(sg => {
    if(sg.kind === 'set' || sg.kind === 'final' || sg.kind === 'drill'){ const b = best[sg.id]; sg.cleared = !!b; sg.stars = b ? b.stars : 0; sg.score = b ? b.score : null; }
    sg.open = sg.free || open || sg.cleared;
    if(!sg.free && !sg.cleared) open = false;    // 練習のステージは前をクリアすると開く
  });
  return out;
}
function chapterState(li, defs, last){
  const sgs = stagesOf(li, defs, last);
  const cl = sgs.filter(s => s.cleared).length;
  return {sgs, cleared: cl, of: sgs.length, all: sgs.length > 0 && cl === sgs.length, stars: sgs.reduce((n, s) => n + (s.stars || 0), 0)};
}

/* ---- 章の道のり（教材の「課を進める」の上に出す） ---- */
function journeyHTML(li, defs, last){
  const cs = chapterState(li, defs, last);
  const cur = cs.sgs.find(s => s.open && !s.cleared && !s.free) || cs.sgs.find(s => !s.cleared);
  let h = '';
  if(run && run.book === bookId && run.stage !== 'review'){   // 今日の復習の続きは、コースの頭に出す
    h += '<div class="resume"><div><b>続きから</b><span>' + esc(run.title) + '　' + run.i + ' / ' + run.queue.length + ' 問</span></div><button class="primary" id="runResume">続きから始める</button></div>';
  }
  const hero = unitPic(lessonData()[li].L.id);
  if(hero) h += '<figure class="uhero"><img src="' + hero + '" alt=""></figure>';
  h += guideHTML(lessonData()[li].L.id);   // 聴く前に：絵の下に、たたんで置く（2026-10-04 本人「折りたためるといい」「最初で画像が見えてる方が見栄えがいい」）
  h += '<section class="journey"><div class="jhead"><b>' + (cs.all ? '課クリア' : 'この課のゴール') + '</b><span>ステージ ' + cs.cleared + ' / ' + cs.of + ' クリア　<span class="starn"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6l1.9 4 4.4.5-3.3 3 .9 4.3L8 11.3l-3.9 2.1.9-4.3-3.3-3 4.4-.5z"/></svg>' + cs.stars + '</span></span></div>' +
    '<div class="jbar"><i style="width:' + (cs.of ? cs.cleared / cs.of * 100 : 0) + '%"></i></div><ol class="jpath">';
  cs.sgs.forEach((sg, k) => {
    const state = sg.cleared ? 'cleared' : !sg.open ? 'locked' : sg === cur ? 'current' : 'open';
    const icon = sg.cleared ? '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>'
      : state === 'locked' ? '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7"/></svg>' : (k + 1);
    const act = state === 'locked' ? '<span class="jlock">前のステージをクリアすると開きます</span>'
      : '<button class="' + (state === 'current' ? 'primary ' : '') + 'jgo" data-stage="' + esc(sg.id) + '">' + (sg.cleared ? 'もう一度' : sg.kind === 'listen' ? '聴く' : sg.kind === 'paper' ? '本で解いて印を付ける' : '始める') + '</button>';
    h += '<li class="jnode ' + state + '"><span class="jdot">' + icon + '</span><div class="jbody"><b>' + esc(sg.title) + (state === 'current' ? '<em>いまここ</em>' : '') + '</b><small>' + esc(sg.sub) +
      (sg.of && !sg.cleared && sg.n ? '　' + sg.n + '/' + sg.of : '') + (sg.score != null ? '　最高 ' + Math.round(sg.score * 100) + '%' : '') + '</small></div>' +
      (sg.cleared ? starHTML(sg.stars) : '') + act + '</li>';
  });
  h += '</ol></section>';
  return h;
}

/* ---- 今日の復習（2026-10-03） ----
   本人「1の今日の復習から進めて」（vault 008_project/AppBuilding/specs/20261003_oto-drill-仮想ユーザー評価.md の案1）。
   課を進めると前の課の問いが出なくなっていた（期限は持っているのに、選んだ組の中でしか回らない）。
   ⭕ 一度でも答えた項目のうち、期限が来たものを全部の課から集めて混ぜる（間隔をあける＋混ぜる）。
   ⭕ 1回は20問まで。期限の古い順に取り、取った分を、同じ組が続かないように混ぜる。
   ⭕ 問いは思い出す形で：発音は聴いて選ぶ、意味があれば日本語から書く、無ければ穴を書く・聴いて書く。 */
const REVIEW_MAX = 20;
const shuffled = a => a.map(v => [Math.random(), v]).sort((p, q2) => p[0] - q2[0]).map(v => v[1]);
function reviewAll(){   // この教材で一度でも答えた項目（文法を使う問いも）
  if(!pdata) return [];
  const seen = new Set(), out = [];
  pdata.decks.forEach(d => d.items.forEach(it => { if(!seen.has(it.id) && srs[it.id] && srs[it.id].seen){ seen.add(it.id); out.push({...it, deck: d}); } }));
  drills.forEach(d => { const id = 'drill:' + d.id; if(srs[id] && srs[id].seen) out.push(drillItem(d)); });
  return out;
}
function reviewDue(){
  const now = Date.now();
  return reviewAll().filter(it => srs[it.id].due <= now).sort((a, b) => srs[a.id].due - srs[b.id].due);
}
function reviewSkill(it){
  if(it.group === 'drill') return it.drill.kind;
  if(isSound(it)) return 'hear';
  if(FILTER.write(it)) return 'write';
  if(FILTER.gap(it)) return 'gap';
  if(typable(it)) return 'type';
  return FILTER.mean(it) ? 'mean' : null;
}
function startReview(){
  const pick = shuffled(reviewDue().slice(0, REVIEW_MAX));
  // 同じ組が続いたら、後ろの違う組と入れ替える（混ぜると見分けが育つ）
  for(let i = 1; i < pick.length; i++){
    if(pick[i].deck.id !== pick[i - 1].deck.id) continue;
    const j = pick.findIndex((x, k) => k > i && x.deck.id !== pick[i - 1].deck.id);
    if(j > 0) [pick[i], pick[j]] = [pick[j], pick[i]];
  }
  const queue = pick.map(it => [it.id, reviewSkill(it)]).filter(x => x[1]);
  if(!queue.length) return;
  run = {book: bookId, stage: 'review', title: '今日の復習', queue, i: 0, res: [], t: Date.now()};
  save('run', run);
  resumeRun();
}
function untilText(t){
  const m = Math.max(1, Math.round((t - Date.now()) / 60e3));
  return m < 60 ? m + '分後' : m < 1440 ? Math.round(m / 60) + '時間後' : Math.round(m / 1440) + '日後';
}
function reviewHTML(){
  if(!pdata) return '';
  if(run && run.book === bookId && run.stage === 'review')
    return '<div class="resume review-card"><div><b>今日の復習：続きから</b><span>' + run.i + ' / ' + run.queue.length + ' 問</span></div><button class="primary" id="runResume">続きから始める</button></div>';
  const all = reviewAll(), due = reviewDue();
  if(due.length) return '<section class="review-card"><div><b>今日の復習　' + Math.min(due.length, REVIEW_MAX) + ' 問</b>' +
    '<span>前に答えた問いのうち、もう一度解く時期が来たものを、全部の課から混ぜて出します' + (due.length > REVIEW_MAX ? '（時期が来たのは ' + due.length + ' 問。1回 ' + REVIEW_MAX + ' 問ずつ）' : '') + '</span></div>' +
    '<button class="primary" id="reviewGo">復習を始める</button></section>';
  if(!all.length) return '<section class="review-card quiet"><div><b>今日の復習</b><span>課の練習で答えた問いが、間をあけてここに戻ってきます</span></div></section>';
  const nx = Math.min(...all.map(it => srs[it.id].due));
  const soon = all.filter(it => srs[it.id].due <= nx + 60 * 60e3).length;
  return '<section class="review-card quiet"><div><b>今日の復習：いま解く時期の問いはありません</b><span>次は ' + untilText(nx) + '　' + soon + ' 問</span></div></section>';
}

/* ---- ステージを始める ---- */
function startStage(stageId){
  const ld = lessonData(), li = ld.findIndex(x => stageId.startsWith(x.L.id + '|'));
  if(li < 0) return;
  const sg = stagesOf(li, paperDefs(), paperLatest()).find(s => s.id === stageId);
  if(!sg) return;
  if(sg.kind === 'listen'){ const t = ld[li].tracks.find(t => !done.has(t.name)) || ld[li].tracks[0]; if(t) openTrack(t.name); return; }
  if(sg.kind === 'paper'){ const el = document.querySelector('#book .lstep.paper-step'); if(el) el.scrollIntoView({block: 'start'}); return; }
  const queue = [];
  const shuffle = a => a.map(v => [Math.random(), v]).sort((p, q2) => p[0] - q2[0]).map(v => v[1]);
  const hardest = it => isSound(it) ? 'hear' : FILTER.gap(it) ? 'gap' : FILTER.mean(it) ? (catOf(it, it.deck) === 'word' ? 'speak' : 'mean') : 'type';
  if(sg.kind === 'set'){
    const its = sg.set.items.map(it => ({...it, deck: sg.set.deck}));
    STEPS[sg.set.cat].forEach(v => shuffle(its.filter(it => !FILTER[v] || FILTER[v](it))).forEach(it => queue.push([it.id, v])));
  }else if(sg.kind === 'drill'){
    shuffle(drillsIn(sg.dk, new Set(ld[li].items.map(i => i.deck.id)))).forEach(d => queue.push(['drill:' + d.id, sg.dk]));
  }else{
    // 課のまとめ：この課から7問（一番難しい練習で）＋前の課から3問（混ぜると見分けが育つ）＋文法を使う問いを2問
    shuffle(ld[li].items).slice(0, 7).forEach(it => queue.push([it.id, hardest(it)]));
    shuffle(ld.slice(0, li).flatMap(x => x.items).filter(it => !isSound(it))).slice(0, 3).forEach(it => queue.push([it.id, hardest(it)]));
    const ids = new Set(ld[li].items.map(i => i.deck.id));
    shuffle(drillsIn('transform', ids).concat(drillsIn('respond', ids))).slice(0, 2).forEach(d => queue.push(['drill:' + d.id, d.kind]));
    queue.splice(0, queue.length, ...shuffle(queue));
  }
  if(!queue.length) return;
  run = {book: bookId, stage: sg.id, title: ld[li].L.title + '　' + sg.title, queue, i: 0, res: [], t: Date.now()};
  save('run', run);
  resumeRun();
}
function resumeRun(){
  if(!run) return;
  runOn = true; q = null;
  setMode('practice');
  runNext();
}
function stopRun(){   // セーブしてやめる（位置は run に残る）
  runOn = false; q = null;
  $('#practice').classList.remove('running');
  if(run && run.stage === 'focus'){ run = run.back || null; save('run', run); }   // この型だけ練習をやめたら、預けた組に戻す
  const lid = run && run.stage !== 'review' ? run.stage.split('|')[0] : null;
  if(lid) goLesson(lid); else setMode('book');
}
function runNext(){
  if(!run) return;
  if(run.i >= run.queue.length){ finishRun(); return; }
  const [id, v] = run.queue[run.i];
  const it = itemById(id);
  if(!it){ run.i++; save('run', run); runNext(); return; }
  pview = v;
  q = makeQ(v, it);
  if(!q){ run.i++; save('run', run); runNext(); return; }
  q.runId = id;
  renderPractice();
}
/* 答えたら1つ進める（mark から呼ぶ） */
function runAnswered(it, ok){
  if(!runOn || !run || !q || q.runId !== it.id) return;
  if(run.res.length > run.i) return;          // 同じ問いで二度数えない
  run.res.push(ok ? 1 : 0); run.i++; save('run', run);
  paintRunbar();
}
function finishRun(){
  const total = run.res.length, ok = run.res.reduce((a, b) => a + b, 0), sc = total ? ok / total : 0, stars = starsOf(sc), cleared = sc >= PASS;
  if(run.stage === 'review'){ finishReview(total, ok); return; }
  if(run.stage === 'focus'){ finishFocus(total, ok); return; }
  if(cleared) emit('stage', {b: run.book, s: run.stage, score: Math.round(sc * 100) / 100, stars});
  const done_ = run; run = null; save('run', null); runOn = false;
  // 次のステージ
  const ld = lessonData(), li = ld.findIndex(x => done_.stage.startsWith(x.L.id + '|'));
  const sgs = li >= 0 ? stagesOf(li, paperDefs(), paperLatest()) : [];
  const nxt = sgs.find(s => s.open && !s.cleared && s.kind !== 'listen' && s.kind !== 'paper' && s.id !== done_.stage);
  const chapterClear = sgs.length && sgs.every(s => s.cleared);
  $('#practice').classList.add('running');
  $('#runbar').hidden = true;
  $('#psets').hidden = true;
  $('#pbody').innerHTML = '<div class="result' + (cleared ? ' ok' : '') + '">' +
    (chapterClear ? '<div class="rchapter">課クリア</div>' : '') +
    '<div class="rtitle">' + esc(done_.title) + '</div>' + starHTML(stars) +
    '<div class="rscore">' + Math.round(sc * 100) + '%<small>' + ok + ' / ' + total + ' 問</small></div>' +
    '<div class="rmsg">' + (cleared ? (stars === 3 ? 'クリア。完璧です。' : 'クリア。') : 'あと少し。' + Math.round(PASS * 100) + '% でクリアです。') + '</div>' +
    '<div class="row">' + (nxt && cleared ? '<button class="primary" id="rnext" data-stage="' + esc(nxt.id) + '">次のステージへ：' + esc(nxt.title) + '</button>' : '') +
    '<button id="rretry" data-stage="' + esc(done_.stage) + '"' + (!cleared ? ' class="primary"' : '') + '>もう一度</button><button id="rback">コースに戻る</button></div></div>';
  const bk = () => { $('#practice').classList.remove('running'); };
  const nb = $('#rnext'); if(nb) nb.onclick = () => { bk(); startStage(nb.dataset.stage); };
  $('#rretry').onclick = () => { bk(); startStage(done_.stage); };
  $('#rback').onclick = () => { bk(); goLesson(done_.stage.split('|')[0]); };
}
/* 今日の復習の終わり：クリアや星は付けない（課のステージではない）。間違えた問いは次の復習でまた出る */
function finishReview(total, ok){
  run = null; save('run', null); runOn = false;
  const left = reviewDue().length;
  $('#practice').classList.add('running');
  $('#runbar').hidden = true;
  $('#psets').hidden = true;
  $('#pbody').innerHTML = '<div class="result' + (total && ok === total ? ' ok' : '') + '">' +
    '<div class="rtitle">今日の復習</div>' +
    '<div class="rscore">' + ok + ' / ' + total + '<small>問を思い出せました</small></div>' +
    '<div class="rmsg">' + (ok < total ? '思い出せなかった問いは、復習に残ります。思い出せた問いは、次はもう少し間をあけて出します。' : '次は、もう少し間をあけて出します。') + '</div>' +
    '<div class="row">' + (left ? '<button class="primary" id="rmore">続けて復習する（あと ' + left + ' 問）</button>' : '') +
    '<button id="rback"' + (left ? '' : ' class="primary"') + '>コースに戻る</button></div></div>';
  const bk = () => { $('#practice').classList.remove('running'); };
  const mb = $('#rmore'); if(mb) mb.onclick = () => { bk(); startReview(); };
  $('#rback').onclick = () => { bk(); setMode('book'); };
}
function paintRunbar(){
  const bar = $('#runbar'); if(!bar) return;
  const on = runOn && run;
  $('#practice').classList.toggle('running', !!on);
  // 進めるで解いているあいだは、見出しも「進める」を選んだ表示に
  [...$('#modes').children].forEach(b => b.classList.toggle('on', on ? b.dataset.mode === 'book' : b.dataset.mode === mode));
  bar.hidden = !on;
  if(!on) return;
  const v = run.queue[Math.min(run.i, run.queue.length - 1)][1];
  const steps = [...new Set(run.queue.map(x => x[1]))], si = steps.indexOf(v);
  bar.innerHTML = '<div class="rbtop"><b>' + esc(run.title) + '</b><span>' + (run.stage === 'review' ? '' : 'ステップ ' + (si + 1) + ' / ' + steps.length + '　') + STEPNAME[v] + '</span>' +
    '<button id="runStop">保存してやめる</button></div>' +
    '<div class="rbbar"><i style="width:' + (run.i / run.queue.length * 100) + '%"></i></div><div class="rbnum">' + run.i + ' / ' + run.queue.length + ' 問</div>';
  $('#runStop').onclick = stopRun;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.classList.contains('jgo')) startStage(b.dataset.stage);
  else if(b.id === 'runResume') resumeRun();
  else if(b.id === 'reviewGo') startReview();
});

/* ---- どの画面からでも「AI に聞く」（2026-10-03） ----
   ⭕ いま見ている文（練習の問い・聴いている文）があれば、それを材料に聞く。無ければ文を選ばずに聞く。 */
function currentCtx(){
  // ⛔ 答える前は問いの文を見せない（聞いて選ぶ・書くでは文そのものが答え）
  if(mode === 'practice' && q && q.it && q.it.deck && q.it.deck.kind === 'text') return q.done ? ctxOf(q.it.show, q.it.id) : {text: '', item: null, ja: '', words: [], notes: [], hidden: true};
  if(mode === 'listen' && script && idx >= 0 && tracks[idx] && script[tracks[idx].name] && nowSent >= 0){
    const seg = script[tracks[idx].name].segments[nowSent]; if(seg) return ctxOf(seg.text, null);
  }
  return {text: '', item: null, ja: '', words: [], notes: []};
}
function openAsk(on){
  const p = $('#askPanel');
  if(!on){ p.hidden = true; $('#askFab').setAttribute('aria-expanded', 'false'); return; }
  const ctx = currentCtx();
  p.innerHTML = '<div class="aph"><b>AI に聞く</b><button class="apclose" aria-label="閉じる"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>' +
    '<div class="apctx">' + (ctx.text ? 'いまの文：<b lang="' + LP.code + '">' + esc(ctx.text) + '</b>' + (ctx.ja ? '<small>' + esc(ctx.ja) + '</small>' : '') : (ctx.hidden ? '答えるまで、いまの問いの文は出しません（答えたあとに開くと、その文について聞けます）' : '文を選ばずに聞きます（練習の問いや、聴いている文があれば、それについて聞けます）')) + '</div>';
  p.appendChild(askEl(ctx));
  p.querySelector('.apclose').onclick = () => openAsk(false);
  p.hidden = false; $('#askFab').setAttribute('aria-expanded', 'true');
  setTimeout(()=> { const i = p.querySelector('input'); if(i) i.focus(); }, 0);
}
$('#askFab').addEventListener('click', e => { e.stopPropagation(); openAsk($('#askPanel').hidden); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#askPanel').hidden) openAsk(false); });
/* 操作卓の高さは画面幅で変わる。引いた語の窓が下に潜らないよう、実測して渡す。 */
(function(){
  const dock = $('#dock');
  const set = ()=> document.documentElement.style.setProperty('--_app-dockHeight', dock.offsetHeight + 'px');
  set();
  if(window.ResizeObserver) new ResizeObserver(set).observe(dock);
  else window.addEventListener('resize', set);
})();

window.addEventListener('beforeunload', saveLast);
})();
</script>
