<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音声ドリル</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=LINE+Seed+JP:wght@400;700&display=swap">
<style>
/* 見た目の値の正は vault の 008_project/LanguageVideo/_設計_見た目.md（マインドマップ・Language Video と同じ）。
   静かな少ない色。線で区切らず、余白と薄く広い影で層を分ける。色は「状態」にだけ差す。
   差し色は3つ：青（主たる操作・学習中）／ティール（覚えた）／すみれ（まだ知らない・間違えた）。
   ⛔ 切り替えの選んだ側は青にしない（黒）。⛔ 暖色は「要確認」（惜しい）にだけ使う。
   書体：ベトナム語の文字（ơ ư ạ …）を持つ Be Vietnam Pro と、日本語の LINE Seed JP。
   ⛔ 決めごとの Satoshi・SUIT はベトナム語の文字を持たない（2026-10-01 に確かめた）ので使わない。 */
:root{
  --ui-page-bgColor:#f5f6f8;
  --ui-surface-bgColor:#FFFFFF;
  --ui-surface-muted-bgColor:#f8f9fb;
  --ui-outline-borderColor:#eef0f4;
  --ui-scrollbar-thumb-bgColor:#d3d8e0; --ui-scrollbar-thumb-hover-bgColor:#b6bdc9;
  --ui-outline-muted-borderColor:#eef0f4;
  --ui-text-fgColor:#16181d;
  --ui-text-muted-fgColor:#656a75;
  --ui-text-alt-fgColor:#9ba1ad;
  --ui-primary-color:#2f6bf0;
  --ui-primary-muted-bgColor:#e9f0fe;
  --ui-primary-fgColor:#1f56d6;      /* 青の文字（淡い青の面の上で 5.5:1）。⛔ --ui-primary-color は面・線・点に使い、文字には使わない */
  --ui-primary-bgColor:#2f6bf0;     /* 白い文字を載せる青の面（4.7:1） */
  --ui-primary-onEmphasis-fgColor:#FFFFFF;
  --ui-success-color:#1f9d55;
  --ui-success-fgColor:#177a3e;
  --ui-success-muted-bgColor:#e6f5ec;
  --ui-danger-color:#e5484d;
  --ui-card-shadow:0 1px 2px rgba(20,24,32,.02), 0 14px 38px rgba(20,24,32,.055);
  --ui-card-raised-shadow:0 1px 2px rgba(20,24,32,.02), 0 22px 52px rgba(20,24,32,.08);
  --ui-control-shadow:0 1px 2px rgba(20,24,32,.04), 0 4px 14px rgba(20,24,32,.05);
  --ui-card-radius:16px; --ui-control-radius:12px; --ui-control-sm-radius:8px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ui-page-bgColor:#121418; --ui-surface-bgColor:#1b1e24; --ui-surface-muted-bgColor:#22262d; --ui-outline-borderColor:#2a2f37; --ui-outline-muted-borderColor:#2a2f37;
    --ui-scrollbar-thumb-bgColor:#3a3f4a; --ui-scrollbar-thumb-hover-bgColor:#555b68;
    --ui-text-fgColor:#e8eaee; --ui-text-muted-fgColor:#a0a6b1; --ui-text-alt-fgColor:#6f7581;
    --ui-primary-color:#5b8af4; --ui-primary-muted-bgColor:#1f2a44; --ui-primary-onEmphasis-fgColor:#FFFFFF; --ui-primary-fgColor:#7ea3f7; --ui-primary-bgColor:#2f6bf0;
    --ui-success-color:#3fbf73; --ui-success-fgColor:#6fd69a; --ui-success-muted-bgColor:#15301f; --ui-danger-color:#f0686c;
    --ui-card-shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 38px rgba(0,0,0,.35);
    --ui-card-raised-shadow:0 1px 2px rgba(0,0,0,.3), 0 22px 52px rgba(0,0,0,.45);
    --ui-control-shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ui-page-bgColor:#121418; --ui-surface-bgColor:#1b1e24; --ui-surface-muted-bgColor:#22262d; --ui-outline-borderColor:#2a2f37; --ui-outline-muted-borderColor:#2a2f37;
  --ui-scrollbar-thumb-bgColor:#3a3f4a; --ui-scrollbar-thumb-hover-bgColor:#555b68;
  --ui-text-fgColor:#e8eaee; --ui-text-muted-fgColor:#a0a6b1; --ui-text-alt-fgColor:#6f7581;
  --ui-primary-color:#5b8af4; --ui-primary-muted-bgColor:#1f2a44; --ui-primary-onEmphasis-fgColor:#FFFFFF; --ui-primary-fgColor:#7ea3f7; --ui-primary-bgColor:#2f6bf0;
  --ui-success-color:#3fbf73; --ui-success-fgColor:#6fd69a; --ui-success-muted-bgColor:#15301f; --ui-danger-color:#f0686c;
  --ui-card-shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 38px rgba(0,0,0,.35);
  --ui-card-raised-shadow:0 1px 2px rgba(0,0,0,.3), 0 22px 52px rgba(0,0,0,.45);
  --ui-control-shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
/* スクロールバー：灰色の溝を消し、つまみだけ細く丸く（本人 2026-09-03 mindmap・2026-10-03 音声ドリル。UI の規格 20） */
*{scrollbar-width:thin; scrollbar-color:var(--ui-scrollbar-thumb-bgColor) transparent}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ui-scrollbar-thumb-bgColor); border-radius:999px; border:3px solid transparent; background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ui-scrollbar-thumb-hover-bgColor); background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{
  margin:0;
  background:var(--ui-page-bgColor);
  color:var(--ui-text-fgColor);
  font-family:var(--_lang-fontFamily,'Be Vietnam Pro'),'LINE Seed JP','Hiragino Sans',system-ui,sans-serif;
  font-size:14px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.app{height:100dvh; overflow:hidden; display:flex; flex-direction:column}

.eyebrow{
  font-family:inherit;
  font-size:11px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ui-text-muted-fgColor);
}

/* ---- ヘッダー ---- */
header{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:16px 24px;
  background:var(--ui-surface-bgColor);
  border-bottom:1px solid var(--ui-outline-borderColor);
}
.wordmark{display:flex; align-items:baseline; gap:12px}
.wordmark b{font-size:15px; font-weight:600; letter-spacing:.04em}
.folder{
  margin-left:auto; color:var(--ui-text-muted-fgColor); font-size:12px; text-align:right;
  display:flex; align-items:center; gap:8px;
}
.folder .name{
  font-family:inherit;
  color:var(--ui-text-fgColor); font-size:12px;
}

button{
  font:inherit; font-size:13px;
  color:var(--ui-text-fgColor); background:var(--ui-surface-bgColor);
  border:1px solid var(--ui-outline-borderColor); border-radius:6px;
  padding:8px 12px; cursor:pointer;
  transition:border-color .12s, background .12s, color .12s;
}
button:hover{border-color:var(--ui-text-muted-fgColor)}
button:focus-visible{outline:2px solid var(--ui-primary-color); outline-offset:2px}
button.primary{
  background:var(--ui-primary-bgColor); border-color:var(--ui-primary-color); color:var(--ui-primary-onEmphasis-fgColor); font-weight:500;
}
button.primary:hover{filter:brightness(1.07)}
button.on{background:var(--ui-primary-muted-bgColor); border-color:var(--ui-primary-color); color:var(--ui-primary-fgColor); font-weight:600}

/* ---- 本体 ---- */
main{flex:1; display:grid; grid-template-columns:minmax(0,1fr) 352px; min-height:0}
@media (max-width:820px){
  main{grid-template-columns:1fr; grid-template-rows:minmax(0,1.4fr) minmax(148px,1fr)}
}

.panel{
  padding:32px 32px 24px; display:flex; flex-direction:column; gap:28px;
  min-width:0; min-height:0; overflow-y:auto;
}

/* 一覧をたたむ。閉じたら中身を消す。 */
.app.list-off #filter,
.app.list-off ol,
.app.list-off .ledger-empty{display:none}

/* 広いとき：右の列ごと消して、本体を広げる（幅を取るのが困るので） */
@media (min-width:821px){
  .app.list-off aside{display:none}
  .app.list-off main{grid-template-columns:minmax(0,1fr)}
  #foldList{display:none}
}
/* 狭いとき：下にたたむ。開ける手掛かりを画面の下に残す
   （窓を半分にして教科書と並べて使うため、下が一番手が届く） */
@media (max-width:820px){
  #toggleList{display:none}
  .app.list-off main{grid-template-rows:minmax(0,1fr) auto}
  .app.list-off aside{border-top:1px solid var(--ui-outline-borderColor)}
}

.caret{margin-right:8px; display:inline-flex; align-items:center; vertical-align:-2px; transition:transform .12s}
.caret .ic{width:14px; height:14px}
.app.list-off .caret{transform:rotate(-90deg)}

/* 一覧の頭に置く開け閉め。閉じているときは、この帯ごと押せるようにする。 */
button.fold{
  border:0; background:transparent; color:var(--ui-text-muted-fgColor);
  padding:4px 8px; font-size:12px; white-space:nowrap; flex:none;
  display:flex; align-items:center;
}
button.fold:hover{color:var(--ui-text-fgColor); border-color:transparent}
.app.list-off button.fold{flex:1; justify-content:flex-start}

/* 計器 */
.readout{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap}
.bignum{
  font-family:inherit;
  font-size:64px; font-weight:600; line-height:.9; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.oftotal{
  font-family:inherit;
  font-size:15px; color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums;
  padding-bottom:4px;
}
.fname{
  font-size:16px; font-weight:500; word-break:break-all; text-wrap:balance;
  margin-top:12px;
}
.fname.blank{color:var(--ui-text-muted-fgColor); font-weight:400}

/* 進行 */
.track{display:flex; align-items:center; gap:16px}
.clock{
  font-family:inherit;
  font-size:12px; color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums; min-width:42px;
}
.clock.right{text-align:right}
input[type=range]{
  -webkit-appearance:none; appearance:none; flex:1; height:20px; background:transparent; cursor:pointer;
}
input[type=range]:focus-visible{outline:2px solid var(--ui-primary-color); outline-offset:4px; border-radius:4px}
input[type=range]::-webkit-slider-runnable-track{height:2px; background:var(--ui-outline-borderColor)}
input[type=range]::-moz-range-track{height:2px; background:var(--ui-outline-borderColor)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:3px; height:20px; margin-top:-8px;
  background:var(--ui-primary-color); border:0; border-radius:1px;
}
input[type=range]::-moz-range-thumb{
  width:3px; height:20px; background:var(--ui-primary-color); border:0; border-radius:1px;
}
input[type=range]:disabled::-webkit-slider-thumb{background:var(--ui-outline-borderColor)}

/* ---- 下に固定する操作卓 ---- */
/* 本文や一覧をどれだけ下までたどっても、再生位置・送り・速度は画面の下に出したままにする。
   （途中で止めるたびに上へ戻るのが手間だったため） */
.dock{
  flex:none;
  background:var(--ui-surface-bgColor);
  border-top:1px solid var(--ui-outline-borderColor);
  box-shadow:0 -6px 22px rgba(26,36,30,.05);
  padding:8px 24px calc(8px + env(safe-area-inset-bottom, 0px));
  display:flex; flex-direction:column; gap:8px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .dock{box-shadow:0 -6px 22px rgba(0,0,0,.3)}
}
:root[data-theme="dark"] .dock{box-shadow:0 -6px 22px rgba(0,0,0,.3)}

/* 速度：細かい段はパネルの「速度」に置いたまま。ここは 0.1 の上げ下げだけ */
/* つまみは縮められるようにしておく（狭い画面で横にはみ出すため） */
.dock .track{gap:12px}
.dock .track input[type=range]{min-width:0}
.dock .clock{min-width:38px}

.rate-nudge{display:flex; align-items:center; gap:8px; flex:none}
.rate-nudge button{
  padding:4px 8px; line-height:1.4;
  font-family:inherit; font-size:13px;
}
.rate-dock{
  font-family:inherit; font-size:12px;
  color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums;
  min-width:42px; text-align:center;
}

/* 送り */
.dock-row{display:flex; align-items:center; gap:12px}
.now{flex:1; min-width:0; display:flex; align-items:baseline; gap:8px}
.now .n{
  font-family:inherit; font-size:12px;
  color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.now .nm{
  font-size:13px; color:var(--ui-text-muted-fgColor);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.dock-row .spacer{flex:1}
.transport{display:flex; align-items:center; gap:8px}
.transport button{padding:8px 16px; min-height:40px}
#play{min-width:112px; padding:12px 20px; font-size:14px}
.transport .mono{font-family:inherit; font-size:12px}

/* 狭いときは名前を落として、送りのボタンを画面幅いっぱいに広げる */
@media (max-width:820px){
  .dock{padding:8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); gap:8px}
  .dock .track{gap:8px}
  .dock .clock{min-width:34px; font-size:11px}
  .rate-nudge{gap:4px}
  .rate-nudge button{padding:4px 8px}
  .rate-dock{min-width:36px}
  .now, .dock-row .spacer{display:none}
  .transport{flex:1; gap:8px}
  .transport button{flex:1 1 0; padding:12px 2px; min-width:0}
  #play{flex:1.5 1 0; min-width:0; padding:12px 2px}
}

/* 設定行 */
.setting{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.setting > .eyebrow{min-width:58px}
.speeds{display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--ui-outline-borderColor); border-radius:6px; overflow:hidden}
.speeds button{
  border:0; border-right:1px solid var(--ui-outline-borderColor); border-radius:0;
  padding:8px 12px;
  font-family:inherit; font-size:12px;
  font-variant-numeric:tabular-nums;
}
.speeds button:last-child{border-right:0}
.rate-now{
  font-family:inherit; font-size:12px;
  color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums; min-width:56px;
}
select{
  font:inherit; font-size:13px; color:var(--ui-text-fgColor);
  background:var(--ui-surface-bgColor); border:1px solid var(--ui-outline-borderColor);
  border-radius:6px; padding:4px 8px;
}
select:focus-visible{outline:2px solid var(--ui-primary-color); outline-offset:2px}
label.opt{display:flex; align-items:center; gap:8px; color:var(--ui-text-muted-fgColor); font-size:13px; cursor:pointer}
label.opt input[type=checkbox]{accent-color:var(--ui-primary-color)}

/* キー一覧 */
.keys{
  margin-top:auto; padding-top:20px; border-top:1px solid var(--ui-outline-muted-borderColor);
  color:var(--ui-text-muted-fgColor); font-size:12px; line-height:2.1;
  display:flex; flex-wrap:wrap; gap:4px 20px;
}
.keys span{white-space:nowrap}
kbd{
  font-family:inherit; font-size:11px;
  background:var(--ui-page-bgColor); border:1px solid var(--ui-outline-borderColor);
  border-radius:4px; padding:1px 4px; margin-right:4px; color:var(--ui-text-fgColor);
}

/* ---- 本文（transcript.json があるときだけ出る） ---- */
.script{
  flex:1; min-height:0; overflow-y:auto;
  border-top:1px solid var(--ui-outline-muted-borderColor); padding-top:16px;
  display:flex; flex-direction:column; gap:2px;
}
.sent{
  padding:8px 12px; border-radius:6px; cursor:pointer;
  line-height:1.9;
}
.sent:hover{background:var(--ui-surface-bgColor)}
.sent.now{background:var(--ui-primary-muted-bgColor)}
.sent .t{
  font-family:inherit; font-size:11px;
  color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums; margin-right:12px;
}
.w{border-radius:3px; padding:0 1px; cursor:pointer}
.w:hover{background:var(--ui-primary-bgColor); color:var(--ui-primary-onEmphasis-fgColor)}
.w.picked{box-shadow:inset 0 -2px 0 var(--ui-primary-color)}
.note{
  font-size:12px; color:var(--ui-text-muted-fgColor); margin:2px 0 8px 12px;
  padding-left:12px; line-height:1.7;
}
.script-empty{color:var(--ui-text-muted-fgColor); font-size:13px; padding:8px 2px}

/* 狭いときは本文の中で送らず、パネルごと送る（本文の枠が数十pxに潰れるため）。
   ⛔ この2つは .script の指定より後ろに置くこと（同じ強さなので、後ろが勝つ）。 */
@media (max-width:820px){
  .panel{padding:24px 20px 20px; gap:20px}
  .script{flex:none; min-height:0; overflow:visible}
}

/* ---- 引いた語 ---- */
.lookup{
  position:fixed; right:20px; bottom:calc(var(--_app-dockHeight, 104px) + 14px);
  width:min(400px, calc(100vw - 40px));
  max-height:min(56vh, 520px); overflow-y:auto; z-index:40;
  background:var(--ui-surface-bgColor); border:1px solid var(--ui-outline-borderColor); border-radius:10px;
  box-shadow:var(--ui-card-shadow); padding:16px 20px;
  display:flex; flex-direction:column; gap:12px;
}
.lookup[hidden]{display:none}
.lookup .head{display:flex; align-items:baseline; gap:12px}
.lookup .word{font-size:22px; font-weight:600; word-break:break-word}
.lookup .close{margin-left:auto; padding:2px 8px; font-size:12px}
.han{display:flex; flex-wrap:wrap; gap:8px}
.han .cell{
  border:1px solid var(--ui-outline-borderColor); border-radius:7px; padding:8px 12px;
  display:flex; align-items:baseline; gap:8px; background:var(--ui-page-bgColor);
}
.han .kanji{font-size:19px; font-weight:600}
.han .yomi{font-size:11px; color:var(--ui-text-muted-fgColor); font-family:inherit}
.gloss{font-size:14px; line-height:1.7}
.gloss .src{
  font-family:inherit; font-size:11px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ui-text-muted-fgColor); display:block; margin-bottom:2px;
}
.from{
  font-size:12px; color:var(--ui-text-muted-fgColor); line-height:1.8;
  border-top:1px solid var(--ui-outline-muted-borderColor); padding-top:12px;
}
.from b{color:var(--ui-text-fgColor); font-weight:500}
.lookup .keep{align-self:flex-start}

/* ---- 帳簿 ---- */
aside{
  background:var(--ui-surface-bgColor); border-left:1px solid var(--ui-outline-borderColor);
  display:flex; flex-direction:column; min-height:0;
}
@media (max-width:820px){ aside{border-left:0; border-top:1px solid var(--ui-outline-borderColor)} }
.ledger-head{
  display:flex; align-items:center; gap:12px;
  padding:12px 16px; border-bottom:1px solid var(--ui-outline-borderColor);
}
.ledger-head input{
  flex:1; min-width:0; font:inherit; font-size:13px; color:var(--ui-text-fgColor);
  background:var(--ui-page-bgColor); border:1px solid var(--ui-outline-borderColor);
  border-radius:6px; padding:4px 8px;
}
.ledger-head input:focus-visible{outline:2px solid var(--ui-primary-color); outline-offset:-1px}
.tally{
  font-family:inherit; font-size:12px;
  color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums;
}
ol{list-style:none; margin:0; padding:0; overflow-y:auto; flex:1}
ol:empty{flex:0 0 auto}
li{
  display:flex; align-items:center; gap:12px;
  padding:8px 16px 8px 12px;
  border-bottom:1px solid var(--ui-outline-muted-borderColor);
  cursor:pointer; font-size:13px;
}
li:hover{background:var(--ui-page-bgColor)}
li.current{background:var(--ui-primary-muted-bgColor)}
li .n{
  font-family:inherit; font-size:12px;
  color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums; min-width:30px;
}
li.current .n{color:var(--ui-primary-fgColor); font-weight:600}
li.current .nm{font-weight:600}
li .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
li .done{color:var(--ui-success-fgColor); font-size:12px}
li.hidden{display:none}
.ledger-empty{padding:24px 20px; color:var(--ui-text-muted-fgColor); font-size:13px; line-height:1.8}

/* ドロップ */
#drop{
  position:fixed; inset:0; z-index:60; display:none;
  align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--ui-page-bgColor) 88%, transparent);
  border:3px dashed var(--ui-primary-color);
  color:var(--ui-primary-fgColor); font-size:19px; font-weight:600; letter-spacing:.02em;
  pointer-events:none;
}

/* ================= デザインシステムに合わせる（2026-10-01） ================= */
/* 本人（2026-10-01）「緑の色と背景のグレーが気に入らなくなってきた」「マインドマップや韓国の YouTube を取り込むやつの色感」
   「カードの左に口をつけるやつはやめる」。
   ⭕ 線で区切らない。カードは白＋薄く広い影＋角丸。ボタンは丸いつまみ。切り替えの選んだ側は黒。
   ⛔ 左の縦の帯（border-left で状態を出す）は使わない。状態は面の色で出す。 */
.eyebrow{font-size:11px; font-weight:500; letter-spacing:.02em; text-transform:none; color:var(--ui-text-muted-fgColor)}
header{background:var(--ui-page-bgColor); border-bottom:0; padding:16px 24px 12px}
.wordmark b{letter-spacing:0}
.folder .name{color:var(--ui-text-muted-fgColor)}
.bignum{letter-spacing:-.03em}

button{border:0; border-radius:999px; background:var(--ui-surface-bgColor); box-shadow:var(--ui-control-shadow); padding:8px 16px; transition:background .12s, color .12s, box-shadow .12s}
button:hover{border-color:transparent; background:var(--ui-surface-muted-bgColor)}
button.primary{background:var(--ui-primary-bgColor); color:var(--ui-primary-onEmphasis-fgColor); box-shadow:none}
button.primary:hover{background:var(--ui-primary-bgColor); filter:brightness(1.06)}
button.on{background:var(--ui-text-fgColor); color:var(--ui-surface-bgColor); font-weight:500}
button.fold, button.fold:hover{box-shadow:none; background:transparent}
button:disabled{opacity:.5; cursor:default}

/* 切り替え：白い台の中に丸いつまみ。選んだ側は黒 */
.modes, .pbar .seg, .wf, .speeds{border:0; background:var(--ui-surface-bgColor); box-shadow:var(--ui-control-shadow); border-radius:999px; padding:4px; gap:2px; overflow:visible}
.modes button, .pbar .seg button, .wf button, .speeds button{border:0; border-radius:999px; box-shadow:none; background:transparent; color:var(--ui-text-muted-fgColor); padding:4px 12px; font-size:12px; font-weight:500}
.modes button + button, .pbar .seg button + button, .wf button + button{border-left:0}
.speeds button, .speeds button:last-child{border-right:0}
.modes button:hover, .pbar .seg button:hover, .wf button:hover, .speeds button:hover{background:var(--ui-surface-muted-bgColor); color:var(--ui-text-fgColor)}
.modes button.on, .pbar .seg button.on, .wf button.on, .speeds button.on{background:var(--ui-text-fgColor); color:var(--ui-surface-bgColor)}

select, .ledger-head input, .typein, .addex input, .bfilter{border:0; background:var(--ui-surface-bgColor); box-shadow:inset 0 0 0 1px var(--ui-outline-borderColor); border-radius:var(--ui-control-radius)}
.ledger-head input{background:var(--ui-surface-muted-bgColor); box-shadow:none}
kbd{border:0; background:var(--ui-surface-muted-bgColor); box-shadow:inset 0 0 0 1px var(--ui-outline-borderColor)}

/* 聴く */
main{gap:16px; padding:0 16px 16px}
.panel{background:transparent}
aside{background:var(--ui-surface-bgColor); border-left:0; border-radius:var(--ui-card-radius); box-shadow:var(--ui-card-shadow); overflow:hidden}
@media (max-width:820px){ aside{border-top:0} main{gap:12px; padding:0 12px 12px} }

/* 練習・見渡す・教材：カードは白＋影＋角丸。線は引かない */
.pcell, .tile, .ovsec, .btable, .gram, .bcard, .wk, .vw, .slots{border:0; border-radius:var(--ui-card-radius); box-shadow:var(--ui-card-shadow); background:var(--ui-surface-bgColor)}

.slots.right{box-shadow:none; background:var(--ui-success-muted-bgColor)}
.slots.wrong{box-shadow:none; background:var(--ui-danger-muted-bgColor)}

.choices button.wrong{background:var(--ui-danger-muted-bgColor); color:var(--ui-danger-fgColor); border-color:transparent}
.row button.miss{color:var(--ui-danger-fgColor); background:var(--ui-danger-muted-bgColor); box-shadow:none}
.meter i.f{background:var(--ui-success-color)}
.ovrow{box-shadow:none; border-radius:var(--ui-control-sm-radius)}
.ovrow:hover{background:var(--ui-surface-muted-bgColor)}
.wchip{box-shadow:none; border-radius:999px; padding:4px 12px; background:var(--ui-surface-muted-bgColor); color:var(--ui-text-muted-fgColor)}
.wchip.lv1{background:var(--ui-primary-muted-bgColor); color:var(--ui-primary-fgColor)}
.wchip.lv2{background:var(--ui-success-muted-bgColor); color:var(--ui-success-fgColor)}
.brow + .brow{border-top:0}

.bcard.on{background:var(--ui-text-fgColor); color:var(--ui-surface-bgColor)}
.bcard.on small{color:inherit; opacity:.75}
.gram{overflow:hidden}
.gram.open{box-shadow:var(--ui-card-raised-shadow)}
.gt, .gt:hover{box-shadow:none; border-radius:0; background:transparent}
.gs{box-shadow:none; background:var(--ui-surface-muted-bgColor); border-radius:var(--ui-control-sm-radius)}
.gs:hover{background:var(--ui-primary-muted-bgColor)}
/* 語彙：覚えた具合は左の帯ではなく、右上の小さな点で出す */
.vw{border-left:0; position:relative; padding:8px 28px 8px 12px}
.vw::after{content:""; position:absolute; top:12px; right:12px; width:7px; height:7px; border-radius:50%; background:var(--ui-outline-borderColor)}
.vw.lv1::after{background:var(--ui-primary-color)} .vw.lv2::after{background:var(--ui-success-color)}
.pc{border-radius:var(--ui-control-sm-radius); box-shadow:inset 0 0 0 1px var(--ui-outline-borderColor); background:var(--ui-surface-bgColor)}
.pc.ro{box-shadow:none; background:var(--ui-success-muted-bgColor); color:var(--ui-success-fgColor)}
.pc.rs{box-shadow:none; background:var(--ui-warning-muted-bgColor); color:var(--ui-warning-fgColor)}
.pc.rx{box-shadow:none; background:var(--ui-danger-muted-bgColor); color:var(--ui-danger-fgColor)}
.bport{border:0; background:var(--ui-surface-bgColor); box-shadow:var(--ui-card-shadow); border-radius:var(--ui-card-radius)}
.unchecked{color:var(--ui-warning-fgColor)}
.lg i.ok{background:var(--ui-success-color)}

/* ---- 操作卓と、白い面の上のボタン（2026-10-01） ----
   本人「肝心なこの辺のデザインが雑。右端のパディングが無い・矢印が下にずれる」「白の上に白いボタンは見にくい」。
   ⭕ 矢印は文字ではなく図形（SVG）にする。⛔ ⟵ ⟶ は書体ごとに高さが違い、日本語の行の中で下にずれる。
   ⭕ 白い面（操作卓・カード・引いた語の窓）の上のボタンは、影ではなく薄いグレーの面で出す。
      影で浮かせるのは、地（グレー）の上に置くときだけ。 */
:root{ --ui-control-bgColor:#eef0f4; --ui-control-bgColor-hover:#e5e8ee }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --ui-control-bgColor:#262a32; --ui-control-bgColor-hover:#2e333c } }
:root[data-theme="dark"]{ --ui-control-bgColor:#262a32; --ui-control-bgColor-hover:#2e333c }

.dock button, .lookup button, .bport button, .addex button, aside button{background:var(--ui-control-bgColor); box-shadow:none}
.dock button:hover, .lookup button:hover, .bport button:hover, .addex button:hover, aside button:hover{background:var(--ui-control-bgColor-hover)}
.dock button.primary{background:var(--ui-primary-bgColor); color:var(--ui-primary-onEmphasis-fgColor)}
.dock button.primary:hover{background:var(--ui-primary-bgColor); filter:brightness(1.06)}

.ic{width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.ic.fill{fill:currentColor; stroke:none}
#play .i-pause{display:none}
#play.playing .i-play{display:none}
#play.playing .i-pause{display:inline}

.dock{padding:16px 28px calc(16px + env(safe-area-inset-bottom, 0px)); gap:12px}
.dock .track{gap:16px; align-items:center}
.dock .clock{min-width:40px; font-size:12px; color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums}
/* 線：進んだぶんを青で塗る（--_seek-progress は再生位置から入れる）。つまみは丸 */
#seek{height:24px; --_seek-progress:0%}
#seek::-webkit-slider-runnable-track{height:4px; border-radius:999px; background:linear-gradient(to right, var(--ui-primary-color) var(--_seek-progress), var(--ui-outline-borderColor) var(--_seek-progress))}
#seek::-moz-range-track{height:4px; border-radius:999px; background:var(--ui-outline-borderColor)}
#seek::-moz-range-progress{height:4px; border-radius:999px; background:var(--ui-primary-color)}
#seek::-webkit-slider-thumb{width:14px; height:14px; margin-top:-4px; border-radius:50%; background:var(--ui-surface-bgColor); box-shadow:0 0 0 2px var(--ui-primary-color), 0 1px 3px rgba(20,24,32,.15)}
#seek::-moz-range-thumb{width:14px; height:14px; border-radius:50%; background:var(--ui-surface-bgColor); border:2px solid var(--ui-primary-color)}
#seek:disabled::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--ui-outline-borderColor)}

/* 速度の上げ下げ：1つの台にまとめる */
.rate-nudge{gap:2px; padding:4px; border-radius:999px; background:var(--ui-control-bgColor)}
.rate-nudge button{width:28px; height:28px; padding:0; display:inline-flex; align-items:center; justify-content:center; background:transparent; border-radius:50%}
.rate-nudge button:hover{background:var(--ui-surface-bgColor)}
.rate-nudge .ic{width:14px; height:14px}
.rate-dock{min-width:44px; font-size:12px; color:var(--ui-text-fgColor); font-weight:500}

/* 送り：左の題・中央の操作・右の空きを 1fr auto 1fr にして、操作を真ん中に据える */
.dock-row{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:16px; align-items:center}
.dock-row .spacer{display:block}
.now{gap:12px}
.transport{gap:8px}
.transport button{height:44px; min-height:0; padding:0 20px; display:inline-flex; align-items:center; justify-content:center; gap:8px; font-size:13px; font-weight:500; line-height:1}
#prev{padding-left:12px} #next{padding-right:12px}
#play{min-width:132px; height:48px; padding:0 24px; gap:8px; font-size:14px}
#play .ic{width:15px; height:15px}

/* 速度の列：折り返さない。狭いときは横に送る */
.speeds{flex-wrap:nowrap; max-width:100%; overflow-x:auto; scrollbar-width:none}
.speeds::-webkit-scrollbar{display:none}
.speeds{width:100%; max-width:440px}
.speeds button{flex:1 1 0; min-width:max-content; padding:4px 8px; text-align:center}

@media (max-width:820px){
  .dock{padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px))}
  .dock-row{display:flex}
  .transport{flex:1; gap:8px}
  .transport button{flex:1 1 0; min-width:0; padding:0 4px; height:44px}
  #prev, #next{padding:0 4px}
  #play{flex:1.6 1 0; min-width:0; padding:0 8px}
  .transport button{white-space:nowrap; font-size:12px}
  .dock-row .spacer, .now{display:none}
  #prev span, #next span{display:none}          /* 狭いときは矢印だけ（文字が折れて2行になるため） */
  #prev, #next{flex:.8 1 0}
  .speeds{display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); max-width:none; overflow:visible}
  .speeds button{min-width:0; padding:4px 0; font-size:11px}
}

/* ---- プルダウン（2026-10-01） ----
   本人「このシェブロンから右のパディングがいつもない。何度も言いたくないから二度とやらないで」。
   ⛔ ブラウザ標準の矢印は右端に貼りつき、余白を指定できない。⭕ 標準の矢印を消し、自前の矢印を右から 12px に置く。
   ⭕ 文字が矢印に重ならないよう、右の内側の余白は 34px（矢印 12px＋左右の余白）。 */
select{-webkit-appearance:none; appearance:none; padding:8px 36px 8px 16px; border-radius:999px; line-height:1.3;

.journey{background:var(--ui-surface-bgColor); border-radius:var(--ui-card-radius); box-shadow:var(--ui-card-shadow); padding:20px 24px; display:flex; flex-direction:column; gap:12px}
.jhead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
.jhead b{font-size:16px} .jhead span{font-size:13px; color:var(--ui-text-muted-fgColor); font-variant-numeric:tabular-nums}
.jbar, .rbbar{height:8px; border-radius:999px; background:var(--ui-outline-borderColor); overflow:hidden}
.jbar i, .rbbar i{display:block; height:100%; border-radius:999px; background:var(--ui-success-color); transition:width .3s}
.rbbar i{background:var(--ui-primary-color)}
.jpath{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:4px; position:relative}
.jnode{display:grid; grid-template-columns:36px minmax(0,1fr) auto auto; gap:12px; align-items:center; padding:8px 12px 8px 0; border-radius:var(--ui-control-radius); position:relative}
.jnode + .jnode::before{content:""; position:absolute; left:17px; top:-12px; height:16px; width:2px; background:var(--ui-outline-borderColor)}
.jnode.cleared + .jnode::before{background:var(--ui-success-color)}
.jdot{width:36px; height:36px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums;
  background:var(--ui-control-bgColor); color:var(--ui-text-muted-fgColor); position:relative; z-index:1}
.jnode.cleared .jdot{background:var(--ui-success-muted-bgColor); color:var(--ui-success-fgColor)}
.jnode.current .jdot{background:var(--ui-primary-bgColor); color:var(--ui-primary-onEmphasis-fgColor); box-shadow:0 0 0 4px var(--ui-primary-muted-bgColor)}
.jnode.locked{opacity:.55}
.jnode.current{background:var(--ui-primary-muted-bgColor)}
.jbody{display:flex; flex-direction:column; gap:2px; min-width:0}
.jbody b{font-weight:500; display:flex; align-items:center; gap:8px}
.jbody b em{font-style:normal; font-size:11px; font-weight:600; color:var(--ui-primary-fgColor)}
.jbody small{font-size:12px; color:var(--ui-text-muted-fgColor); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.jgo{white-space:nowrap; background:var(--ui-control-bgColor); box-shadow:none}
.jgo.primary{background:var(--ui-primary-bgColor); color:var(--ui-primary-onEmphasis-fgColor)}
.jlock{font-size:12px; color:var(--ui-text-muted-fgColor); white-space:nowrap}
.stars{display:inline-flex; gap:2px; font-size:16px; line-height:1}
.stars i{font-style:normal; color:var(--ui-outline-borderColor)} .stars i.on{color:var(--ui-warning-fgColor)}   /* 金色は白の上で 2.2:1 しかなかった。文字の暖色（4.5:1 以上）にする */
.lprog{display:inline-flex; align-items:center; gap:8px; flex:none}
.lprog i{width:40px; height:6px; border-radius:999px; background:linear-gradient(to right, var(--ui-success-color) var(--p), var(--ui-outline-borderColor) var(--p))}
.lprog small{font-size:11px; color:inherit; opacity:.75; font-variant-numeric:tabular-nums}
.lprog .crown{font-size:11px; font-weight:600; color:var(--ui-success-fgColor); background:var(--ui-success-muted-bgColor); border-radius:999px; padding:2px 8px}
.lrow.on .lprog .crown{background:rgba(255,255,255,.18); color:inherit}
/* 解いているあいだ：自由に練習の切り替えを隠し、進み具合の帯を出す */
.practice.running .pbar, .practice.running .psets{display:none}
.runbar{max-width:1120px; margin:0 auto 24px; background:var(--ui-surface-bgColor); border-radius:var(--ui-card-radius); box-shadow:var(--ui-card-shadow); padding:16px 20px; display:flex; flex-direction:column; gap:8px}
.runbar[hidden]{display:none}
.rbtop{display:flex; align-items:center; gap:8px 16px; flex-wrap:wrap}
.rbtop span{font-size:13px; color:var(--ui-text-muted-fgColor)}
.rbtop button{margin-left:auto; background:var(--ui-control-bgColor); box-shadow:none; font-size:12px}
.rbnum{font-size:12px; color:var(--ui-text-muted-fgColor); text-align:right; font-variant-numeric:tabular-nums}
.result{max-width:520px; margin:24px auto; background:var(--ui-surface-bgColor); border-radius:var(--ui-card-radius); box-shadow:var(--ui-card-raised-shadow); padding:32px 24px;
  display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center}
.result .stars{font-size:40px; gap:8px}
.rchapter{font-size:13px; font-weight:600; color:var(--ui-success-fgColor); background:var(--ui-success-muted-bgColor); border-radius:999px; padding:4px 16px}
.rtitle{font-size:14px; color:var(--ui-text-muted-fgColor)}
.rscore{font-size:48px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1; display:flex; flex-direction:column; align-items:center}
.rscore small{font-size:13px; font-weight:400; color:var(--ui-text-muted-fgColor)}
.rmsg{font-size:14px}
@media (max-width:820px){ .jnode{grid-template-columns:36px minmax(0,1fr); } .jnode .stars, .jnode .jgo, .jnode .jlock{grid-column:2; justify-self:start} }

/* ---- AI に聞く（どの画面からでも）（2026-10-03） ---- */
.askfab{position:fixed; right:24px; bottom:calc(var(--_app-dockHeight, 104px) + 16px); z-index:45; display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 20px;
  background:var(--ui-text-fgColor); color:var(--ui-surface-bgColor); box-shadow:var(--ui-card-raised-shadow); font-weight:500}
.askfab:hover{background:var(--ui-text-fgColor); filter:brightness(1.15)}
.askfab .ic{width:18px; height:18px}
/* AI の印：中で色がゆっくり回る球。考えているあいだは4つの玉と弧が回る
   （2026-10-03 本人「幾何学の立体みたいな丸いグネグネ」「実行してるときの動きが気に入ってる。4つの玉とか何本かの線が動き回る」） */
.askfab{padding-left:8px}
.askfab .orb{width:28px; height:28px; flex:none; filter:drop-shadow(0 1px 2px rgb(0 0 0 / .3))}
.orb g, .orb path, .orb circle{transform-box:view-box; transform-origin:32px 32px}
.orb .orb-a{animation:orbSpin 9s linear infinite}
.orb .orb-b{animation:orbSpin 13s linear infinite reverse}
.orb .orb-think{opacity:0; transition:opacity .3s}
.askfab:hover .orb-a{animation-duration:3s} .askfab:hover .orb-b{animation-duration:4.5s}
.askfab.thinking .orb-a{animation-duration:1.6s} .askfab.thinking .orb-b{animation-duration:2.2s}
.askfab.thinking .orb-think{opacity:1}
.askfab.thinking .orb-d1{animation:orbSpin 1.1s cubic-bezier(.5,0,.5,1) infinite}
.askfab.thinking .orb-d2{animation:orbSpin 1.5s cubic-bezier(.5,0,.5,1) infinite reverse}
.askfab.thinking .orb-d3{animation:orbSpin 1.9s cubic-bezier(.5,0,.5,1) infinite .2s}
.askfab.thinking .orb-d4{animation:orbSpin 2.4s cubic-bezier(.5,0,.5,1) infinite reverse .4s}
.askfab.thinking .orb-arc1{animation:orbSpin 1.3s linear infinite}
.askfab.thinking .orb-arc2{animation:orbSpin 1.7s linear infinite reverse}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .orb *{animation:none !important} }
.app.practicing ~ .askfab{bottom:24px}
.askpanel{position:fixed; right:24px; bottom:calc(var(--_app-dockHeight, 104px) + 72px); z-index:46; width:min(440px, calc(100vw - 32px)); max-height:min(70vh, 640px); overflow-y:auto;
  background:var(--ui-surface-bgColor); border-radius:var(--ui-card-radius); box-shadow:var(--ui-card-raised-shadow); padding:20px; display:flex; flex-direction:column; gap:12px}
.askpanel[hidden]{display:none}
.app.practicing ~ .askpanel{bottom:80px}
.aph{display:flex; align-items:center; justify-content:space-between}
.apclose{width:36px; height:36px; padding:0; display:inline-flex; align-items:center; justify-content:center; background:var(--ui-control-bgColor); box-shadow:none}
.apctx{font-size:13px; color:var(--ui-text-muted-fgColor); display:flex; flex-direction:column; gap:4px}
.apctx b{color:var(--ui-text-fgColor); font-size:15px; font-weight:500}
.askpanel .ask{border-top:0; padding-top:0; margin-top:0}
@media (max-width:820px){ .askfab{right:16px} .askpanel{right:16px} }

.recchip{font-size:12px; padding:4px 12px; height:28px; background:var(--ui-warning-muted-bgColor); color:var(--ui-warning-fgColor); box-shadow:none; white-space:nowrap}
.recchip.ok{background:var(--ui-success-muted-bgColor); color:var(--ui-success-fgColor)}
.recchip[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important}
}

<script>
(function(){

const $ = s => document.querySelector(s);
const AUDIO_RE = /\.(mp3|m4a|m4b|aac|wav|aiff?|ogg|oga|opus|flac|webm|mp4)$/i;
const RATES = [0.5,0.75,0.8,0.9,1,1.1,1.25,1.5,2];

const audio = new Audio();
audio.preload = 'auto';
['preservesPitch','mozPreservesPitch','webkitPreservesPitch'].forEach(k=>{ try{ audio[k]=true; }catch(e){} });

let tracks = [];
let idx = -1;
let url = null;
let folderKey = '';
let done = new Set();
let playsLeft = 1;
let gapTimer = null;
let lastSave = 0;
let rate = 1;
let mode = 'listen';   // listen ／ practice ／ overview ／ book
let afiles = {};       // 音声のファイル名 → File（教材の面から区間を鳴らすため）
let lastHandle = null; // いま開いているフォルダの手掛かり（教材ごとに覚え直す）

/* ---------- 保存（使えない環境でも動く） ---------- */
function load(key, fallback){
  try{ const v = localStorage.getItem('otodrill:'+key); return v===null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function save(key, val){
  try{ localStorage.setItem('otodrill:'+key, JSON.stringify(val)); }catch(e){}
}

/* ---------- 表示 ---------- */
function fmt(s){
  if(!isFinite(s) || s<0) s = 0;
  const m = Math.floor(s/60), r = Math.floor(s%60);
  return m + ':' + String(r).padStart(2,'0');
}
function label(r){ return r.toFixed(2).replace(/0$/,'').replace(/\.$/,'') + '×'; }

function renderList(){
  const ol = $('#list');
  ol.innerHTML = '';
  tracks.forEach((t,i)=>{
    const li = document.createElement('li');
    li.dataset.i = i;
    li.innerHTML = '<span class="n"></span><span class="nm"></span><span class="done"></span>';
    li.querySelector('.n').textContent = String(i+1).padStart(String(tracks.length).length,'0');
    li.querySelector('.nm').textContent = t.name;
    li.addEventListener('click', ()=> play(i, true));
    ol.appendChild(li);
  });
  $('#ledgerEmpty').style.display = 'none';
  paintList();
  applyFilter();
}

function paintList(){
  const items = $('#list').children;
  for(let i=0;i<items.length;i++){
    items[i].classList.toggle('current', i===idx);
    items[i].querySelector('.done').innerHTML = done.has(tracks[i].name) ? '<svg class="ic" viewBox="0 0 16 16" aria-label="聴いた"><path d="M3.5 8.5l3 3 6-7"/></svg>' : '';
  }
  const shown = tracks.filter(t => done.has(t.name)).length;
  $('#tally').textContent = tracks.length ? (shown + '/' + tracks.length) : '';
}

/* 各課の基本文の音声だけを、一覧から選んで続けて流す（2026-10-03 本人「ユニットのメインの音声だけを選んで流したい。一覧を隠すのあたりか別のところで」）。
   ⭕ 基本文の音声＝その課の基本文が入っているトラック。次へ・自動で次へも、この中だけで動く */
let listMode = load('listmode', 'all');
function mainTracks(){
  const out = new Map();
  if(!pdata) return out;
  lessonData().forEach(x => {
    const it = x.items.find(i => !isSound(i) && catOf(i, i.deck) === 'sentence');
    if(it && !out.has(srcOf(it))) out.set(srcOf(it), x.L.title);
  });
  return out;
}
function visibleTrack(i){
  const q = $('#filter').value.trim().toLowerCase();
  if(q && !tracks[i].name.toLowerCase().includes(q)) return false;
  return listMode !== 'main' || mainTracks().has(tracks[i].name);
}
function stepTrack(from, dir){   // 見えている中で次（前）のトラック
  for(let i = from + dir; i >= 0 && i < tracks.length; i += dir) if(visibleTrack(i)) return i;
  return -1;
}
function paintMainBar(){
  let bar = $('#mainBar');
  if(!bar){ bar = document.createElement('div'); bar.id = 'mainBar'; bar.className = 'mainbar'; const nh = document.querySelector('.nowhead'); if(!nh) return; nh.after(bar); }
  const mt = mainTracks(), on = listMode === 'main' && mt.size;
  bar.hidden = !on; if(!on) return;
  const cur = idx >= 0 && tracks[idx] ? mt.get(tracks[idx].name) : null;
  const list = [...mt.keys()], k = cur ? list.indexOf(tracks[idx].name) + 1 : 0;
  bar.innerHTML = '<span><b>基本文の音声だけを流しています</b>' + (cur ? esc(cur) + '　' + k + ' / ' + list.length : '') + '</span><button id="mainOff">すべての音声に戻す</button>';
  $('#mainOff').onclick = () => { listMode = 'all'; save('listmode', listMode); applyFilter(); };
}
function applyFilter(){
  const items = $('#list').children, mt = mainTracks();
  const lm = $('#listMode'); lm.hidden = !mt.size;
  [...lm.querySelectorAll('button')].forEach(b => b.classList.toggle('on', b.dataset.lm === listMode));
  for(let i=0;i<items.length;i++){
    items[i].classList.toggle('hidden', !visibleTrack(i));
    const nm = items[i].querySelector('.nm');
    nm.textContent = listMode === 'main' && mt.has(tracks[i].name) ? mt.get(tracks[i].name) + '　基本文' : tracks[i].name;
  }
  paintMainBar();
}
$('#listMode').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  listMode = b.dataset.lm; save('listmode', listMode); applyFilter();
  if(listMode === 'main' && (idx < 0 || !visibleTrack(idx))){ const j = stepTrack(-1, 1); if(j >= 0) play(j, false); }
  b.blur();
});

/* ---------- 読み込み ---------- */
function loadFiles(files){
  const list = files.filter(f => AUDIO_RE.test(f.name) && !f.name.startsWith('.'));
  if(!list.length){
    // ⭕ 2026-10-03 iPhone で、記録のフォルダ（記録・質問帳が入っている）を教材として選んでいた。同じ「音声ドリル」という名前で迷う
    const isRec = files.some(f => /(^|\/)(記録|質問帳)\//.test(f._rel || ''));
    $('#fname').textContent = isRec
      ? 'これは記録のフォルダです。教材は' + (NATIVE ? ' iCloud Drive の「音声ドリル」→「教材」→「26295」' : '音声の入ったフォルダ') + 'を選んでください。記録のフォルダは、見出しの「同期」から選びます。'
      : '音声ファイルが見つかりませんでした。mp3・m4a・wav などが入ったフォルダを選んでください。';
    $('#fname').classList.add('blank');
    return;
  }

  list.forEach(f => { f._rel = f._rel || f.webkitRelativePath || f.name; });
  list.sort((a,b)=> a._rel.localeCompare(b._rel, 'ja', {numeric:true, sensitivity:'base'}));

  tracks = list.map(f => ({file:f, name:f.name, rel:f._rel}));
  afiles = {}; list.forEach(f => { afiles[f.name] = f; });
  const first = tracks[0].rel;
  folderKey = first.includes('/') ? first.split('/')[0] : 'files';

  $('#folder').textContent = folderKey + ' · ' + tracks.length + '本';
  done = new Set(load('done:'+folderKey, []));
  renderList();
  // 開いたフォルダの手掛かり（ファイル選び・落とした場合は無いことがある）
  lastHandle = pendingHandle; pendingHandle = null;
  // ⛔ folderKey と tracks が決まってから読む（付属ファイルが無いと待たずに走り、前のフォルダの値で教材を登録してしまう）
  loadSidecars(files);

  const last = load('last:'+folderKey, null);
  let start = 0, at = 0;
  if(last){
    const i = tracks.findIndex(t => t.name === last.name);
    if(i >= 0){ start = i; at = last.time || 0; }
  }
  play(start, false, at);
}

async function filesFromDrop(dt){
  const entries = [...dt.items].map(it => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
  if(!entries.length) return [...dt.files];
  const out = [];
  async function walk(entry, prefix){
    if(entry.isFile){
      const f = await new Promise((res,rej)=> entry.file(res, rej));
      f._rel = prefix + entry.name;
      out.push(f);
    }else if(entry.isDirectory){
      const reader = entry.createReader();
      let batch;
      do{
        batch = await new Promise((res,rej)=> reader.readEntries(res, rej));
        for(const e of batch) await walk(e, prefix + entry.name + '/');
      }while(batch.length);
    }
  }
  for(const e of entries) await walk(e, '');
  return out;
}

/* ---------- 再生 ---------- */
let playSeq = 0;
function play(i, autoplay, seekTo){
  if(i < 0 || i >= tracks.length) return;
  clearTimeout(gapTimer);
  if(url && !NATIVE) URL.revokeObjectURL(url);
  idx = i;
  const f = tracks[i].file, mySeq = ++playSeq;
  const start = u => {
    if(mySeq !== playSeq) return;     // 読んでいるあいだに別の本へ移った
    url = u; audio.src = u; audio.playbackRate = rate;
    if(seekTo) audio.addEventListener('loadedmetadata', ()=>{ audio.currentTime = seekTo; }, {once:true});
    if(autoplay) audio.play().catch(()=>{});
  };
  if(NATIVE && f._url) nativeAudioURL(f).then(start).catch(() => start(f._url));
  else start(objURL(f));
  playsLeft = Number($('#repeatN').value) || 0;

  const width = String(tracks.length).length;
  $('#bignum').textContent = String(i+1).padStart(width,'0');
  $('#oftotal').textContent = '/ ' + tracks.length + '　残り ' + (tracks.length-i-1) + '本';
  $('#fname').textContent = tracks[i].name;
  setTimeout(paintMainBar, 0);
  $('#fname').classList.remove('blank');
  $('#nowN').textContent = String(i+1).padStart(width,'0') + '/' + tracks.length;
  $('#nowName').textContent = tracks[i].name;
  $('#seek').disabled = false;
  renderScript(tracks[i].name);
  paintLtag();
  paintList();
  scrollToCurrent();

  saveLast();
}

function setRate(r){
  rate = Math.min(3, Math.max(0.25, Math.round(r*100)/100));
  save('rate', rate);
  audio.playbackRate = rate;
  $('#rateNow').textContent = 'いま ' + label(rate);
  $('#rateDock').textContent = label(rate);
  [...$('#speeds').children].forEach(b => b.classList.toggle('on', Number(b.dataset.r) === rate));
  paintSetSum();
}

/* いまの設定の一言（設定の小窓を閉じていても分かるように） */
function paintSetSum(){
  const el = $('#setSum'); if(!el) return;
  const rn = $('#repeatN'), gp = $('#gap');
  const parts = [label(rate)];
  if(rn.value !== '1') parts.push(rn.options[rn.selectedIndex].text + '繰り返す');

function toggle(){
  if(flow){ flowToggle(); return; }
  if(idx < 0) return;
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
}

function step(sec){
  if(flow){ flowGo(sec < 0 ? 0 : 1); return; }   // 1文ずつ聴いているとき：戻す＝今の文をもう一度、送る＝次の文
  if(idx>=0) audio.currentTime = Math.max(0, Math.min(audio.duration||0, audio.currentTime + sec));
}

function goNext(byHand){
  clearTimeout(gapTimer);
  const j = stepTrack(idx, 1);
  if(j >= 0) play(j, true);
  else if($('#loopAll').checked && !byHand && stepTrack(-1, 1) >= 0) play(stepTrack(-1, 1), true);
  else setPlayLabel(false);
}

let importing = false;   // 記録を読み込んで読み直すあいだは、聴いた位置を書かない（読み込んだ値を上書きするため）
function saveLast(){
  if(idx < 0 || importing) return;
  save('last:'+folderKey, {name: tracks[idx].name, time: audio.currentTime||0});
}

/* ---------- イベント ---------- */
function setPlayLabel(on){
  $('#play').classList.toggle('playing', on);
  $('#play .lbl').textContent = on ? '一時停止' : '再生';
}
audio.addEventListener('play',  ()=> setPlayLabel(true));
audio.addEventListener('pause', ()=> setPlayLabel(!!flow && !flow.paused));   // 1文ずつ聴いているあいだは、ボタンはそちらの状態
audio.addEventListener('loadedmetadata', ()=>{ $('#dur').textContent = fmt(audio.duration); paintSeek(); });

audio.addEventListener('timeupdate', ()=>{
  $('#cur').textContent = fmt(audio.currentTime);
  syncScript(audio.currentTime);
  if(audio.duration){ $('#seek').value = Math.round(audio.currentTime / audio.duration * 1000); paintSeek(); }
  const now = Date.now();
  if(now - lastSave > 3000){ lastSave = now; saveLast(); }
});

audio.addEventListener('ended', ()=>{
  if(idx >= 0 && !done.has(tracks[idx].name)){
    done.add(tracks[idx].name);
    save('done:'+folderKey, [...done]);
    emit('done', {f: folderKey, n: tracks[idx].name});
    paintList();
  }
  const n = Number($('#repeatN').value);
  const g = Number($('#gap').value) * 1000;
  if(n === 0 || playsLeft > 1){
    if(n !== 0) playsLeft--;
    gapTimer = setTimeout(()=>{ audio.currentTime = 0; audio.play().catch(()=>{}); }, g);
    return;
  }
  gapTimer = setTimeout(()=> goNext(false), g);
});

/* ---------- 前に開いたフォルダを覚える ---------- */
/* 音声そのものは持たない（大きすぎる）。フォルダへの手掛かりだけ IndexedDB に置く。
   ⛔ 手掛かりを保存できるのは showDirectoryPicker のある環境だけ（Chrome・Edge）。
   Safari・Firefox・ダブルクリックで開いた場合は、これまで通り毎回選ぶ。 */
function idb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('otodrill', 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('handles');
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
/* ---- iPhone のアプリ（window.oto.fs）のフォルダを、Chrome のフォルダの口と同じ形に包む（2026-10-03 段4）
   ⭕ これで記録・質問帳・教材を読むコードは、Chrome でも iPhone でも同じものが動く。
   ⭕ 中身はまとめて渡さない。音声と絵は otofs:// の住所で、要るときに要る分だけ読む */
const NATIVE = !!(window.oto && window.oto.fs);
const canFolders = !!window.showDirectoryPicker || NATIVE;
const objURL = f => (f && f._url) || URL.createObjectURL(f);
/* iPhone：音声は1回だけまるごと読み、手元の Blob から鳴らす（2026-10-03 本人「音声再生をしても始まらない」）。
   ⛔ otofs:// のまま渡すと、iPhone の再生は小さく何度も読みに来て、そのたびに iCloud から読み直して止まっていた。直近の4本は控える */
const nAudio = new Map();
async function nativeAudioURL(f){
  if(nAudio.has(f._url)){ const u = nAudio.get(f._url); nAudio.delete(f._url); nAudio.set(f._url, u); return u; }
  const b = await (await fetch(f._url)).blob();
  const u = URL.createObjectURL(new Blob([b], {type: f.type || 'audio/mpeg'}));
  nAudio.set(f._url, u);
  while(nAudio.size > 4){ const [k, old] = nAudio.entries().next().value; URL.revokeObjectURL(old); nAudio.delete(k); }
  return u;
}
class NFile {
  constructor(kind, path, name, size){ this.kind = 'file'; this._k = kind; this._p = path; this.name = name; this._size = size || 0; }
  async getFile(){
    const k = this._k, p = this._p, name = this.name, url = oto.fs.url(k, p);
    let size = this._size; if(!size){ const st = await oto.fs.stat(k, p); size = (st && st.size) || 0; }
    const type = /\.mp3$/i.test(name) ? 'audio/mpeg' : /\.m4a$/i.test(name) ? 'audio/mp4' : /\.json$/i.test(name) ? 'application/json' : '';
    return {name, size, type, lastModified: 0, _url: url,
      text: () => oto.fs.read(k, p), arrayBuffer: () => fetch(url).then(r => r.arrayBuffer())};
  }
  async createWritable(opt){
    const k = this._k, p = this._p, keep = !!(opt && opt.keepExistingData);
    let pos = 0, buf = '';
    return {seek: async n => { pos = n; }, write: async d => { buf += typeof d === 'string' ? d : (d && d.data) || ''; },
      close: async () => { if(keep && pos > 0) await oto.fs.append(k, p, buf); else await oto.fs.write(k, p, buf); }};
  }
  async queryPermission(){ return 'granted'; } async requestPermission(){ return 'granted'; }
}
class NDir {
  constructor(kind, path, name){ this.kind = 'directory'; this._k = kind; this._p = path; this.name = name; }
  _c(n){ return this._p ? this._p + '/' + n : n; }
  async *entries(){
    for(const e of await oto.fs.list(this._k, this._p)){
      yield [e.name, e.kind === 'directory' ? new NDir(this._k, this._c(e.name), e.name) : new NFile(this._k, this._c(e.name), e.name, e.size)];
    }
  }
  async getDirectoryHandle(n, opt){
    const st = await oto.fs.stat(this._k, this._c(n));
    if(!st){ if(opt && opt.create) await oto.fs.mkdir(this._k, this._c(n)); else throw new DOMException('無い', 'NotFoundError'); }
    return new NDir(this._k, this._c(n), n);
  }
  async getFileHandle(n, opt){
    const st = await oto.fs.stat(this._k, this._c(n));
    if(!st){ if(opt && opt.create) await oto.fs.write(this._k, this._c(n), ''); else throw new DOMException('無い', 'NotFoundError'); }
    return new NFile(this._k, this._c(n), n, st ? st.size : 0);
  }
  async removeEntry(n){ await oto.fs.remove(this._k, this._c(n)); }
  async queryPermission(){ return 'granted'; } async requestPermission(){ return 'granted'; }
}

async function putDir(h, key){
  if(NATIVE) return;   // アプリはフォルダの許可をアプリの側で覚える
  try{
    const db = await idb();
    await new Promise((res,rej)=>{
      const t = db.transaction('handles','readwrite');
      t.objectStore('handles').put(h, key || 'last');
      t.oncomplete = res; t.onerror = ()=> rej(t.error);
    });
  }catch(e){}
}
async function getDir(key){
  try{
    const db = await idb();
    return await new Promise((res,rej)=>{
      const t = db.transaction('handles','readonly');
      const q = t.objectStore('handles').get(key || 'last');
      q.onsuccess = ()=> res(q.result || null);
      q.onerror = ()=> rej(q.error);
    });
  }catch(e){ return null; }
}

/* webkitRelativePath と同じ形（フォルダ名/ファイル名）にそろえる。
   folderKey がこれで決まり、聴き終わった本・最後の位置・貯めた語の置き場になる。 */
async function filesFromDir(dir, prefix){
  const out = [];
  for await (const [name, h] of dir.entries()){
    if(h.kind === 'file'){
      const f = await h.getFile();
      f._rel = prefix + name;
      out.push(f);
    }else if(h.kind === 'directory'){
      out.push(...await filesFromDir(h, prefix + name + '/'));
    }
  }
  return out;
}

async function openDir(h, remember){
  pendingHandle = h;
  const files = await filesFromDir(h, h.name + '/');
  if(remember) await putDir(h);
  $('#reopen').hidden = true;
  loadFiles(files);
}

$('#pick').addEventListener('click', async ()=>{
  if(NATIVE){   // iPhone：「ファイル」から教材のフォルダを選ぶ
    const r = await oto.fs.pick('book').catch(() => null);
    if(r) await openDir(new NDir('book', '', r.name), false);
    return;
  }
  if(window.showDirectoryPicker){
    let h = null;
    try{ h = await showDirectoryPicker({id:'otodrill', mode:'read'}); }
    catch(e){ if(e && e.name === 'AbortError') return; }
    if(h){ await openDir(h, true); return; }
  }
  $('#picker').click();
});
$('#picker').addEventListener('change', e => loadFiles([...e.target.files]));

/* 立ち上げ直したとき：許可が残っていればそのまま開く。
   残っていなければ、1回押すだけで戻せるボタンを出す（ブラウザが許可を聞くため）。 */
(async function(){
  if(NATIVE){ const r = await oto.fs.info('book').catch(() => null); if(r) await openDir(new NDir('book', '', r.name), false); return; }
  const h = await getDir();
  if(!h || !h.queryPermission) return;
  const b = $('#reopen');
  b.textContent = '前の ' + h.name + ' を出す';
  b.hidden = false;
  b.addEventListener('click', async ()=>{
    try{
      if(await h.requestPermission({mode:'read'}) !== 'granted') return;
      await openDir(h, false);
    }catch(e){
      b.textContent = '前のフォルダを出せませんでした。選び直してください';
    }
  });
  try{
    if(await h.queryPermission({mode:'read'}) === 'granted') await openDir(h, false);
  }catch(e){}
})();

/* ---------- 一覧の開け閉め ---------- */
/* 一覧が画面の幅を取るのが困る、というところから。閉じても、いま何本目かは下の操作卓に出ている。 */
/* 開け閉めのボタンは2つある。広いときはヘッダー（列ごと消えるので一覧側に置けない）、
   狭いときは一覧の頭（下にたたむので、そこに手掛かりを残す）。状態はひとつ。 */
function paintListToggle(){
  const off = document.querySelector('.app').classList.contains('list-off');
  ['#toggleList','#foldList'].forEach(sel=>{
    $(sel).querySelector('.lbl').textContent = off ? '一覧を出す' : '一覧を隠す';
    $(sel).setAttribute('aria-expanded', String(!off));

/* 文法メモ。1文ずつ書くのではなく「型」を書いて文に当てる。
   （同じ型の練習が何十回も出るので、型で書くほうが行き渡る）
   古い形式（文 → メモ の平たい辞書）もそのまま読める。 */
function matchable(text){
  return ' ' + text.normalize('NFC').toLowerCase().replace(/[,;:"'()\[\]…—–]/g,'').replace(/\s+/g,' ').trim() + ' ';
}

/* 教材のメモに残った記号（⛔⭕）は、画面では言葉にする（2026-10-03 本人「なくしてほしいって言った絵文字がまだ所々についてる」） */
const unmark = t => (t || '').replace(/⛔\s*/g, '注意：').replace(/⭕+\s*/g, '');
function notesFor(text){
  const out = [];
  const flat = !notes.patterns && !notes.sentences;
  const one = flat ? notes[norm(text)] : (notes.sentences || {})[norm(text)];
  if(one) out.push({title:'この文', body:one});
  if(!flat){
    const t = matchable(text);
    // p.not がある型は、その語を含む文では出さない
    // （例：có phải là の文に「phải＝しなければならない」を出さない）
    (notes.patterns || []).forEach(p => {
      if(t.includes(p.match) && !(p.not && t.includes(p.not))) out.push(p);
    });
  }
  return out.slice(0, 3);
}

function tokenize(text){
  return text.split(/(\s+|[.,!?;:"'()\[\]…—–]+)/).filter(Boolean);
}

function syncScript(t){
  if(!sentEls.length) return;
  let hit = -1;
  for(let i=0;i<sentEls.length;i++){
    if(t >= sentEls[i].start && t < sentEls[i].end){ hit = i; break; }
  }
  if(hit === nowSent) return;
  if(nowSent >= 0) sentEls[nowSent].el.classList.remove('now');
  nowSent = hit;
  if(hit >= 0){
    sentEls[hit].el.classList.add('now');
    sentEls[hit].el.scrollIntoView({block:'nearest'});
  }
}

/* ---- 語を引く ---- */
/* ベトナム語は「học sinh」のように音節が組み合わさるので、長いほうから当てる。 */
function bestForm(sentence, at, token){
  const syl = sentence.text.split(/\s+/).map(w => w.replace(/[.,!?;:"'()\[\]…—–]/g,''));
  if(at < 0 || at >= syl.length || syl[at].toLowerCase() !== token.toLowerCase()){
    // 位置が合わないときだけ本文から探す（記号の入り方が想定外だった場合の保険）
    at = syl.findIndex(w => w.toLowerCase() === token.toLowerCase());
  }
  if(at < 0) return {form: token, hit: lex.words[norm(token)] || null};
  for(let n = Math.min(4, syl.length - at); n >= 1; n--){
    const form = syl.slice(at, at+n).join(' ');
    const hit = lex.words[norm(form)];
    if(hit) return {form, hit};
  }
  return {form: token, hit: null};
}

async function lookup(token, at, seg, file){
  const box = $('#lookup');
  const {form, hit} = bestForm(seg, at, token);
  const syls = form.split(/\s+/);

  const han = syls.map(sy => ({sy, m: lex.morphemes[norm(sy)]})).filter(x => x.m);
  box.hidden = false;
  box.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = '<span class="word"></span><button class="close">閉じる</button>';
  head.querySelector('.word').textContent = form;
  head.querySelector('.close').addEventListener('click', ()=> box.hidden = true);
  box.appendChild(head);

  if(han.length){
    const h = document.createElement('div');
    h.className = 'han';
    han.forEach(({sy, m})=>{
      const c = document.createElement('div');
      c.className = 'cell';
      c.innerHTML = '<span class="kanji"></span><span class="yomi"></span>';
      c.querySelector('.kanji').textContent = m.kanji || '？';
      c.querySelector('.yomi').textContent = sy + '　' + [m.on, m.ko].filter(Boolean).join(' ');
      h.appendChild(c);
    });
    box.appendChild(h);
  }

  const gm = glossOf(seg.text) && wordMeaning(token, seg.text);
  if(gm && (!hit || !hit.ja)){
    const g = document.createElement('div');
    g.className = 'gloss';
    g.innerHTML = '<span class="src">この文での意味（自動翻訳・未確認）</span>';
    g.appendChild(document.createTextNode(gm.w + '　' + gm.ja));
    box.appendChild(g);
  }
  if(hit && hit.ja){
    const g = document.createElement('div');
    g.className = 'gloss';
    g.innerHTML = '<span class="src">単語の一覧</span>';
    g.appendChild(document.createTextNode(hit.ja));
    box.appendChild(g);
  }

  const wk = document.createElement('div');
  wk.className = 'gloss';
  wk.innerHTML = '<span class="src">Wiktionary</span>';
  const wkBody = document.createElement('span');
  wkBody.textContent = '引いています…';
  wk.appendChild(wkBody);
  box.appendChild(wk);

  const from = document.createElement('div');
  from.className = 'from';
  from.innerHTML = '<b></b><br><span class="meta"></span>';
  from.querySelector('b').textContent = seg.text;
  from.querySelector('.meta').textContent = file + '　' + fmt(seg.start);
  box.appendChild(from);

  const keep = document.createElement('button');
  keep.className = 'keep';
  const already = kept.some(k => k.form === form && k.sentence === seg.text);
  keep.textContent = already ? '保存済み' : 'この文を保存';
  keep.disabled = already;
  keep.addEventListener('click', ()=>{
    kept.push({form, ja: (hit && hit.ja) || '', kanji: han.map(x => x.m.kanji).join(''),
               sentence: seg.text, file, start: seg.start, at: new Date().toISOString().slice(0,10)});
    save('kept:'+folderKey, kept);
    emit('keep', {f: folderKey, v: kept[kept.length - 1]});
    keep.textContent = '保存済み'; keep.disabled = true;
    paintExport();
  });
  box.appendChild(keep);
  box.appendChild(askEl(ctxOf(seg.text, null)));

  // Wiktionary（無料・鍵なし。引けなくても他の表示は残る）
  try{
    const tryForms = form === token ? [form] : [form, token];
    let defs = null;
    for(const f of tryForms){
      const r = await fetch('https://en.wiktionary.org/api/rest_v1/page/definition/' + encodeURIComponent(f));
      if(!r.ok) continue;
      const d = await r.json();
      if(d[LP.code] && d[LP.code].length){ defs = d[LP.code]; break; }
    }
    wkBody.textContent = defs
      ? defs.slice(0,3).map(e => (e.partOfSpeech ? e.partOfSpeech + '：' : '') +
          e.definitions[0].definition.replace(/<[^>]+>/g,'')).join(' / ')
      : '項目がありません。';
  }catch(e){
    wkBody.textContent = 'いま引けませんでした（通信）。';
  }
}

/* ---- 貯めた語を書き出す ---- */

/* ================= 練習 ================= */
/* practice.json：{decks:[{id,book,title,src,ask,items:[{id,show,say,group,start,end}],confusable:[[id]]}]}
   ⭕ 音声は切らず、元の mp3 の start〜end だけ鳴らす。
   ⭕ 記録は項目の id（vi.letter.a など、本ではなく言語の側の名前）で持つ。別の本に同じ音が出ても記録がつながる。 */

const clip = new Audio();
if(NATIVE) window.__oto = {audio, clip};   // iPhone のアプリの自己試験が再生を確かめるため
clip.preload = 'auto';
/* 鳴らすのは一度に1つ（2026-10-04 本人「同時に2個再生されたりした」）。
   ⭕ トラックの再生（audio）と、文ごとの再生（clip・文だけ聴く）は別の部品なので、後から鳴り始めたほうを残して、もう片方を止める */

let pdata = null, pfiles = {}, purls = {};

let srs = load('srs', {});

let stopAt = 0, raf = 0, stopTimer = 0;

const DAY = 864e5;
const WAIT = [0, 10*60e3, DAY, 3*DAY, 7*DAY, 21*DAY];   // 箱ごとの次までの間

function setPractice(data, files){

/* ---- 小さな組（2026-10-03） ----
   本人「単語は単語、文法は文法とカテゴリー別で分けてくれると、単位があんまり大きくなくて、覚えるときにやる気が出てくる」。
   ⭕ 課（組）の項目を「種類」に分け、さらに SET_SIZE ずつの小さな組にする。組の id は set:<組>:<種類>:<番号>。
   ⭕ 種類は項目の group で決める。教材ごとの呼び名は book.json の groupCategory で対応づける（言語によらない）。 */
const SET_SIZE = 10;
const CATS = [['word', '単語'], ['sentence', '基本の文'], ['grammar', '文法'], ['drill', '問題'], ['sound', '音'], ['other', 'ほか']];
const CATNAME = Object.fromEntries(CATS);
function catOf(it, d){
  const g = it.group || '';
  const m = book && book.groupCategory && book.groupCategory[g];
  if(m) return m;
  if((d || it.deck || {}).kind === 'sound') return 'sound';
  if(/単語|語$/.test(g)) return 'word';
  if(/基本文/.test(g)) return 'sentence';
  if(/公式|文法|例文/.test(g)) return 'grammar';
  if(/練習|問題/.test(g)) return 'drill';
  return 'other';
}
let setMemo = new Map();
function setsOf(d){
  if(setMemo.has(d.id)) return setMemo.get(d.id);
  const by = {};
  d.items.forEach(it => (by[catOf(it, d)] = by[catOf(it, d)] || []).push(it));
  const out = [];
  CATS.forEach(([c]) => {
    const list = by[c]; if(!list) return;
    const n = Math.ceil(list.length / SET_SIZE);
    // 最後の組が小さすぎないよう、均等に割る（23 → 8・8・7）
    const size = Math.ceil(list.length / n);
    for(let k = 0; k < n; k++) out.push({id: 'set:' + d.id + ':' + c + ':' + (k + 1), deck: d, cat: c, n: k + 1, of: n, items: list.slice(k * size, (k + 1) * size)});
  });
  setMemo.set(d.id, out);
  return out;
}
function findSet(id){
  const m = id.match(/^set:(.+):([a-z]+):(\d+)$/);
  if(!m || !pdata) return null;
  const d = pdata.decks.find(x => x.id === m[1]);
  return d ? setsOf(d).find(x => x.cat === m[2] && x.n === Number(m[3])) || null : null;
}
const setDone = st => st.items.every(it => rec(it.id).box >= 1);
const setSeen = st => st.items.filter(it => rec(it.id).box >= 1).length;
/* 組のチップ：種類ごとに 1 2 3 …（済んだ組に印、いまの組は黒） */
function setChipsHTML(decksList, current){
  const rows = {};
  decksList.forEach(d => setsOf(d).forEach(st => (rows[st.cat] = rows[st.cat] || []).push(st)));
  return CATS.filter(([c]) => rows[c]).map(([c, name]) => '<div class="setrow"><span class="setcat">' + name + '</span><div class="setchips">' +
    rows[c].map(st => '<button class="setchip' + (setDone(st) ? ' done' : '') + (st.id === current ? ' on' : '') + '" data-set="' + esc(st.id) + '" title="' +
      esc(st.deck.title) + '　' + setSeen(st) + '/' + st.items.length + '">' + (setDone(st) ? '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>' : '') +
      st.n + '<small>' + st.items.length + '</small></button>').join('') + '</div></div>').join('');
}
/* 同じ課の次の組（その種類の最後なら、次の種類の最初）。まだ済んでいない組を先に */
function nextSet(st){
  const all = setsOf(st.deck), i = all.findIndex(x => x.id === st.id);
  return all.slice(i + 1).find(x => !setDone(x)) || all.slice(0, i).find(x => !setDone(x)) || null;
}
function startSet(id){ runOn = false; pdeck = id; save('p:deck', pdeck); q = null; paintDecks(); setMode('practice'); renderPractice(); }

function decks(){
  if(!pdata) return [];
  if(pdeck.startsWith('set:')){ const st = findSet(pdeck); return st ? [st.deck] : []; }
  if(pdeck.startsWith('lesson:')){
    const x = lessonData().find(x => 'lesson:' + x.L.id === pdeck);
    if(x){ const ids = new Set(x.items.map(i => i.deck.id)); return pdata.decks.filter(d => ids.has(d.id)); }
  }
  return pdata.decks.filter(d => pdeck === 'all' || d.id === pdeck || pdeck === 'sec:' + (d.section || d.book));
}
const srcOf = it => it.src || it.deck.src;   // 1つの組に複数の音声がまたがることがある（文法編は1ユニット4〜6本）
function items(){
  const seen = new Set(), out = [];
  const st = pdeck.startsWith('set:') ? findSet(pdeck) : null;
  const ids = st ? new Set(st.items.map(i => i.id)) : null;
  decks().forEach(d => d.items.forEach(it => { if((!ids || ids.has(it.id)) && !seen.has(it.id)){ seen.add(it.id); out.push({...it, deck:d}); } }));
  return out;
}

/* 組が多い（本1冊で48組）ので、ボタンを並べず選ぶ形にする。
   「編ごと全部」も選べる（sec:文法編 のように持つ）。 */
function sections(){ return [...new Set(pdata.decks.map(d => d.section || d.book))]; }
function paintDecks(){
  const sel = $('#pdecks');
  const lx = pdeck.startsWith('lesson:') ? lessonData().find(x => 'lesson:' + x.L.id === pdeck) : null;
  const sx = pdeck.startsWith('set:') ? findSet(pdeck) : null;
  const ok = pdeck === 'all' || lx || sx || pdata.decks.some(d => d.id === pdeck) || sections().some(s => 'sec:'+s === pdeck);
  if(!ok) pdeck = 'all';
  let html = (sx ? '<option value="' + esc(pdeck) + '">' + esc(sx.deck.title) + '　' + CATNAME[sx.cat] + (sx.of > 1 ? ' ' + sx.n : '') + '（' + sx.items.length + '）</option>' : '') +
    (lx ? '<option value="' + esc(pdeck) + '">この課：' + esc(lx.L.title) + '（' + lx.items.length + '）</option>' : '') +
    '<option value="all">すべて（' + pdata.decks.reduce((n,d)=> n + d.items.length, 0) + '）</option>';
  sections().forEach(s=>{
    const ds = pdata.decks.filter(d => (d.section || d.book) === s);
    html += '<optgroup label="' + esc(s) + '">';
    html += '<option value="sec:' + esc(s) + '">' + esc(s) + ' を全部（' + ds.reduce((n,d)=> n + d.items.length, 0) + '）</option>';
    ds.forEach(d => { html += '<option value="' + esc(d.id) + '">' + esc(d.title) + '（' + d.items.length + '）</option>'; });
    html += '</optgroup>';
  });
  sel.innerHTML = html;
  sel.value = pdeck;
  const pl = $('#plesson');
  pl.hidden = !lx;
  if(lx){ pl.innerHTML = esc(lx.L.title) + ' の課の画面へ<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>'; pl.onclick = ()=> goLesson(lx.L.id); }
}
$('#pdecks').addEventListener('change', e=>{
  pdeck = e.target.value; save('p:deck', pdeck); q = null; renderPractice(); e.target.blur();
});
$('#pviews').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  runOn = false;
  pview = b.dataset.v; save('p:view', pview); q = null; renderPractice(); b.blur();
});

/* ---- 鳴らす：start〜end だけ ---- */
function urlFor(src){
  const f = pfiles[src] || afiles[src];
  if(!purls[src] && f) purls[src] = objURL(f);
  return purls[src];
}
function say(it){
  const src = srcOf(it), f = pfiles[src] || afiles[src];
  if(NATIVE && f && f._url){ nativeAudioURL(f).then(u => sayWith(it, u)).catch(() => {}); return; }
  const u = urlFor(src);
  if(!u) return;
  sayWith(it, u);
}
function sayWith(it, u){
  cancelAnimationFrame(raf); clearTimeout(stopTimer);
  const go = ()=>{
    clip.currentTime = it.start;
    stopAt = it.end;
    clip.play().catch(()=>{});
    // 止める：画面の描き替えごとに見る。窓が裏に回ると描き替えが止まるので、時計でも止める
    const tick = ()=>{ if(clip.currentTime >= stopAt){ clip.pause(); return; } raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    clip.addEventListener('playing', ()=>{
      clearTimeout(stopTimer);
      stopTimer = setTimeout(()=> clip.pause(), Math.max(0, (stopAt - clip.currentTime) * 1000 + 40));
    }, {once:true});
  };
  if(clip.dataset.src !== srcOf(it)){
    clip.dataset.src = srcOf(it);
    clip.src = u;
    clip.addEventListener('loadedmetadata', go, {once:true});
  }else go();
}

/* ---- 記録 ---- */
function rec(id){ return srs[id] || {box:0, due:0, seen:0, miss:0}; }
let hist = load('hist', []);   // [時刻, 項目, 練習, 正誤(1/0)]
function mark(it, ok, skill, gain){
  const r = rec(it.id);
  ansN++; save('ans:n', ansN);   // 答えの通し番号（つまずきの「最近20問」に使う。hist は上限で切られるので別に数える）
  r.seen++;
  hist.push([Date.now(), it.id, skill || pview, ok ? 1 : 0]);
  if(hist.length > 20000) hist = hist.slice(-20000);
  save('hist', hist);
  if(ok){ r.box = Math.min(MAXBOX, r.box + (gain || 1)); }
  else { r.box = 0; r.miss++; }
  r.due = Date.now() + WAIT[r.box];
  r.last = Date.now();
  srs[it.id] = r;
  save('srs', srs);
  emit('ans', {i: it.id, s: skill || pview, o: ok ? 1 : 0, g: gain || 1});
  runAnswered(it, ok);
  paintStat();
  paintSets();
}
function paintStat(){
  const all = items();
  const now = Date.now();
  const due = all.filter(it => rec(it.id).due <= now).length;
  const known = all.filter(it => rec(it.id).box >= 3).length;
  $('#pstat').textContent = '覚えた ' + known + '/' + all.length + '　いま出す ' + due;
}

/* 次に出す1つ：期限が来たものを、箱の低い順・最後に見たのが古い順に */
const words = t => t.replace(/[.,!?;:“”"]/g, '').split(/\s+/).filter(Boolean);
const orderable = it => it.deck.kind === 'text' && words(it.show).length >= 3 && words(it.show).length <= 12;
const clozable = it => it.deck.kind === 'text' && words(it.show).length >= 2 && words(it.show).length <= 14;
// 書く：文と語、発音編の語（ma・cam など）。字の名前（A a）と音の断片（-ng）は書く対象にしない
const typable = it => it.deck.kind === 'text' || (!/[\s\/]/.test(it.show) && !/^-/.test(it.show) && it.group !== 'letter');
/* ---- 定着する問い（2026-10-03・仕様 20261003_oto-drill-定着する問い_仕様 の B案）----
   本人「聞いた音声をそのまま選んで当てる問題はあんまり練習になってない」「長期記憶・定着、構文や文法が習熟する観点で」。
   ⭕ 選ぶより思い出して書く・言う／日本語の意味とベトナム語の形を行き来する／文法を使って書き換える・答える。
   ⭕ 同じ文を当てる「聴いて選ぶ」と「見て言う」は、字と音の聞き分け（発音編）だけに残す。 */
function jaOf(it){
  const g = glossOf(it.show) || glossOf((it.show || '').replace(/[.。]$/, ''));
  if(g && g.ja) return g.ja;
  if(catOf(it, it.deck) === 'word'){ const m = wordMeaning(it.show, it.show); if(m) return m.ja; }
  return null;
}
const isSound = it => it.deck.kind === 'sound';
const FILTER = {order: orderable, cloze: clozable, type: typable,
  hear: isSound, say: isSound,
  mean: it => !isSound(it) && !!jaOf(it),
  build: it => orderable(it) && !!jaOf(it),
  gap: it => clozable(it) && !!jaOf(it),
  speak: it => !isSound(it) && !!jaOf(it),
  write: it => !isSound(it) && !!jaOf(it) && words(it.show).length <= 12};
const DRILLV = {transform: 'transform', respond: 'respond'};
function drillItem(d){
  const deck = (pdata && pdata.decks.find(x => x.id === d.deck)) || {id: d.deck, kind: 'text', book: '', title: '', items: []};
  return {id: 'drill:' + d.id, show: d.answer, deck, drill: d, group: 'drill'};
}
function drillsIn(kind, deckIds){ return drills.filter(d => d.kind === kind && (!deckIds || deckIds.has(d.deck))); }
function nextItem(prevId){
  const now = Date.now();
  const all = DRILLV[pview] ? drillsIn(pview, new Set(decks().map(d => d.id))).map(drillItem)
    : FILTER[pview] ? items().filter(FILTER[pview]) : items();
  let pool = all.filter(it => it.id !== prevId);
  if(!pool.length) pool = all;
  if(!pool.length) return null;
  const due = pool.filter(it => rec(it.id).due <= now);
  const from = due.length ? due : pool;
  from.sort((a,b)=> (rec(a.id).box - rec(b.id).box) || ((rec(a.id).last||0) - (rec(b.id).last||0)) || (Math.random() - .5));
  const head = from.filter(it => rec(it.id).box === rec(from[0].id).box).slice(0, 5);
  return head[Math.floor(Math.random() * head.length)];
}

/* 選択肢：取り違えやすい組から先に、足りなければ同じ課の同じ種類から、それでも足りなければ同じ本のほかの課の同じ種類から
   ⭕ 2026-10-03 本人「単語のところに単語以外の音も混ざっている」：単語の問いに文の選択肢を混ぜない（形で答えが分かってしまう） */
function choicesFor(it){
  const d = it.deck, cat = catOf(it, d);
  const same = x => catOf(x, x.deck || d) === cat;
  const byId = Object.fromEntries(d.items.map(x => [x.id, x]));
  const near = new Set();
  (d.confusable || []).forEach(g => { if(g.includes(it.id)) g.forEach(id => { if(id !== it.id && byId[id]) near.add(id); }); });
  const pick = [...near].sort(()=> Math.random() - .5).slice(0, 3);
  let rest = d.items.filter(x => x.id !== it.id && !pick.includes(x.id) && same(x)).map(x => x.id).sort(()=> Math.random() - .5);
  if(pick.length + rest.length < 3 && pdata){
    // 同じ本のほかの課から、同じ種類を借りる
    const seen = new Set([it.id, ...pick, ...rest].map(id => norm(byId[id] ? byId[id].show : '')));
    pdata.decks.filter(o => o !== d && o.book === d.book && o.kind === d.kind).forEach(o => o.items.forEach(x => {
      if(catOf(x, o) === cat && !seen.has(norm(x.show))){ seen.add(norm(x.show)); byId[x.id] = Object.assign({}, x, {deck: o}); rest.push(x.id); }
    }));
    rest = rest.sort(()=> Math.random() - .5);
  }
  if(d.kind === 'text'){
    // 文の組：言葉が重なるもの・長さが近いものを先に（まったく違う文だと、聞かなくても選べてしまう）
    const mine = new Set(words(it.show.toLowerCase()));
    const score = id => { const w = words(byId[id].show.toLowerCase());
      return w.filter(x => mine.has(x)).length * 2 - Math.abs(w.length - mine.size) * .5 + Math.random(); };
    rest = rest.filter(id => byId[id].show.toLowerCase() !== it.show.toLowerCase())
               .sort((a,b)=> score(b) - score(a));
    rest = rest.slice(0, 6).sort(()=> Math.random() - .5).concat(rest.slice(6));
  }
  while(pick.length < 3 && rest.length) pick.push(rest.shift());
  return [it.id, ...pick].sort(()=> Math.random() - .5).map(id => ({...byId[id], deck: byId[id].deck || d}));
}

/* ---- 描く ---- */
function paintSets(){
  const box = $('#psets'); if(!box) return;
  let ds = [];
  if(pdeck.startsWith('set:')){ const st = findSet(pdeck); if(st) ds = [st.deck]; }

  else if(pdeck !== 'all' && !pdeck.startsWith('sec:')){ const d = pdata.decks.find(d => d.id === pdeck); if(d) ds = [d]; }

function meanChoices(it){
  const mine = jaOf(it), cat = catOf(it, it.deck);
  const seen = new Set([mine]), pool = [];
  const add = x => { const j = jaOf(x); if(j && !seen.has(j) && catOf(x, x.deck) === cat){ seen.add(j); pool.push({id: x.id, ja: j}); } };
  it.deck.items.forEach(x => add({...x, deck: it.deck}));
  if(pool.length < 6 && pdata) pdata.decks.filter(d => d !== it.deck && d.book === it.deck.book && d.kind === it.deck.kind).forEach(d => d.items.forEach(x => add({...x, deck: d})));
  // 長さの近い意味を先に（短い語に長い文の訳が並ぶと、聞かずに分かってしまう）
  const near = pool.map(c => [c, Math.abs(c.ja.length - mine.length) + Math.random() * 6]).sort((a, b) => a[1] - b[1]).slice(0, 3).map(x => x[0]);
  return [{id: it.id, ja: mine}, ...near].sort(() => Math.random() - .5);
}
function answerMean(c){

function writeInput(id, placeholder, onEnter, onTab){

    if(q) q.draft = inp.value;
  });
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); onEnter(inp.value); }

function telexOpt(inp){

/* 書いた答えを、正しい答え（いくつか）のうち一番近いものと比べる */
function gradeAgainst(answers, typed){
  let best = null;
  answers.filter(Boolean).forEach(a => {
    const res = checkTyped(a, typed), n = res.filter(r => r.k === 'ok').length - res.filter(r => r.k !== 'ok' && r.k !== 'near').length;
    if(!best || n > best.n) best = {a, res, n};
  });
  const ok = best.res.every(r => r.k === 'ok'), close = !ok && best.res.every(r => r.k === 'ok' || r.k === 'near');
  return {answer: best.a, res: best.res, ok, close};
}
function diffEl(res){
  const diff = document.createElement('div'); diff.className = 'diff';
  diff.innerHTML = res.map(r => {
    if(r.k === 'ok') return '<span class="w ok">' + esc(r.t) + '</span>';
    if(r.k === 'near') return '<span class="w near" title="あなた：' + esc(r.y) + '">' + esc(r.t) + '<small>' + esc(r.y) + '</small></span>';
    if(r.k === 'wrong') return '<span class="w bad" title="あなた：' + esc(r.y) + '">' + esc(r.t) + '<small>' + esc(r.y) + '</small></span>';
    if(r.k === 'miss') return '<span class="w miss">' + esc(r.t) + '<small>抜け</small></span>';
    return '<span class="w extra"><s>' + esc(r.y) + '</s><small>余り</small></span>';
  }).join(' ');
  return diff;
}

/* ---- タイピング入門：Telex の打ち方を、字 → 声調 → 組み合わせ → 教材の単語 の順に ---- */
// ベトナム語の語を、Telex で打つキーの並びにする（例：người → nguwowif）
function toTelex(text){
  const TK = {'́': 's', '̀': 'f', '̉': 'r', '̃': 'x', '̣': 'j'};
  const L = {'â': 'aa', 'ă': 'aw', 'ê': 'ee', 'ô': 'oo', 'ơ': 'ow', 'ư': 'uw', 'đ': 'dd'};
  return text.split(/(\s+)/).map(w => {
    if(/^\s+$/.test(w)) return w;
    let tone = '';
    const d = w.normalize('NFD').replace(/[̣́̀̉̃]/g, m => { tone = TK[m]; return ''; }).normalize('NFC');
    return [...d].map(c => { const lo = c.toLowerCase(); const t = L[lo]; return t ? (c === lo ? t : t[0].toUpperCase() + t.slice(1)) : c; }).join('') + tone;
  }).join('');
}
let tq = null;   // {lesson, items:[[vi, ja]], i, miss, hint, got}
function typingItems(L){
  if(!L.book) return L.items.slice();
  const pool = items().filter(it => !isSound(it) && catOf(it, it.deck) === 'word' && jaOf(it) && words(it.show).length <= 3);
  return pool.sort(() => Math.random() - .5).slice(0, 10).map(it => [it.show.replace(/[.。]$/, ''), jaOf(it)]);
}
function renderTyping(){
  const body = $('#pbody'), T = LP.typing;
  body.innerHTML = '';

  if(!tq){

    box.innerHTML = '<section class="howto"><b>ベトナム語のタイピング（Telex という打ち方）</b>' +
      '<p class="tl">ふつうのキーボードで打てます。記号の付いた字は2つ続けて打ち、声調は語の最後に1文字打ちます。</p>' +
      '<div class="tkeys">' + T.how.map(([k, c]) => '<span><kbd>' + k + '</kbd>→<b lang="vi">' + c + '</b></span>').join('') + '</div>' +
      '<div class="tkeys">' + T.tones.map(([k, c, n]) => '<span><kbd>' + k + '</kbd>→<b lang="vi">' + c + '</b><small>' + n + '</small></span>').join('') + '</div>' +
      '<p class="tl">例：<kbd>nguwowif</kbd> → <b lang="vi">người</b>　<kbd>Vieejt</kbd> → <b lang="vi">Việt</b>　<kbd>ddeepj</kbd> → <b lang="vi">đẹp</b></p>' +
      '<p>この画面の打ち方は、Mac の入力ソース「ベトナム語 Telex」と同じです。Mac の入力ソースで打つときは、下の「画面の Telex で打つ」を外してください。iPhone は、キーボードに「ベトナム語」を足して Telex を選びます。</p></section>' +
      '<div class="tlessons">' + T.lessons.map(L => '<button class="tlesson" data-t="' + L.id + '"><b>' + esc(L.title) + '</b><small>' + esc(L.note) + '</small>' +
        (best[L.id] != null ? '<em>最高 ' + best[L.id] + '%</em>' : '') + '</button>').join('') + '</div>';
    box.querySelectorAll('.tlesson').forEach(b => b.addEventListener('click', () => {
      const L = T.lessons.find(x => x.id === b.dataset.t), its = typingItems(L);
      if(!its.length){ toast('この教材には、打てる単語がありません'); return; }
      tq = {lesson: L, items: its, i: 0, miss: 0, wrongs: 0, hint: false}; renderTyping();
    }));
    body.appendChild(box); return;
  }
  const L = tq.lesson;

    const sc = Math.round((tq.items.length - tq.wrongs) / tq.items.length * 100);
    const best = load('typing:best', {}); if(best[L.id] == null || sc > best[L.id]){ best[L.id] = sc; save('typing:best', best); }
    box.innerHTML = '<div class="result ok"><div class="rtitle">' + esc(L.title) + '</div><div class="rscore">' + sc + '%<small>1回目で打てた ' + (tq.items.length - tq.wrongs) + ' / ' + tq.items.length + '</small></div>' +
      '<div class="row"><button class="primary" id="tagain">もう一度</button><button id="tback">タイピングの最初へ</button></div></div>';
    body.appendChild(box);
    $('#tagain').onclick = () => { tq = {lesson: L, items: typingItems(L), i: 0, miss: 0, wrongs: 0, hint: false}; renderTyping(); };
    $('#tback').onclick = () => { tq = null; renderTyping(); };
    return;
  }
  const [vi, ja] = tq.items[tq.i];
  box.innerHTML = '<div class="from">' + esc(L.title) + '　' + (tq.i + 1) + ' / ' + tq.items.length + '</div>' +
