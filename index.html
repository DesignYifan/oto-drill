}
function gradeType(v){
  const res = checkTyped(q.it.show, v);
  q.res = res; q.done = true;
  q.ok = res.every(r => r.k === 'ok');
  q.close = !q.ok && res.every(r => r.k === 'ok' || r.k === 'near');
  mark(q.it, q.ok, 'type', 2);   // 音だけから書けたら、箱を2つ上げる
  if(q.ok) typedOk(q.it);
  say(q.it);
  renderType();
}
let typed = new Set(load('typed', []));   // 書いて正解した語
function typedOk(it){ words(it.show).forEach(w => typed.add(w.toLowerCase())); save('typed', [...typed]); }

/* ---- 並べる：文をばらした語を、聞いた順に押して組み立てる ---- */
function orderQ(it){
  if(!it) return null;
  const w = words(it.show);
  const tiles = w.map((x,i)=> ({x,i}));
  do { tiles.sort(()=> Math.random() - .5); } while(tiles.every((t,i)=> t.i === i));
  return {it, done:false, heard:false, tiles, picked:[]};
}
function renderOrder(){
  const body = $('#pbody');
  if(!q) q = orderQ(nextItem(null));
  if(!q){ body.innerHTML = '<div class="quiz"><div class="pnote">この組には並べられる文がありません。文法編やまとめ問題を選んでください</div></div>'; return; }
  const it = q.it, w = words(it.show);
  body.innerHTML = '';
  const box = document.createElement('div'); box.className = 'quiz';
  box.innerHTML = '<div class="from">' + esc(it.deck.book + '　' + it.deck.title) + '</div>';
  const hear = document.createElement('button'); hear.className = 'primary hear'; hear.textContent = 'もう一度聞く';
  hear.addEventListener('click', ()=>{ say(it); hear.blur(); });
  box.appendChild(hear);

  const slots = document.createElement('div'); slots.className = 'slots';
  q.picked.forEach((ti, k)=>{
    const b = document.createElement('button'); b.textContent = q.tiles[ti].x;
    if(!q.done) b.addEventListener('click', ()=>{ q.picked.splice(k, 1); renderOrder(); });   // 押すと戻せる
    slots.appendChild(b);
  });
  if(q.done) slots.classList.add(q.ok ? 'right' : 'wrong');
  box.appendChild(slots);

  const tiles = document.createElement('div'); tiles.className = 'tiles';
  q.tiles.forEach((t, ti)=>{
    if(q.picked.includes(ti)) return;
    const b = document.createElement('button'); b.textContent = t.x;
    b.addEventListener('click', ()=>{
      q.picked.push(ti);
      if(q.picked.length === w.length){
        q.done = true;
        q.ok = q.picked.map(i => q.tiles[i].x.toLowerCase()).join(' ') === w.map(x => x.toLowerCase()).join(' ');
        mark(it, q.ok, 'order'); say(it);
      }
      renderOrder();
    });
    tiles.appendChild(b);
  });
  box.appendChild(tiles);

  const note = document.createElement('div'); note.className = 'pnote';
  note.textContent = q.done ? (q.ok ? '正解' : '正しくは「' + it.show + '」') : '聞こえた順に語を押してください。並べた語を押すと戻せます';
  box.appendChild(note);
  if(q.done) box.appendChild(nextRow());
  box.insertAdjacentHTML('beforeend', '<div class="pkeys"><kbd>space</kbd> もう一度聞く　<kbd>enter</kbd> 次へ</div>');
  body.appendChild(box);
  if(!q.heard){ q.heard = true; setTimeout(()=> say(it), 150); }
}

function answerSay(ok){ q.done = true; mark(q.it, ok, 'say'); nextQ(); }
function nextRow(){
  const row = document.createElement('div'); row.className = 'row';
  const b = document.createElement('button'); b.className = 'primary'; b.textContent = '次へ';
  b.addEventListener('click', nextQ);
  row.appendChild(b);
  setTimeout(()=> b.focus(), 0);
  return row;
}
function nextQ(){
  const prev = q && q.it.id;
  const it = nextItem(prev);
  if(pview === 'order'){ q = orderQ(it); renderOrder(); return; }
  if(pview === 'cloze'){ q = clozeQ(it); renderCloze(); return; }
  if(pview === 'type'){ q = it ? {it, done:false, heard:false} : null; renderType(); return; }
  if(!it){ q = null; renderQuiz(); return; }
  q = {it, done:false, heard:false, choices: pview === 'hear' ? choicesFor(it) : null};
  renderQuiz();
}

document.addEventListener('keydown', e=>{
  if(mode !== 'practice' || !q || pview === 'table') return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if(pview === 'type'){   // 書く欄の中では space と enter を欄に任せる
    if(e.target.id === 'typein') return;
    if(k === 'Enter' && q.done){ e.preventDefault(); nextQ(); }
    return;
  }
  if(pview === 'cloze'){
    if(!q.done && /^[1-4]$/.test(k)){ const c = q.opts[Number(k)-1]; if(c) answerCloze(c); }
    else if(k === ' '){ e.preventDefault(); if(q.done) say(q.it); }
    else if(k === 'Enter' && q.done){ e.preventDefault(); nextQ(); }
    return;
  }
  if(pview === 'order'){
    if(k === ' '){ e.preventDefault(); say(q.it); }
    else if(k === 'Enter' && q.done){ e.preventDefault(); nextQ(); }
    return;
  }
  if(pview === 'hear'){
    if(!q.done && /^[1-4]$/.test(k)){ const c = q.choices[Number(k)-1]; if(c){ q.done = true; q.picked = c.id; mark(q.it, c.id === q.it.id, 'hear'); renderQuiz(); } }
    else if(k === ' '){ e.preventDefault(); say(q.it); }
    else if(k === 'Enter' && q.done){ e.preventDefault(); nextQ(); }
  }else{
    if(k === ' '){ e.preventDefault(); if(!q.heard){ q.heard = true; say(q.it); renderQuiz(); } else say(q.it); }
    else if(q.heard && !q.done && k === 'ArrowRight'){ e.preventDefault(); answerSay(true); }
    else if(q.heard && !q.done && k === 'ArrowLeft'){ e.preventDefault(); answerSay(false); }
  }
});

/* ================= 見渡す ================= */
/* どこまで覚えたかを、項目・語・練習の3つの目で見る。数え方は README と実現方式に書いた。 */
const SKILL = [['hear','聞いて選ぶ'], ['order','並べる'], ['cloze','穴埋め'], ['type','聞いて書く'], ['say','見て言う']];
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); };
function level(id){ const r = rec(id); return r.box >= 3 ? 2 : (r.seen > 0 ? 1 : 0); }   // 0 未着手 1 覚えかけ 2 覚えた

function stackBar(counts, total){
  const lab = ['未着手','覚えかけ','覚えた'];
  return '<div class="sbar">' + [2,1,0].filter(k => counts[k]).map(k =>
    '<i class="lv' + k + '" style="flex:' + counts[k] + '" title="' + lab[k] + '　' + counts[k] + '/' + total + '"></i>').join('') + '</div>';
}

function renderOverview(){
  const box = $('#overview');
  if(!pdata){ box.innerHTML = ''; return; }
  // すべての項目（id で1つに）
  const all = new Map();
  pdata.decks.forEach(d => d.items.forEach(it => { if(!all.has(it.id)) all.set(it.id, {...it, deck:d}); }));
  const list = [...all.values()];
  const known = list.filter(it => level(it.id) === 2).length;

  // 語：文と語の組に出てくる語。その語を含む項目のうち一番進んだ段で色を付ける
  const wmap = new Map();
  list.filter(it => it.deck.kind === 'text').forEach(it => words(it.show).forEach(w0 => {
    const w = w0.toLowerCase(); if(!/\p{L}/u.test(w)) return;
    const e = wmap.get(w) || {w, n:0, lv:0, items:[]};
    e.n++; e.lv = Math.max(e.lv, level(it.id)); e.items.push(it);
    wmap.set(w, e);
  }));
  const wl = [...wmap.values()].sort((a,b)=> b.n - a.n || a.w.localeCompare(b.w, 'vi'));
  const wSeen = wl.filter(e => e.lv > 0).length;

  const today = dayKey(Date.now());
  const perDay = {};
  hist.forEach(h => { const k = dayKey(h[0]); perDay[k] = (perDay[k] || 0) + 1; });
  let streak = 0;
  for(let t = Date.now(); ; t -= DAY){ if(perDay[dayKey(t)]) streak++; else if(dayKey(t) !== today) break; if(streak > 999) break; }

  let html = '<div class="tiles4">' +
    tile('覚えた項目', known, list.length) +
    tile('出会った語', wSeen, wl.length) +
    tile('今日答えた数', perDay[today] || 0, null) +
    tile('続けた日数', streak, null) + '</div>';

  html += '<div class="legend ov"><span class="lg"><i class="lv2"></i>覚えた（箱3以上）</span><span class="lg"><i class="lv1"></i>覚えかけ</span><span class="lg"><i class="lv0"></i>未着手</span></div>';

  // 編とユニットの帯
  html += '<div class="ovgrid">';
  sections().forEach(sec => {
    const ds = pdata.decks.filter(d => (d.section || d.book) === sec);
    const ids = new Set(ds.flatMap(d => d.items.map(i => i.id)));
    const c = [0,0,0]; ids.forEach(id => c[level(id)]++);
    html += '<section class="ovsec"><div class="ovhead"><b>' + esc(sec) + '</b><span>' + c[2] + ' / ' + ids.size + '</span></div>' + stackBar(c, ids.size);
    ds.forEach(d => {
      const cc = [0,0,0]; d.items.forEach(i => cc[level(i.id)]++);
      html += '<button class="ovrow" data-deck="' + esc(d.id) + '" title="押すとこの組の練習へ"><span class="nm">' + esc(d.title) + '</span>' +
        stackBar(cc, d.items.length) + '<span class="ct">' + cc[2] + '/' + d.items.length + '</span></button>';
    });
    html += '</section>';
  });
  html += '</div>';

  // 練習ごとの正答率（直近50回）
  html += '<h3 class="ovh">練習ごとの正答率<small>それぞれ直近50回</small></h3><div class="skills">';
  SKILL.forEach(([k, name]) => {
    const hs = hist.filter(h => h[2] === k).slice(-50);
    const rate = hs.length ? Math.round(hs.reduce((n,h)=> n + h[3], 0) / hs.length * 100) : null;
    html += '<div class="skill"><span class="nm">' + name + '</span><div class="track1"><i style="width:' + (rate || 0) + '%"></i></div>' +
      '<span class="ct">' + (rate === null ? 'まだ' : rate + '%　' + hs.length + '回') + '</span></div>';
  });
  html += '</div>';

  // 12週の積み上げ
  html += '<h3 class="ovh">12週の積み上げ<small>1日に答えた数</small></h3>' + heatmap(perDay);

  // 語の地図
  const wf = load('ov:wf', 'all');
  const cnt = [0,0,0]; wl.forEach(e => cnt[e.lv]++);
  html += '<h3 class="ovh">語の地図<small>よく出る語から。色はその語を含む文の進み具合、下線は書いて正解した語。押すと鳴る</small></h3>' +
    '<div class="seg wf">' + [['all','すべて ' + wl.length], ['2','覚えた ' + cnt[2]], ['1','覚えかけ ' + cnt[1]], ['0','未着手 ' + cnt[0]]]
      .map(([k,l]) => '<button data-wf="' + k + '"' + (wf === k ? ' class="on"' : '') + '>' + l + '</button>').join('') + '</div>' +
    '<div class="wmap">' + wl.filter(e => wf === 'all' || String(e.lv) === wf).map(e =>
      '<button class="wchip lv' + e.lv + (typed.has(e.w) ? ' typed' : '') + '" data-w="' + esc(e.w) + '" title="' + e.n + 'の文に出てくる">' + esc(e.w) + '</button>').join('') + '</div>';

  // 苦手
  const weak = list.filter(it => rec(it.id).miss > 0).sort((a,b)=> rec(b.id).miss - rec(a.id).miss).slice(0, 12);
  html += '<h3 class="ovh">よく間違えるもの</h3>' + (weak.length ? '<div class="weak">' + weak.map(it =>
    '<button class="wk" data-id="' + esc(it.id) + '"><span>' + esc(it.show) + '</span><small>' + esc(it.deck.title) + '　×' + rec(it.id).miss + '</small></button>').join('') + '</div>'
    : '<p class="pnote" style="text-align:left">まだありません</p>');

  box.innerHTML = html;
  box.querySelectorAll('.ovrow').forEach(b => b.addEventListener('click', ()=>{
    pdeck = b.dataset.deck; save('p:deck', pdeck); q = null; paintDecks(); setMode('practice');
  }));
  box.querySelectorAll('[data-wf]').forEach(b => b.addEventListener('click', ()=>{ save('ov:wf', b.dataset.wf); renderOverview(); }));
  box.querySelectorAll('.wchip').forEach(b => b.addEventListener('click', ()=>{
    const e = wmap.get(b.dataset.w);
    const it = e.items.slice().sort((x,y)=> x.show.length - y.show.length)[0];   // 一番短い項目（多くはその語だけ）を鳴らす
    say(it);
  }));
  box.querySelectorAll('.wk').forEach(b => b.addEventListener('click', ()=> say(all.get(b.dataset.id))));
}
function tile(label, n, total){
  return '<div class="tile"><div class="eyebrow">' + label + '</div><div class="big">' + n +
    (total !== null ? '<small> / ' + total + '</small>' : '') + '</div></div>';
}
function heatmap(perDay){
  // 列＝週（古い→新しい）、行＝月〜日。色は1色の濃淡（多いほど濃い）
  const end = new Date(); end.setHours(0,0,0,0);
  const dow = (end.getDay() + 6) % 7;             // 月曜を0に
  const start = new Date(end.getTime() - (7*11 + dow) * DAY);
  const max = Math.max(1, ...Object.values(perDay));
  let cells = '';
  for(let w = 0; w < 12; w++){
    cells += '<div class="hcol">';
    for(let d = 0; d < 7; d++){
      const t = start.getTime() + (w*7 + d) * DAY;
      if(t > end.getTime()){ cells += '<i class="h none"></i>'; continue; }
      const n = perDay[dayKey(t)] || 0;
      const lv = n === 0 ? 0 : Math.min(4, 1 + Math.floor(n / max * 3.999));
      const dt = new Date(t);
      cells += '<i class="h h' + lv + '" title="' + (dt.getMonth()+1) + '/' + dt.getDate() + '　' + n + '問"></i>';
    }
    cells += '</div>';
  }
  return '<div class="heat"><div class="hdays"><span>月</span><span></span><span>水</span><span></span><span>金</span><span></span><span>日</span></div>' + cells +
    '</div><div class="legend ov"><span class="lg">少ない</span><i class="h h1"></i><i class="h h2"></i><i class="h h3"></i><i class="h h4"></i><span class="lg">多い</span></div>';
}

/* ================= 教材 ================= */
/* 教材ごとに、進み具合・紙の問題・文法・語彙を1か所で見る（本人 2026-09-30）。
   教材＝開いたフォルダ。課はフォルダの中の book.json で決める（無ければサブフォルダで仮に切る）。
   ⭕ 練習の箱と履歴は言語の側の id のまま全教材で1つ。教材ごとの数字は、その教材の項目で絞って数える。
   ⭕ 紙の問題の記録は足していくだけ。上書きしない（やり直した回も残る）。 */

let book = null, bookId = '';
let bview = load('b:view', 'progress');
let bopen = null;      // 文法で開いている型
const PAPER = {o:['○',1], s:['△',.5], x:['×',0]};

function setBook(data){
  book = data && Array.isArray(data.lessons) ? data : null;
  bookId = (book && book.id) || folderKey;
  // 教材の一覧に載せる。手掛かりは教材ごとに覚える（一覧から開き直すため）
  const lib = load('books', {});
  lib[bookId] = {title: (book && book.title) || folderKey, folder: folderKey, lessons: lessons().length, last: Date.now()};
  save('books', lib);
  if(lastHandle) putDir(lastHandle, 'book:' + bookId);
  lessonCache = null; shows = null;
  if(mode === 'book') renderBook();
}

/* 課の並び。book.json が無いときは、サブフォルダごと（無ければ全体で1つ） */
function lessons(){
  if(book) return book.lessons;
  const subs = [...new Set(tracks.map(t => t.rel.split('/')).filter(a => a.length > 2).map(a => a[1]))];
  if(subs.length) return subs.map(sb => ({id: sb, title: sb, folder: sb}));
  return [{id: 'all', title: '全体'}];
}
function inLesson(L, t){
  if(L.match){
    if(L._re === undefined){ try{ L._re = new RegExp(L.match, 'i'); }catch(e){ L._re = null; } }
    return !!L._re && L._re.test(t.name);
  }
  if(L.tracks) return L.tracks.includes(t.name);
  if(L.folder) return t.rel.split('/')[1] === L.folder;
  return L.id === 'all';
}

/* 課ごとに：音声・本文の文・練習の項目。開くたびに数えるのは重いので1回だけ */
let lessonCache = null;
function lessonData(){
  if(lessonCache) return lessonCache;
  const ls = lessons();
  const allItems = pdata ? pdata.decks.flatMap(d => d.items.map(it => ({...it, deck: d}))) : [];
  lessonCache = ls.map(L => {
    const ts = tracks.filter(t => inLesson(L, t));
    const names = new Set(ts.map(t => t.name));
    const sents = [];
    ts.forEach(t => ((script && script[t.name]) ? script[t.name].segments : []).forEach(seg =>
      sents.push({file: t.name, seg, m: matchable(seg.text), n: ' ' + norm(seg.text) + ' ', long: norm(seg.text).split(' ').length >= 3})));
    const dk = new Set(L.decks || []);
    const its = allItems.filter(it => dk.has(it.deck.id) || names.has(srcOf(it)));
    return {L, tracks: ts, sents, items: its, ids: new Set(its.map(i => i.id))};
  });
  return lessonCache;
}

/* 語と型を、最初に出てくる課に寄せる（lesson が書いてあればそちら） */
function firstLesson(text, given){
  const ld = lessonData();
  if(given){ const i = ld.findIndex(x => x.L.id === given); if(i >= 0) return i; }
  // 文法の型は前後の空白まで含めて書いてある（matchable と突き合わせる）。語は記号を落とした本文と突き合わせる
  const isPat = text.startsWith(' ');
  const m = isPat ? text : ' ' + norm(text) + ' ';
  // ⛔ 発音の練習の1語だけの区間（「Đã」など）で課を決めない。3語以上の文で探し、無ければ何でも
  // book.json で assign:false の課（発音の練習など）は、ほかに無いときだけ使う
  const f = s => (isPat ? s.m : s.n).includes(m);
  for(const ok of [x => x.L.assign !== false && x.sents.some(s => s.long && f(s)), x => x.sents.some(s => s.long && f(s)), x => x.sents.some(f)]){
    const i = ld.findIndex(ok); if(i >= 0) return i;
  }
  return -1;
}
function sentsWith(m, li, field){
  field = field || 'm';
  const ld = lessonData();
  const pool = li >= 0 ? ld[li].sents.concat(...ld.filter((_, i) => i !== li).map(x => x.sents)) : ld.flatMap(x => x.sents);
  const hit = pool.filter(s => s[field].includes(m));
  return hit.filter(s => s.long).concat(hit.filter(s => !s.long));
}
function playSent(s){ say({src: s.file, start: s.seg.start, end: s.seg.end, deck: {}}); }

/* 語の覚えた具合：その語を含む練習の項目のうち、一番進んだ段 */
let wlMemo = new Map(), shows = null;
function wordLevel(w){
  if(wlMemo.has(w)) return wlMemo.get(w);
  let lv = typed.has(w) ? 2 : 0;
  if(pdata){
    if(!shows) shows = pdata.decks.flatMap(d => d.items.map(it => [' ' + norm(it.show) + ' ', it.id]));
    const m = ' ' + w + ' ';
    for(const [sh, id] of shows){ if(lv === 2) break; if(sh.includes(m)) lv = Math.max(lv, level(id)); }
  }
  wlMemo.set(w, lv);
  return lv;
}

function vocab(){
  const ld = lessonData();
  const out = ld.map(() => []);
  const rest = [];
  const seen = new Set();
  const put = (li, e) => { if(seen.has(e.w)) return; seen.add(e.w); (li >= 0 ? out[li] : rest).push(e); };
  Object.entries(lex.words || {}).forEach(([w, v]) => {
    const k = norm(w);
    put(firstLesson(k, v.lesson), {w: k, ja: v.ja || '', mo: v.morphemes});
  });
  kept.forEach(k => {
    const w = norm(k.form);
    const li = ld.findIndex(x => x.tracks.some(t => t.name === k.file));
    put(li, {w, ja: k.ja || '', kept: true});
  });
  // 台帳が無い教材：本文に出た語（1音節ずつ）を、最初に出た課に置く
  if(!Object.keys(lex.words || {}).length){
    ld.forEach((x, li) => x.sents.forEach(s => s.n.trim().split(' ').forEach(w => {
      if(/^\p{L}+$/u.test(w) && !/^\d/.test(w)) put(li, {w, ja: '', syl: true});
    })));
  }
  const keptSet = new Set(kept.map(k => norm(k.form)));
  out.concat([rest]).forEach(a => a.forEach(e => { e.kept = e.kept || keptSet.has(e.w); }));
  return {out, rest};
}

function grammar(){
  const ld = lessonData();
  const out = ld.map(() => []), rest = [];
  (notes.patterns || []).forEach(p => {
    const li = firstLesson(p.match, p.lesson);
    (li >= 0 ? out[li] : rest).push({...p, li});
  });
  return {out, rest};
}

/* ---- 紙の問題 ---- */
function paperDefs(){
  const own = load('paperdef:' + bookId, {});
  const ls = lessons();
  const defs = {};
  ls.forEach(L => { defs[L.id] = (L.exercises || []).concat(own[L.id] || []); });
  return defs;
}
function paperRecs(){ return load('paper:' + bookId, []); }
function paperLatest(){
  const last = {};
  paperRecs().forEach(r => { last[r.l + '|' + r.ex + '|' + r.n] = r; });
  return last;
}
function paperScore(lid, defs, last){
  let got = 0, tot = 0, done = 0;
  (defs[lid] || []).forEach(ex => { for(let n = 1; n <= ex.count; n++){
    tot++; const r = last[lid + '|' + ex.id + '|' + n]; if(r){ done++; got += PAPER[r.r][1]; }
  }});
  return {got, tot, done};
}

function rateOf(ids){
  const hs = hist.filter(h => ids.has(h[1])).slice(-50);
  return hs.length ? {r: Math.round(hs.reduce((n, h) => n + h[3], 0) / hs.length * 100), n: hs.length} : null;
}

function renderBook(){
  const box = $('#book');
  wlMemo = new Map();
  const lib = load('books', {});
  const ld = lessonData();
  const title = (book && book.title) || folderKey || '（未読み込み）';

  // 教材の一覧
  let html = '<h3 class="ovh" style="margin-top:0">教材<small>開いたことのある教材。押すとそのフォルダを開く</small></h3><div class="blib">' +
    Object.entries(lib).sort((a, b) => b[1].last - a[1].last).map(([id, b]) =>
      '<button class="bcard' + (id === bookId ? ' on' : '') + '" data-book="' + esc(id) + '"><b>' + esc(b.title) + '</b><small>' +
      esc(b.folder) + '　' + b.lessons + '課　' + new Date(b.last).toLocaleDateString('ja-JP') + '</small></button>').join('') + '</div>';
  if(!tracks.length){ box.innerHTML = html + '<p class="pnote" style="text-align:left">フォルダを選ぶと、ここに教材の中身が出ます。</p>'; wireBook(box); return; }

  html += '<div class="bhead"><h2>' + esc(title) + '</h2>' +
    (book && book.answers ? '<span class="bnote">答え：' + esc(book.answers) + '</span>' : '') + '</div>';
  html += '<div class="seg wf bviews">' + [['progress','進み具合'], ['paper','紙の問題'], ['grammar','文法'], ['vocab','語彙']]
    .map(([k, l]) => '<button data-bv="' + k + '"' + (bview === k ? ' class="on"' : '') + '>' + l + '</button>').join('') + '</div>';

  const defs = paperDefs(), last = paperLatest();
  if(bview === 'progress'){
    const V = vocab();
    html += '<div class="btable"><div class="brow bth"><span>課</span><span>聴いた</span><span>練習の正答率</span><span>紙の問題</span><span>覚えた語</span></div>';
    ld.forEach((x, li) => {
      const heard = x.tracks.filter(t => done.has(t.name)).length;
      const rt = rateOf(x.ids);
      const ps = paperScore(x.L.id, defs, last);
      const vs = V.out[li]; const vk = vs.filter(e => wordLevel(e.w) === 2).length;
      html += '<div class="brow"><span class="nm">' + esc(x.L.title) + '</span>' +
        '<span>' + heard + ' / ' + x.tracks.length + '</span>' +
        '<span>' + (x.ids.size ? (rt ? rt.r + '%　' + rt.n + '回' : 'まだ') : '—') + '</span>' +
        '<span>' + (ps.tot ? (ps.done ? fmtN(ps.got) + ' / ' + ps.tot : 'まだ　' + ps.tot + '問') : '—') + '</span>' +
        '<span>' + (vs.length ? vk + ' / ' + vs.length : '—') + '</span></div>';
    });
    html += '</div><p class="bfoot">— はその課にまだ中身が無いもの。練習の正答率は直近50回。紙の問題は ○＝1・△＝0.5 で数える（最後に付けた印）。</p>';
  }
  else if(bview === 'paper'){
    html += '<p class="bfoot" style="margin-top:0">マスを押すと ○ → △ → × の順に付く。前の印は消さずに残る（やり直した回も履歴に残る）。問題は解きながら足していく。</p>';
    ld.forEach(x => {
      const L = x.L, exs = defs[L.id] || [];
      const ps = paperScore(L.id, defs, last);
      html += '<section class="ovsec bpaper"><div class="ovhead"><b>' + esc(L.title) + '</b><span>' + (ps.tot ? fmtN(ps.got) + ' / ' + ps.tot : '') + '</span></div>';
      exs.forEach(ex => {
        html += '<div class="pex"><span class="nm">' + esc(ex.label) + '</span><div class="pcells">';
        for(let n = 1; n <= ex.count; n++){
          const r = last[L.id + '|' + ex.id + '|' + n];
          html += '<button class="pc' + (r ? ' r' + r.r : '') + '" data-l="' + esc(L.id) + '" data-ex="' + esc(ex.id) + '" data-n="' + n + '" title="' +
            (r ? new Date(r.t).toLocaleDateString('ja-JP') : 'まだ') + '"><small>' + n + '</small>' + (r ? PAPER[r.r][0] : '') + '</button>';
        }
        html += '</div></div>';
      });
      html += '<form class="addex" data-l="' + esc(L.id) + '"><input name="label" placeholder="問題の名前（Bài tập 1 など）" required>' +
        '<input name="count" type="number" min="1" max="60" value="5" aria-label="問の数"><button>問題を足す</button></form></section>';
    });
  }
  else if(bview === 'grammar'){
    const G = grammar();
    const any = G.out.some(a => a.length) || G.rest.length;
    if(!any) html += '<p class="pnote" style="text-align:left">この教材には文法メモ（notes.json）がまだありません。</p>';
    const sec = (name, list) => list.length ? '<section class="bsec"><h3 class="ovh">' + esc(name) + '<small>' + list.length + '</small></h3>' +
      list.map(p => {
        const key = p.match;
        const open = bopen === key;
        let ex = '';
        if(open){
          const ss = sentsWith(p.match, p.li).filter(s => !(p.not && s.m.includes(p.not))).slice(0, 8);
          ex = '<div class="gex">' + (ss.length ? ss.map((s, i) => '<button class="gs" data-i="' + i + '">' + esc(s.seg.text) + '</button>').join('') : '<span class="pnote">本文に例がありません</span>') + '</div>';
          gexCache = ss;
        }
        return '<div class="gram' + (open ? ' open' : '') + '"><button class="gt" data-g="' + esc(key) + '"><b>' + esc(p.title || p.match) + '</b><span>' + esc(p.body) + '</span></button>' + ex + '</div>';
      }).join('') + '</section>' : '';
    ld.forEach((x, li) => { html += sec(x.L.title, G.out[li]); });

  else if(bview === 'vocab'){
    const V = vocab();
    const vf = load('b:vf', '');
    html += '<input class="bfilter" id="vfilter" placeholder="語か意味でしぼる" value="' + esc(vf) + '" autocomplete="off">';
    if(V.out.some(a => a.some(e => e.syl))) html += '<p class="bfoot" style="margin-top:0">この教材には語の台帳（lexicon.json）が無いので、本文に出た音節を最初に出た課に並べています。押すと、その語を含む最初の文が鳴ります。</p>';
    const q = vf.toLowerCase();
    const sec = (name, list) => {
      const l2 = q ? list.filter(e => e.w.includes(q) || (e.ja || '').toLowerCase().includes(q)) : list;
      if(!l2.length) return '';
      return '<section class="bsec"><h3 class="ovh">' + esc(name) + '<small>' + l2.length + '</small></h3><div class="vgrid">' + l2.map(e => {
        const lv = wordLevel(e.w);
        const han = (e.mo && e.mo !== '—') ? e.mo.split('+').map(m => (lex.morphemes[m] || {}).kanji || '').join('') : '';
        return '<button class="vw lv' + lv + '" data-w="' + esc(e.w) + '"><b>' + esc(e.w) + '</b>' + (han ? '<i>' + esc(han) + '</i>' : '') +
          '<span>' + esc(e.ja) + '</span>' + (e.kept ? '<em>貯めた</em>' : '') + '</button>';
      }).join('') + '</div></section>';
    };
    ld.forEach((x, li) => { html += sec(x.L.title, V.out[li]); });
    html += sec('課の分からないもの', V.rest);
  }

  html += '<div class="bport"><b>記録を運ぶ</b><span>練習の箱・答えの履歴・紙の問題・貯めた語は、このブラウザの中だけにあります。別のブラウザや端末へは、書き出したファイルを読み込んで運びます。</span>' +
    '<button id="bexp">記録を書き出す</button><button id="bimp">記録を読み込む</button><input type="file" id="bimpf" accept=".json,application/json" hidden></div>';

  box.innerHTML = html;
  wireBook(box);
}
let gexCache = [];
const fmtN = n => String(Math.round(n * 10) / 10);

function wireBook(box){
  box.querySelectorAll('.bcard').forEach(b => b.addEventListener('click', async ()=>{
    const id = b.dataset.book;
    if(id === bookId && tracks.length) return;
    const h = await getDir('book:' + id);
    try{
      if(h && h.requestPermission && await h.requestPermission({mode: 'read'}) === 'granted'){ await openDir(h, true); return; }
    }catch(e){}
    b.querySelector('small').textContent = 'このフォルダは開き直せません。「フォルダを選ぶ」から選んでください';
  }));
  box.querySelectorAll('[data-bv]').forEach(b => b.addEventListener('click', ()=>{ bview = b.dataset.bv; save('b:view', bview); renderBook(); }));
  box.querySelectorAll('.pc').forEach(b => b.addEventListener('click', ()=>{
    const k = b.dataset.l + '|' + b.dataset.ex + '|' + b.dataset.n;
    const cur = paperLatest()[k];
    const nx = !cur ? 'o' : cur.r === 'o' ? 's' : cur.r === 's' ? 'x' : 'o';
    const recs = paperRecs();
    recs.push({l: b.dataset.l, ex: b.dataset.ex, n: Number(b.dataset.n), r: nx, t: Date.now()});
    save('paper:' + bookId, recs);
    renderBook();
  }));
  box.querySelectorAll('.addex').forEach(f => f.addEventListener('submit', e=>{
    e.preventDefault();
    const own = load('paperdef:' + bookId, {});
    const l = f.dataset.l;
    const label = f.label.value.trim(), count = Math.max(1, Math.min(60, Number(f.count.value) || 1));
    if(!label) return;
    own[l] = own[l] || [];
    own[l].push({id: 'u' + Date.now().toString(36), label, count});
    save('paperdef:' + bookId, own);
    renderBook();
  }));
  box.querySelectorAll('.gt').forEach(b => b.addEventListener('click', ()=>{ bopen = bopen === b.dataset.g ? null : b.dataset.g; renderBook(); }));
  box.querySelectorAll('.gs').forEach(b => b.addEventListener('click', ()=> playSent(gexCache[Number(b.dataset.i)])));
  box.querySelectorAll('.vw').forEach(b => b.addEventListener('click', ()=>{
    const s = sentsWith(' ' + b.dataset.w + ' ', -1, 'n')[0];
    if(s) playSent(s);
  }));
  const vfi = box.querySelector('#vfilter');
  const vrun = ()=>{
    save('b:vf', vfi.value);
    const pos = vfi.selectionStart;
    renderBook();
    const n = $('#vfilter'); n.focus(); n.setSelectionRange(pos, pos);
  };
  if(vfi){
    vfi.addEventListener('input', e => { if(!e.isComposing) vrun(); });
    vfi.addEventListener('compositionend', vrun);
  }
  const ex = box.querySelector('#bexp');
  if(ex) ex.addEventListener('click', exportAll);
  const im = box.querySelector('#bimp');
  if(im) im.addEventListener('click', ()=> $('#bimpf').click());
  const imf = box.querySelector('#bimpf');
  if(imf) imf.addEventListener('change', async ()=>{
    const f = imf.files[0]; if(!f) return;
    let d = null; try{ d = JSON.parse(await f.text()); }catch(e){}
    if(!d || d.app !== 'oto-drill' || !d.keys){ alert('音声ドリルの記録のファイルではありません。'); return; }
    if(!confirm('いまのブラウザの記録を消して、このファイルの中身で置き換えます（' + Object.keys(d.keys).length + '項目・' + d.at + ' に書き出したもの）。')) return;
    importing = true;
    const mine = []; for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k.startsWith('otodrill:')) mine.push(k); }
    mine.forEach(k => localStorage.removeItem(k));
    Object.entries(d.keys).forEach(([k, v]) => { if(k.startsWith('otodrill:') && typeof v === 'string'){ try{ localStorage.setItem(k, v); }catch(e){} } });
    location.reload();
  });
}

/* 記録は otodrill: で始まる localStorage を丸ごと1つの JSON にする */
function exportAll(){
  const keys = {};
  for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k.startsWith('otodrill:')) keys[k] = localStorage.getItem(k); }
  const at = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify({app: 'oto-drill', version: 1, at, keys})], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'oto-drill_記録_' + at + '.json';
  a.click();
}

/* 操作卓の高さは画面幅で変わる。引いた語の窓が下に潜らないよう、実測して渡す。 */
(function(){
  const dock = $('#dock');
  const set = ()=> document.documentElement.style.setProperty('--dock-h', dock.offsetHeight + 'px');
  set();
  if(window.ResizeObserver) new ResizeObserver(set).observe(dock);
  else window.addEventListener('resize', set);
})();

window.addEventListener('beforeunload', saveLast);
})();
</script>
